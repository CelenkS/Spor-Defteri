    var workoutVal = wS.type === 'rest' ? 'Dinlenme' : (wS.done ? (wS.setCount + ' set · ' + wS.volume.toLocaleString('tr-TR') + ' kg') : 'Henüz kayıt yok');
    var html = '<div class="day-sum-card">' +
      '<div class="day-sum-head"><div class="day-sum-title">' + esc(label) + '</div>' +
      '<button type="button" class="day-sum-close" data-action="close-home-day">' + icon('close') + '</button></div>' +
      '<div class="day-sum-grid">' +
        '<div class="day-sum-item"><div class="day-sum-item-icon" style="background:var(' + ti.softVar + ');color:var(' + ti.colorVar + ')">' + icon('dumbbell') + '</div>' +
          '<div><div class="day-sum-item-label">' + ti.label + '</div><div class="day-sum-item-val">' + workoutVal + '</div></div></div>' +
        '<div class="day-sum-item"><div class="day-sum-item-icon" style="background:var(--cal-soft);color:var(--cal)">' + icon('food') + '</div>' +
          '<div><div class="day-sum-item-label">Beslenme</div><div class="day-sum-item-val">' + round(nut.cal).toLocaleString('tr-TR') + ' / ' + s.goalCalories.toLocaleString('tr-TR') + ' kcal</div></div></div>' +
        '<div class="day-sum-item"><div class="day-sum-item-icon" style="background:var(--accent-soft);color:var(--accent)">' + icon('pulse') + '</div>' +
          '<div><div class="day-sum-item-label">Kardiyo</div><div class="day-sum-item-val">' + (cardio.durationMin || 0) + ' dk</div></div></div>' +
        '<div class="day-sum-item"><div class="day-sum-item-icon" style="background:var(--legs-soft);color:var(--legs)">' + icon('footprints') + '</div>' +
          '<div><div class="day-sum-item-label">Adım</div><div class="day-sum-item-val">' + (d.steps ? d.steps.toLocaleString('tr-TR') : '—') + '</div></div></div>' +
        '<div class="day-sum-item"><div class="day-sum-item-icon" style="background:var(--carb-soft);color:var(--carb)">' + icon('droplet') + '</div>' +
          '<div><div class="day-sum-item-label">Su</div><div class="day-sum-item-val">' + (d.water ? d.water.toLocaleString('tr-TR') + ' ml' : '—') + '</div></div></div>' +
        '<div class="day-sum-item"><div class="day-sum-item-icon" style="background:var(--sleep-soft);color:var(--sleep)">' + icon('moon') + '</div>' +
          '<div><div class="day-sum-item-label">Uyku</div><div class="day-sum-item-val">' + (d.sleepHours ? d.sleepHours + ' sa' : '—') + '</div></div></div>' +
        '<div class="day-sum-item"><div class="day-sum-item-icon" style="background:var(--surface-2);color:var(--text-dim)">' + icon('note') + '</div>' +
          '<div><div class="day-sum-item-label">Not & Ajanda</div><div class="day-sum-item-val">' + (d.agenda.length ? (d.agenda.filter(function(a){return a.done;}).length + '/' + d.agenda.length + ' tamam') : ((d.notes&&d.notes.length) ? (d.notes.length + ' not') : '—')) + '</div></div></div>' +
      '</div>' +
      '<div class="day-sum-foot">' +
        '<button type="button" class="btn btn-ghost btn-sm" data-action="open-home-day-agenda" data-key="' + key + '">' + icon('calendarDay') + ' Plan/Not</button>' +
        '<button type="button" class="btn btn-primary btn-sm" data-action="open-home-day-edit" data-key="' + key + '">' + icon('dumbbell') + ' Günü Düzenle</button>' +
      '</div>' +
    '</div>';
    return html;
  }

  function homeDetailSection(hp, scopeDays, scopeNut, scopeCardio, scopeSteps){
    var s = state.settings;
    var n = scopeDays.length || 1;
    var goalCalScope = s.goalCalories * n;
    var calPct = goalCalScope>0 ? (scopeNut.cal/goalCalScope)*100 : 0;
    var goalProteinScope = s.goalProtein * n;
    var goalFatScope = s.goalFat * n;
    var goalCarbScope = s.goalCarb * n;

    var workoutDoneCount = 0;
    scopeDays.forEach(function(d){ if (dayWorkoutSummary(d).done) workoutDoneCount++; });
    var scopeNames = exerciseNamesForDays(scopeDays);
    var workoutExpanded = ui.homeWorkoutExpanded;

    var cardioGoalScope = hp==='day' ? (Math.round(s.cardioGoalMinPerWeek/7) || 1) : hp==='week' ? (s.cardioGoalMinPerWeek||1) : (Math.round(s.cardioGoalMinPerWeek * (n/7)) || 1);
    var cardioPct = (scopeCardio.durationMin/cardioGoalScope)*100;

    var html = '<div class="list" style="padding:2px 14px">' +
      homeCalRow(round(scopeNut.cal).toLocaleString('tr-TR') + ' / ' + round(goalCalScope).toLocaleString('tr-TR') + ' kcal', calPct, scopeNut.p, scopeNut.f, scopeNut.k, goalProteinScope, goalFatScope, goalCarbScope);

    if (hp === 'day'){
      var wS = dayWorkoutSummary(scopeDays[0]);
      var wTi = typeInfo(wS.type);
      html += '<button type="button" class="home-week-row home-week-row-toggle" data-action="toggle-home-workout">' +
        '<span class="home-week-dot" style="background:var(' + wTi.colorVar + ')"></span>' +
        '<div class="home-week-mid"><div class="home-week-name">Antrenman</div>' +
        '<div class="home-week-bar"><div class="home-week-bar-fill" style="width:' + (wS.type==='rest' ? 0 : (wS.done?100:0)) + '%;background:var(' + wTi.colorVar + ')"></div></div></div>' +
        '<div class="home-week-val">' + (wS.type==='rest' ? 'Dinlenme' : (wS.done ? 'Tamamlandı' : 'Bekliyor')) + '</div>' +
        '<span class="home-week-chevron' + (workoutExpanded?' is-open':'') + '">' + icon('chevronR') + '</span>' +
      '</button>' +
      (workoutExpanded ? (scopeNames.length ? exerciseChipsHtml(scopeNames) : '<div class="hint" style="padding:0 4px 10px">Bugün henüz işlenmiş hareket yok.</div>') : '');
    } else {
      var workoutGoalScope = hp==='week' ? (s.workoutGoalPerWeek||1) : (Math.round((s.workoutGoalPerWeek||1) * (n/7)) || 1);
      html += '<button type="button" class="home-week-row home-week-row-toggle" data-action="toggle-home-workout">' +
        '<span class="home-week-dot" style="background:var(--pull)"></span>' +
        '<div class="home-week-mid"><div class="home-week-name">Antrenman</div>' +
        '<div class="home-week-bar"><div class="home-week-bar-fill" style="width:' + Math.max(0,Math.min(100,(workoutDoneCount/workoutGoalScope)*100)) + '%;background:var(--pull)"></div></div></div>' +
        '<div class="home-week-val">' + workoutDoneCount + ' / ' + workoutGoalScope + ' gün</div>' +
        '<span class="home-week-chevron' + (workoutExpanded?' is-open':'') + '">' + icon('chevronR') + '</span>' +
      '</button>' +
      (workoutExpanded ? (scopeNames.length ? exerciseChipsHtml(scopeNames) : '<div class="hint" style="padding:0 4px 10px">Bu dönemde henüz işlenmiş hareket yok.</div>') : '');
    }

    html += homeWeekRow('Kardiyo', scopeCardio.durationMin + ' / ' + cardioGoalScope + ' dk', cardioPct, '--accent');

    if (scopeSteps){
      var stepsGoalScope = (s.stepsGoalPerDay||8000) * n;
      var stepsPct = stepsGoalScope>0 ? (scopeSteps.steps/stepsGoalScope)*100 : 0;
      html += homeWeekRow('Adım', scopeSteps.steps.toLocaleString('tr-TR') + ' / ' + stepsGoalScope.toLocaleString('tr-TR'), stepsPct, '--legs');
    }

    html += '</div>';

    return html;
  }

  /* ---------- Beslenme içeriği ---------- */
  function renderNutritionContent(){
    if (ui.period === 'month') return renderNutritionMonth();
    if (ui.period === 'week') return renderNutritionWeekList();
    return renderNutritionDayList();
  }

  function macroBar(val, goal, colorVar){
    var pct = goal>0 ? Math.max(0, Math.min(100, (val/goal)*100)) : 0;
    return '<div class="stat-bar-track"><div class="stat-bar-fill" style="width:' + pct + '%;background:var(' + colorVar + ')"></div></div>';
  }

  function currentWeekDays(){
    var t = new Date();
    var dow = t.getDay();
    var mondayOffset = (dow===0) ? 6 : dow-1;
    var start = new Date(t); start.setDate(t.getDate()-mondayOffset);
    var out = [];
    for (var i=0;i<7;i++){ var d = new Date(start); d.setDate(start.getDate()+i); out.push(d); }
    return out;
  }

  function renderNutritionSummary(scope){
    var s = state.settings;
    var days, label, dayCount;
    if (scope === 'day'){ days = [ui.cursor]; label = (keyForDate(ui.cursor)===todayKey() ? 'Bugün' : (ui.cursor.getDate() + ' ' + MONTHS[ui.cursor.getMonth()].slice(0,3))) + ' Alınan Kalori'; dayCount = 1; }
    else if (scope === 'week'){ days = currentWeekDays(); label = 'Bu Hafta Alınan Kalori'; dayCount = 7; }
    else { days = allDaysInMonth(ui.cursor.getFullYear(), ui.cursor.getMonth()); label = 'Bu Ay Alınan Kalori'; dayCount = days.length; }
    var t = sumNutritionForDays(days);
    var goalCal = s.goalCalories * dayCount;
    var goalP = s.goalProtein * dayCount;
    var goalF = s.goalFat * dayCount;
    var goalK = s.goalCarb * dayCount;
    var pctCal = goalCal>0 ? Math.min(100, (t.cal/goalCal)*100) : 0;

    var heroTapAttrs = scope==='day' ? ' data-action="open-today-detail" data-tab="nutrition" style="cursor:pointer"' : '';
    var html = '<div class="hero-card"' + heroTapAttrs + '>' + heroWatermark('food') +
      '<div class="hero-top"><div><div class="hero-label">' + label + '</div>' +
      '<div class="hero-big">' + t.cal.toLocaleString('tr-TR') + '<span>/ ' + goalCal.toLocaleString('tr-TR') + ' kcal</span></div></div>' +
      '<div class="hero-pill">%' + round(pctCal) + '</div></div>' +
      '<div class="hero-bar-track"><div class="hero-bar-fill" style="width:' + pctCal + '%"></div></div>' +
      '<div class="hero-foot"><span>Günlük hedef ' + s.goalCalories.toLocaleString('tr-TR') + ' kcal</span><span>Ort. gün ' + round(t.cal/dayCount) + ' kcal</span></div>' +
      (scope==='day' ? '<div class="hero-tap-hint">Girmek için dokun ' + icon('chevronR') + '</div>' : '') +
    '</div>';

    html += '<div class="stat-grid">' +
      macroStatCard('Protein', t.p, goalP, '--protein', 'g') +
      macroStatCard('Yağ', t.f, goalF, '--fat', 'g') +
      macroStatCard('Karbonhidrat', t.k, goalK, '--carb', 'g') +
      macroStatCard('Ortalama/gün', round(t.cal/dayCount), s.goalCalories, '--accent', 'kcal') +
    '</div>';

    html += renderWeightCard();
    return html;
  }

  function renderNutritionMonth(){
    var y = ui.cursor.getFullYear(), m = ui.cursor.getMonth();
    var days = allDaysInMonth(y, m);
    var html = renderNutritionSummary('month');

    html += '<div class="section-title">Günlere Göre Dağılım</div>';
    var withData = days.filter(function(d){ var x=dayNutritionTotals(keyForDate(d)); return x.cal>0; });
    if (!withData.length){
      html += '<div class="list"><div class="empty-state">Bu ay henüz beslenme kaydı yok. Bir güne dokunup ekleyebilirsin.</div></div>';
    } else {
      html += '<div class="list">' + withData.slice().reverse().slice(0,8).map(function(d){
        var key = keyForDate(d);
        var x = dayNutritionTotals(key);
        return dayRowHtml(d, key, 'nutrition', x);
      }).join('') + '</div>';
    }
    html += renderCalendarGrid('nutrition');
    return html;
  }

  function macroStatCard(label, val, goal, colorVar, unit){
    var pct = goal>0 ? Math.max(0, Math.min(100, (val/goal)*100)) : 0;
    return '<div class="stat-card">' +
      '<div class="stat-card-label">' + label + '</div>' +
      '<div class="stat-card-val" style="color:var(' + colorVar + ')">' + val.toLocaleString('tr-TR') + '<span>' + unit + '</span></div>' +
      macroBar(val, goal, colorVar) +
      '<div class="stat-bar-foot"><b>%' + round(pct) + '</b><span>hedef ' + goal.toLocaleString('tr-TR') + '</span></div>' +
    '</div>';
  }

  /* ---------- kilo hedefi kartı ---------- */
  function renderWeightCard(){
    var s = state.settings;
    var latest = latestWeight();
    if (!latest){
      return '<div class="stat-card" style="margin-top:10px">' +
        '<div class="stat-card-label">Kilo Hedefi</div>' +
        '<div class="hint" style="margin-top:8px">Henüz kilo kaydın yok.</div>' +
        '<button type="button" class="btn btn-ghost btn-sm btn-block" style="margin-top:10px" data-action="open-weight-modal">' + icon('plus') + ' Kilo Gir</button>' +
      '</div>';
    }
    var weekAgo = weightNDaysAgo(7);
    var weekChange = weekAgo ? round10(latest.kg - weekAgo.kg) : 0;
    var monthAgo = weightNDaysAgo(30);
    var monthChange = monthAgo ? round10(latest.kg - monthAgo.kg) : 0;
    var weekGood = goalMet(weekChange, s.weeklyWeightGoalKg);
    var monthGood = goalMet(monthChange, s.monthlyWeightGoalKg);
    return '<div class="stat-card" style="margin-top:10px">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
        '<div><div class="stat-card-label">Güncel Kilo</div><div class="stat-card-val">' + latest.kg + '<span>kg</span></div></div>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-action="open-weight-modal">' + icon('plus') + ' Gir</button>' +
      '</div>' +
      '<div style="display:flex;gap:16px;margin-top:12px">' +
        '<div><div class="stat-card-label">Haftalık</div><div class="num" style="font-weight:700;font-size:14px;color:var(' + (weekGood?'--good':'--bad') + ')">' + (weekChange>0?'+':'') + weekChange + ' kg</div><div class="hint">hedef ' + s.weeklyWeightGoalKg + ' kg</div></div>' +
        '<div><div class="stat-card-label">Aylık</div><div class="num" style="font-weight:700;font-size:14px;color:var(' + (monthGood?'--good':'--bad') + ')">' + (monthChange>0?'+':'') + monthChange + ' kg</div><div class="hint">hedef ' + s.monthlyWeightGoalKg + ' kg</div></div>' +
      '</div>' +
    '</div>';
  }

  /* ---------- vücut ölçüleri kartı (ana sayfa) ---------- */
  function photoThumb(p, tagLabel){
    return '<div class="measure-photo-thumb"><img src="' + p.dataUrl + '" alt=""><span class="measure-photo-tag">' + tagLabel + ' · ' + p.date + '</span></div>';
  }
  function renderMeasureCard(){
    var comparisons = allMeasurementComparisons();
    var photos = sortedPhotos();
    if (!comparisons.length && !photos.length){
      return '<div class="stat-card measure-card" style="margin-top:10px">' +
        '<div class="stat-card-label">Vücut Ölçüleri</div>' +
        '<div class="hint" style="margin-top:8px">Henüz ölçüm veya fotoğraf yok.</div>' +
        '<button type="button" class="btn btn-ghost btn-sm btn-block" style="margin-top:10px" data-action="open-measure-modal">' + icon('plus') + ' Ölçüm / Fotoğraf Ekle</button>' +
      '</div>';
    }
    var html = '<div class="stat-card measure-card" style="margin-top:10px">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
        '<div class="stat-card-label">Vücut Ölçüleri</div>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-action="open-measure-modal">' + icon('plus') + ' Gir</button>' +
      '</div>';
    if (comparisons.length){
      html += '<div class="measure-chip-row">' + comparisons.slice(0,4).map(function(c){
        var arrow = c.delta > 0 ? '↑' : (c.delta < 0 ? '↓' : '');
        return '<div class="measure-chip">' +
          '<div class="measure-chip-label">' + c.label + '</div>' +
          '<div class="measure-chip-val">' + c.latest.valueCm + '<span>cm</span></div>' +
          (c.count > 1 ? ('<div class="measure-chip-delta' + (c.delta!==0?'':' is-muted') + '">' + arrow + ' ' + Math.abs(c.delta) + ' cm</div>') : '<div class="measure-chip-delta is-muted">ilk kayıt</div>') +
        '</div>';
      }).join('') + '</div>';
    }
    if (photos.length){
      var firstPh = photos[0], lastPh = photos[photos.length-1];
      html += '<div class="measure-photo-row">' +
        photoThumb(firstPh, 'İlk') +
        (photos.length > 1 ? photoThumb(lastPh, 'Son') : '') +
      '</div>';
    }
    html += '</div>';
    return html;
  }

  /* ---------- takvim ---------- */
  function calendarCellState(dateObj, kind){
    var key = keyForDate(dateObj);
    if (kind === 'nutrition'){
      var t = dayNutritionTotals(key);
      var hasData = t.cal > 0;
      var goal = state.settings.goalCalories;
      var pct = goal>0 ? (t.cal/goal)*100 : 0;
      return { hasData:hasData, colorVar: hasData ? (pct>=85 && pct<=115 ? '--good' : '--cal') : null, softVar: hasData ? (pct>=85 && pct<=115 ? '--protein-soft' : '--cal-soft') : null };
    }
    if (kind === 'cardio'){
      var ct = dayCardioTotals(key);
      var hasCData = ct.durationMin > 0 || !!(state.days[key] && state.days[key].steps);
      return { hasData:hasCData, colorVar: hasCData ? '--accent' : null, softVar: hasCData ? '--accent-soft' : null };
    }
    var s = dayWorkoutSummary(dateObj);
    var ti = typeInfo(s.type);
    return { hasData:s.done, colorVar: ti.colorVar, softVar: ti.softVar, isRest: s.type==='rest' };
  }

  function renderCalendarGrid(kind){
    var y = ui.cursor.getFullYear(), m = ui.cursor.getMonth();
    var first = new Date(y, m, 1);
    var lead = (first.getDay()===0) ? 6 : first.getDay()-1;
    var n = daysInMonth(y, m);
    var html = '<div class="section-title">Takvim</div><div class="cal-grid cal-weekday-row">' +
      ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(function(w){ return '<div class="cal-weekday">' + w + '</div>'; }).join('') +
    '</div><div class="cal-grid">';
    for (var i=0;i<lead;i++) html += '<div class="cal-cell cal-cell-empty"></div>';
    for (var day=1; day<=n; day++){
      var d = new Date(y, m, day);
      var key = keyForDate(d);
      var isToday = key === todayKey();
      var cs = calendarCellState(d, kind);
      var bg = cs.hasData ? ('background:var(' + cs.softVar + ');color:var(' + cs.colorVar + ')') : (cs.isRest ? 'background:var(--rest-soft);color:var(--text-faint)' : '');
      html += '<button type="button" class="cal-cell' + (isToday?' is-today':'') + '" style="' + bg + '" data-action="open-day" data-key="' + key + '">' +
        '<span>' + day + '</span>' +
        (cs.hasData ? '<span class="cal-dot" style="background:var(' + cs.colorVar + ')"></span>' : '') +
      '</button>';
    }
    html += '</div>';
    return html;
  }

  function dayRowHtml(dateObj, key, kind, nutritionTotals){
    var wd = WEEKDAYS_SHORT[dateObj.getDay()];
    var isToday = key === todayKey();
    var rightHtml, midHtml, iconHtml;
    if (kind === 'nutrition'){
      var goal = state.settings.goalCalories;
      var hasData = nutritionTotals.cal > 0;
      iconHtml = '<div class="day-icon" style="background:var(' + (hasData?'--cal-soft':'--surface-3') + ');color:var(' + (hasData?'--cal':'--text-faint') + ')">' + icon('food') + '</div>';
      rightHtml = hasData
        ? '<div class="day-right-val">' + nutritionTotals.cal.toLocaleString('tr-TR') + '<span style="font-weight:500;color:var(--text-faint);font-size:11px"> kcal</span></div>' +
          '<div class="day-right-sub">P ' + nutritionTotals.p + ' · Y ' + nutritionTotals.f + ' · K ' + nutritionTotals.k + '</div>'
        : '<div class="day-right-val is-empty">—</div>';
      midHtml = hasData
        ? '<div class="day-mid-sub">Hedefin %' + (goal>0?round((nutritionTotals.cal/goal)*100):0) + '’i</div>'
        : '<div class="day-mid-sub">Kayıt yok</div>';
    } else if (kind === 'cardio'){
      var ct = dayCardioTotals(key);
      var daySteps = (state.days[key] && state.days[key].steps) || null;
      var hasCData = ct.durationMin > 0;
      var cIconName = hasCData ? 'pulse' : 'footprints';
      iconHtml = '<div class="day-icon" style="background:var(' + ((hasCData||daySteps)?'--accent-soft':'--surface-3') + ');color:var(' + ((hasCData||daySteps)?'--accent':'--text-faint') + ')">' + icon(cIconName) + '</div>';
      rightHtml = hasCData
        ? '<div class="day-right-val">' + ct.durationMin + '<span style="font-weight:500;color:var(--text-faint);font-size:11px"> dk</span></div><div class="day-right-sub">' + ct.calories.toLocaleString('tr-TR') + ' kcal</div>'
        : (daySteps ? ('<div class="day-right-val">' + daySteps.toLocaleString('tr-TR') + '<span style="font-weight:500;color:var(--text-faint);font-size:11px"> adım</span></div><div class="day-right-sub">≈' + stepsCalories(daySteps) + ' kcal</div>') : '<div class="day-right-val is-empty">—</div>');
      midHtml = (hasCData || daySteps) ? ('<div class="day-mid-sub">' + ct.count + ' kayıt' + (daySteps ? (' · ' + daySteps.toLocaleString('tr-TR') + ' adım') : '') + '</div>') : '<div class="day-mid-sub">Kayıt yok</div>';
    } else {

      '<div class="type-select-row" style="justify-content:flex-start;margin-bottom:12px">' +
      WORKOUT_TYPES.map(function(t){
        return '<button type="button" class="type-pill' + (currentType===t.key?' is-active':'') + '" style="background:var(' + t.softVar + ');color:var(' + t.colorVar + ')" data-action="set-day-type" data-key="' + key + '" data-type="' + t.key + '">' + t.label + '</button>';
      }).join('') +
      '</div>';
    if (d.workoutType && d.workoutType !== planType){
      html += '<button type="button" class="btn btn-ghost btn-sm" data-action="reset-day-type" data-key="' + key + '" style="margin-bottom:14px">Plandaki güne dön (' + typeInfo(planType).label + ')</button>';
    }
    if (currentType === 'rest' && !d.exercises.length){
      html += '<div class="empty-state">Bugün dinlenme günü. İstersen yukarıdan bir tür seçip yine de antrenman kaydı girebilirsin.</div>';
      return html;
    }
    if (currentType === 'rest'){
      html += '<div class="hint" style="margin-bottom:12px">Bugün dinlenme günü olarak işaretli, ama aşağıda kayıtlı egzersizlerin var.</div>';
    }
    var planItems = currentType === 'rest' ? [] : (state.exercisePlans[currentType] || []);
    if (planItems.length){
      html += '<div class="section-title">Plandan Seç</div><div class="check-list">' +
        planItems.map(function(pe){
          var isChecked = d.exercises.some(function(ex){ return ex.sourcePlanId === pe.id || ex.name.toLowerCase() === pe.name.toLowerCase(); });
          var subParts = [];
          var peRegion = regionForExercise(pe.name);
          if (peRegion) subParts.push(peRegion);
          if (pe.sets && pe.repMin && pe.repMax) subParts.push(pe.sets + '×' + pe.repMin + '-' + pe.repMax);
          if (pe.targetWeight) subParts.push('Hedef ' + pe.targetWeight + 'kg');
          return '<button type="button" class="check-row' + (isChecked?' is-checked':'') + '" data-action="toggle-exercise-plan-check" data-key="' + key + '" data-planid="' + pe.id + '" data-type="' + currentType + '">' +
            '<span class="check-circle">' + icon('check') + '</span>' +
            '<div class="check-row-main"><div class="check-row-name">' + esc(pe.name) + '</div>' +
            (subParts.length ? '<div class="check-row-sub">' + subParts.join(' · ') + '</div>' : '') + '</div>' +
          '</button>';
        }).join('') + '</div>';
    }
    html += '<div class="section-title">Egzersizler</div>';
    if (!d.exercises.length){
      html += '<div class="empty-state">Henüz egzersiz eklenmedi.</div>';
    } else {
      var activeExId = ui.activeExerciseId;
      if (!d.exercises.some(function(ex){ return ex.id === activeExId; })){
        activeExId = d.exercises.length ? d.exercises[d.exercises.length-1].id : null;
      }
      html += d.exercises.map(function(ex){
        var planEntry = (state.exercisePlans[currentType]||[]).filter(function(pe){ return pe.name.toLowerCase()===ex.name.toLowerCase(); })[0];
        var maxToday = ex.sets.reduce(function(mx,s){ return Math.max(mx, num(s.weight)); }, 0);
        var exRegion = regionForExercise(ex.name);
        var regionNote = exRegion ? '<span class="region-tag">' + esc(exRegion) + '</span>' : '';
        var isActive = ex.id === activeExId;
        if (!isActive){
          var lastSetC = ex.sets.length ? ex.sets[ex.sets.length-1] : null;
          var summary = ex.sets.length ? (ex.sets.length + ' set · son ' + lastSetC.reps + '×' + lastSetC.weight + 'kg') : 'Henüz set yok';
          return '<div class="ex-card is-collapsed" data-action="activate-exercise" data-exid="' + ex.id + '">' +
            '<div class="ex-card-head"><div><span class="ex-card-name">' + esc(ex.name) + '</span> ' + regionNote +
            '<div class="ex-card-summary">' + esc(summary) + '</div></div>' +
            '<div style="display:flex;align-items:center;gap:8px">' +
            '<span class="ex-card-collapse-hint">Devam et</span>' +
            '<button class="del-btn" data-action="delete-exercise" data-key="' + key + '" data-exid="' + ex.id + '">' + icon('trash') + '</button>' +
            '</div></div></div>';
        }
        var targetNote = planEntry && planEntry.targetWeight ? ('<span style="color:' + (maxToday>=planEntry.targetWeight?'var(--good)':'var(--text-faint)') + '">Hedef ' + planEntry.targetWeight + 'kg' + (maxToday>=planEntry.targetWeight?' ✓':'') + '</span>') : '';
        var lastSet = ex.sets.length ? ex.sets[ex.sets.length-1] : null;
        var histPerf = !lastSet ? lastPerformance(ex.name, key) : null;
        var prefillReps = lastSet ? lastSet.reps : (histPerf ? histPerf.reps : (planEntry && planEntry.repMin ? planEntry.repMin : ''));
        var prefillWeight = lastSet ? lastSet.weight : (histPerf ? histPerf.weight : (planEntry && planEntry.targetWeight ? planEntry.targetWeight : ''));
        var suggestion = (!lastSet) ? suggestedTarget(ex.name, key) : null;
        var histNote = (!lastSet && histPerf) ? ('<div class="hint" style="margin-top:2px">Son sefer: ' + histPerf.reps + '×' + histPerf.weight + 'kg' + (suggestion ? (' · <span style="color:var(--accent);font-weight:600">Öneri: ' + suggestion.weight + 'kg × ' + suggestion.reps + '</span>') : '') + '</div>') : '';
        var prevBest = previousSessionBest(ex.name, key);
        var isNewPr = !!(prevBest && maxToday > prevBest.weight);
        var prFirstIdx = -1;
        if (isNewPr){
          for (var pi=0; pi<ex.sets.length; pi++){ if (num(ex.sets[pi].weight) === maxToday){ prFirstIdx = pi; break; } }
        }
        var todayVol = sessionVolume(ex.sets);
        var prevVol = previousSessionVolume(ex.name, key);
        var analysisNote = '';
        if (maxToday > 0){
          if (isNewPr){
            analysisNote += '<div class="hint" style="margin-top:2px;color:var(--good);font-weight:700">' + icon('trophy','mini-ico') + ' Yeni Rekor! Önceki: ' + prevBest.weight + ' kg</div>';
          } else if (prevBest){
            analysisNote += '<div class="hint" style="margin-top:2px">Önceki en iyi: ' + prevBest.weight + ' kg' + weightDeltaBadge(maxToday, prevBest.weight) + '</div>';
          }
          if (prevVol !== null){
            analysisNote += '<div class="hint" style="margin-top:2px">Hacim: ' + round(todayVol).toLocaleString('tr-TR') + ' kg' + volumeDeltaBadge(todayVol, prevVol) + ' (geçen: ' + round(prevVol).toLocaleString('tr-TR') + ' kg)</div>';
          }
        }
        return '<div class="ex-card"><div class="ex-card-head"><div><button type="button" class="ex-card-name" data-action="open-exercise-history" data-name="' + esc(ex.name) + '" style="background:none;border:none;padding:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer;color:inherit;font:inherit">' + esc(ex.name) + '</button> ' + regionNote + (targetNote ? '<div class="hint" style="margin-top:2px">' + targetNote + '</div>' : '') + histNote + analysisNote + '</div>' +
          '<button class="del-btn" data-action="delete-exercise" data-key="' + key + '" data-exid="' + ex.id + '">' + icon('trash') + '</button></div>' +
          (ex.sets.length ? ('<div class="set-head-row"><span></span><span>Tekrar</span><span>Kilo (kg)</span><span></span></div>' +
            ex.sets.map(function(s, i){
              var rowPr = (i === prFirstIdx);
              return '<div class="set-row"><span class="set-row-label">' + (i+1) + '</span><div class="num">' + s.reps + '</div><div class="num">' + s.weight + ' kg' + (rowPr ? (' <span class="mini-ico" style="color:var(--good)">' + icon('trophy') + '</span>') : '') + '</div>' +
                '<button class="del-btn" data-action="delete-set" data-key="' + key + '" data-exid="' + ex.id + '" data-setidx="' + i + '">' + icon('trash') + '</button></div>';
            }).join('')) : '<div class="hint" style="margin-bottom:8px">Henüz set yok.</div>') +
          '<div class="set-add-row">' +
            '<div class="stepper-row">' +
              '<div class="stepper-field"><div class="stepper-field-label">Tekrar</div><div class="stepper">' +
                '<button type="button" class="stepper-btn" data-action="step-input" data-target="reps-' + ex.id + '" data-step="-1" data-min="0">−</button>' +
                '<input type="text" inputmode="numeric" id="reps-' + ex.id + '" value="' + prefillReps + '">' +
                '<button type="button" class="stepper-btn" data-action="step-input" data-target="reps-' + ex.id + '" data-step="1" data-min="0">+</button>' +
              '</div></div>' +
              '<div class="stepper-field"><div class="stepper-field-label">Kilo (kg)</div><div class="stepper">' +
                '<button type="button" class="stepper-btn" data-action="step-input" data-target="weight-' + ex.id + '" data-step="-2.5" data-min="0">−</button>' +
                '<input type="text" inputmode="decimal" id="weight-' + ex.id + '" value="' + prefillWeight + '">' +
                '<button type="button" class="stepper-btn" data-action="step-input" data-target="weight-' + ex.id + '" data-step="2.5" data-min="0">+</button>' +
              '</div></div>' +
            '</div>' +
            '<div class="set-add-actions">' +
              (lastSet ? '<button type="button" class="btn btn-ghost btn-sm" data-action="repeat-last-set" data-key="' + key + '" data-exid="' + ex.id + '">' + icon('plus') + ' Son Seti Tekrarla</button>' : '') +
              '<button type="button" class="btn btn-primary btn-sm" data-action="add-set" data-key="' + key + '" data-exid="' + ex.id + '">' + icon('plus') + ' Set Ekle</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }
    html += '<details class="manual-add"' + (ui.manualAddOpen.workout ? ' open' : '') + '><summary data-action="toggle-manual-add" data-section="workout">' + icon('plus') + ' Manuel Egzersiz Ekle</summary>' +
      '<div class="form">' +
        '<div class="field"><label>Yeni egzersiz</label><input id="dd-ex-name" type="text" placeholder="Örn. Squat"></div>' +
        '<button type="button" class="btn btn-primary btn-block" data-action="add-exercise" data-key="' + key + '">' + icon('plus') + ' Egzersiz Ekle</button>' +
      '</div></details>';
    return html;
  }

  /* ---------- Ajanda (günlük plan + notlar) ---------- */
  function renderAgendaContent(){
    var key = ui.agendaKey || todayKey();
    var dateObj = parseKey(key);
    var html = '<div class="tab-sub-row">' +
      [{key:'plan',label:'Plan'},{key:'notes',label:'Notlar'}].map(function(t){
        return '<button type="button" class="tab-sub-btn' + (ui.agendaSubTab===t.key?' is-active':'') + '" data-action="set-agenda-subtab" data-subtab="' + t.key + '">' + t.label + '</button>';
      }).join('') +
    '</div>';

  function renderAgendaDateNav(key, dateObj){
    var isToday = key === todayKey();
    var label = dateObj.getDate() + ' ' + MONTHS[dateObj.getMonth()] + ' ' + WEEKDAYS_FULL[dateObj.getDay()] + (isToday ? ' · Bugün' : '');
    return '<div class="month-nav" style="padding:12px 0 2px">' +
      '<button class="month-nav-btn" data-action="agenda-day-prev">' + icon('chevronL') + '</button>' +
      '<div class="month-nav-label" style="font-size:16px">' + esc(label) + '</div>' +
      '<button class="month-nav-btn" data-action="agenda-day-next">' + icon('chevronR') + '</button>' +
    '</div>';
  }

  function renderAgendaPlanSection(key){
    var d = dayOf(key);
    var items = d.agenda.slice().sort(function(a,b){
      if (a.time && b.time) return a.time < b.time ? -1 : a.time > b.time ? 1 : 0;
      if (a.time && !b.time) return -1;
      if (!a.time && b.time) return 1;
      return 0;
    });
    var html = '<div class="section-title">Yapılacaklar</div>';
    if (!items.length){
      html += '<div class="empty-state">Bu gün için henüz madde yok.</div>';
    } else {
      html += '<div class="check-list">' + items.map(function(it){
        return '<div class="check-row' + (it.done?' is-checked':'') + '" data-action="toggle-agenda-item" data-key="' + key + '" data-id="' + it.id + '">' +
          '<span class="check-circle">' + icon('check') + '</span>' +
          '<div class="check-row-main"><div class="check-row-name' + (it.done?' is-done-text':'') + '">' +
          (it.time ? '<span class="num" style="color:var(--text-faint);margin-right:7px">' + esc(it.time) + '</span>' : '') +
          esc(it.text) + '</div></div>' +
          '<button class="del-btn" data-action="delete-agenda-item" data-key="' + key + '" data-id="' + it.id + '">' + icon('trash') + '</button>' +
        '</div>';
      }).join('') + '</div>';
    }
    html += '<div class="form" style="margin-top:14px">' +
      '<div class="field-row cols-2">' +
        '<div class="field"><label>Saat (ops.)</label><input id="ag-time" type="text" inputmode="numeric" placeholder="09:30" maxlength="5"></div>' +
        '<div class="field"><label>Madde</label><input id="ag-text" type="text" placeholder="Örn. Market alışverişi"></div>' +
      '</div>' +
      '<button type="button" class="btn btn-primary btn-block" data-action="add-agenda-item" data-key="' + key + '">' + icon('plus') + ' Ekle</button>' +
    '</div>';
    return html;
  }

  function renderNotesSection(key){

          '<button class="del-btn" data-action="delete-note-item" data-key="' + key + '" data-id="' + it.id + '">' + icon('trash') + '</button>' +

      '<button type="button" class="btn btn-primary btn-block" data-action="add-note-item" data-key="' + key + '">' + icon('plus') + ' Ekle</button>' +

      'auth/requires-recent-login': 'Bu işlem için yeniden giriş yapman gerekiyor, sayfayı yenileyip tekrar dene.',
      'auth/operation-not-allowed': 'E-posta/şifre girişi Firebase projende henüz açılmamış (Authentication > Sign-in method > Email/Password).',
      'auth/user-not-found': 'Bu e-postayla kayıtlı hesap bulunamadı.',
      'auth/wrong-password': 'Şifre yanlış.',
      'auth/invalid-credential': 'E-posta veya şifre yanlış.',

    };
    return map[code] || ('Bir hata oldu: ' + (err && err.message ? err.message : code));
  }
  function renderAccountSyncSection(){
    var curUser = null;
    try { if (typeof firebase !== 'undefined' && firebase.auth) curUser = firebase.auth().currentUser; } catch(eU){ curUser = null; }
    var msgHtml = accountSyncMsg ? ('<div class="hint" style="padding:0 2px 8px;color:var(' + (accountSyncMsg.type==='error'?'--bad':'--good') + ')">' + esc(accountSyncMsg.text) + '</div>') : '';
    if (!curUser){
      return '<div class="section-title" style="margin-top:22px">Cihazlar Arası Senkron</div><div class="form">' +
        msgHtml + '<div class="hint" style="padding:0 2px 8px">İnternete bağlanıp oturumun açılmasını bekle.</div></div>';
    }
    var isPermanent = !curUser.isAnonymous;
    var statusLine = isPermanent
      ? ('<div class="hint" style="padding:0 2px 8px">Bu hesap kalıcı: <b>' + esc(curUser.email || '') + '</b>. Diğer cihazlarda aynı e-posta/şifre ile giriş yaparsan aynı verilere ulaşırsın.</div>')

  /* ---------- kaydetme (Firebase Firestore) ---------- */
  function initFirebase(){
    if (typeof firebase === 'undefined' || !window.firebaseConfig){
      saveMode = 'local'; renderHeaderStatus();
      return;
    }
    try {
      firebase.initializeApp(window.firebaseConfig);
      db = firebase.firestore();
      try { db.enablePersistence({ synchronizeTabs:true }).catch(function(){}); } catch(e0){}
    } catch(eInit){ saveMode = 'local'; renderHeaderStatus(); return; }

    firebase.auth().onAuthStateChanged(function(user){
      if (user){
        if (uid === user.uid && docRef) { renderAll(); return; } /* same user (e.g. just linked), just refresh UI */
        uid = user.uid;
        docRef = db.collection('sporDefteri').doc(uid);
        firstSnapshotDone = false;
        attachSnapshot();
      }
    });
    firebase.auth().signInAnonymously().catch(function(errAuth){
      saveMode = 'local'; renderHeaderStatus();
    });
  }
  function attachSnapshot(){
    if (typeof unsubscribeSnapshot === 'function') { try { unsubscribeSnapshot(); } catch(eU0){} }
    unsubscribeSnapshot = docRef.onSnapshot(function(snap){
      if (!snap.exists){
        if (!firstSnapshotDone){
          firstSnapshotDone = true;
          if (!healthImportApplied){ healthImportApplied = true; applyHealthImportFromUrl(); }
          writeStateToFirestore(state);
        }
        return;
      }
      firstSnapshotDone = true;
      if (snap.metadata.hasPendingWrites) return;
      state = normalizeState(snap.data());
      if (!healthImportApplied){ healthImportApplied = true; applyHealthImportFromUrl(); }
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch(e){}
      saveMode = 'saved';
      renderAll();
    }, function(errSnap){
      saveMode = 'local'; renderHeaderStatus();
    });
  }
  function writeStateToFirestore(s){
    if (!docRef){ saveMode = 'local'; renderHeaderStatus(); return; }
    docRef.set(s).then(function(){
      saveMode = 'saved'; renderHeaderStatus();
    }).catch(function(errWrite){
      saveMode = 'local'; renderHeaderStatus();
    });
  }
  function scheduleSave(){
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch(e){}
    if (saveTimer) clearTimeout(saveTimer);
    saveMode = 'saving';
    renderHeaderStatus();
    saveTimer = setTimeout(doSave, 650);
  }
  function doSave(){
    writeStateToFirestore(state);
  }

    if (e.target && e.target.id === 'ai-input' && e.key === 'Enter' && !e.shiftKey){

  function onRootClick(e){
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');

    if (action === 'set-tab'){ ui.tab = btn.getAttribute('data-tab'); ui.period = 'day'; ui.cursor = new Date(); renderAll(); return; }
    if (action === 'set-period'){
      ui.period = btn.getAttribute('data-period');
      if (ui.period === 'day') ui.cursor = new Date();
      renderAll(); return;
    }
    if (action === 'month-prev'){
      ui.cursor = ui.period === 'day'
        ? new Date(ui.cursor.getFullYear(), ui.cursor.getMonth(), ui.cursor.getDate()-1)
        : new Date(ui.cursor.getFullYear(), ui.cursor.getMonth()-1, 1);
      renderAll(); return;
    }
    if (action === 'month-next'){
      ui.cursor = ui.period === 'day'
        ? new Date(ui.cursor.getFullYear(), ui.cursor.getMonth(), ui.cursor.getDate()+1)
        : new Date(ui.cursor.getFullYear(), ui.cursor.getMonth()+1, 1);
      renderAll(); return;
    }
    if (action === 'open-day'){ ui.dayDetailKind = ui.tab; ui.dayDetailKey = btn.getAttribute('data-key'); renderAll(); return; }
    if (action === 'close-day'){ ui.dayDetailKey = null; ui.dayDetailKind = null; ui.manualAddOpen = { nutrition:false, workout:false }; renderAll(); return; }
    if (action === 'toggle-manual-add'){
      var maSection = btn.getAttribute('data-section');
      ui.manualAddOpen[maSection] = !ui.manualAddOpen[maSection];
      renderAll(); return;
    }
    if (action === 'select-week-region'){
      var wrRegion = btn.getAttribute('data-region');
      ui.selectedRegion = (ui.selectedRegion === wrRegion) ? null : wrRegion;
      renderAll(); return;
    }
    if (action === 'open-today-detail'){
      var odTab = btn.getAttribute('data-tab');
      ui.tab = odTab; ui.period = 'day'; ui.dayDetailKind = odTab; ui.dayDetailKey = keyForDate(ui.cursor);
      renderAll(); return;
    }
    if (action === 'open-home-tile'){
      var htTab = btn.getAttribute('data-tab');
      if (ui.homePeriod === 'day'){
        ui.dayDetailKind = htTab; ui.dayDetailKey = todayKey();
      } else {
        ui.tab = htTab; ui.period = ui.homePeriod; ui.cursor = new Date();
      }
      renderAll(); return;
    }
    if (action === 'set-home-period'){ ui.homePeriod = btn.getAttribute('data-period'); renderAll(); return; }
    if (action === 'open-today-task'){
      var ottTab = btn.getAttribute('data-tab');
      ui.tab = ottTab; ui.period = 'day'; ui.cursor = new Date();
      renderAll(); return;
    }
    if (action === 'scroll-to-section'){
      var stsEl = document.getElementById(btn.getAttribute('data-target'));
      if (stsEl && stsEl.scrollIntoView) stsEl.scrollIntoView({ behavior:'smooth', block:'center' });
      return;
    }
    if (action === 'toggle-home-macro'){ ui.homeMacroExpanded = !ui.homeMacroExpanded; renderAll(); return; }
    if (action === 'toggle-home-workout'){ ui.homeWorkoutExpanded = !ui.homeWorkoutExpanded; renderAll(); return; }
    if (action === 'open-exercise-history'){ ui.exerciseHistoryName = btn.getAttribute('data-name'); renderAll(); return; }
    if (action === 'close-exercise-history'){ ui.exerciseHistoryName = null; renderAll(); return; }
    if (action === 'open-library'){ ui.libraryOpen = true; renderAll(); return; }
    if (action === 'close-library'){ ui.libraryOpen = false; ui.libraryRegion = null; renderAll(); return; }
    if (action === 'set-library-view'){ ui.libraryView = btn.getAttribute('data-view'); renderAll(); return; }
    if (action === 'select-library-region'){
      var slrRegion = btn.getAttribute('data-region');
      ui.libraryRegion = (ui.libraryRegion === slrRegion) ? null : slrRegion;
      renderAll(); return;
    }
    if (action === 'add-library-exercise-today'){
      var alName = btn.getAttribute('data-name');
      var alKey = todayKey();
      var alDay = dayOf(alKey);
      var alExisting = alDay.exercises.filter(function(e){ return e.name.toLowerCase() === alName.toLowerCase(); })[0];
      if (!alExisting){
        alExisting = { id:newId(), name:alName, sets:[] };
        alDay.exercises.push(alExisting);
      }
      ui.activeExerciseId = alExisting.id;
      ui.libraryOpen = false; ui.libraryRegion = null;
      ui.tab = 'workout'; ui.period = 'day'; ui.cursor = new Date();
      scheduleSave(); renderAll(); return;
    }
    if (action === 'modal-noop'){ return; }
    if (action === 'ai-open'){ aiOpen = true; renderAll(); return; }
    if (action === 'ai-close'){ aiOpen = false; renderAll(); return; }
    if (action === 'ai-send'){
      if (aiBusy) return;
      var aiInputEl = document.getElementById('ai-input');
      var aiTextVal = aiInputEl ? aiInputEl.value : '';
      sendAiMessage(aiTextVal);
      return;
    }
    if (action === 'set-theme'){
      currentTheme = btn.getAttribute('data-theme');
      applyTheme(currentTheme);
      try { localStorage.setItem(THEME_KEY, currentTheme); } catch(e){}
      renderAll(); return;
    }
    if (action === 'copy-field'){
      var cfTgt = btn.getAttribute('data-target');
      var cfEl = document.getElementById(cfTgt);
      if (cfEl){
        var cfVal = cfEl.value;
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(cfVal).catch(function(){});
        } else {
          try { cfEl.select(); document.execCommand('copy'); } catch(eCopy){}
        }
        var cfOrig = btn.textContent;
        btn.textContent = 'Kopyalandı ✓';
        setTimeout(function(){ btn.textContent = cfOrig; }, 1200);
      }
      return;
    }
    if (action === 'open-settings'){ ui.settingsOpen = true; renderAll(); return; }
    if (action === 'close-settings'){ ui.settingsOpen = false; renderAll(); return; }
    if (action === 'open-plan'){ ui.planOpen = true; renderAll(); return; }
    if (action === 'close-plan'){ ui.planOpen = false; renderAll(); return; }

    if (action === 'set-plan-day'){
      var dow = Number(btn.getAttribute('data-dow'));
      state.plan[dow] = btn.getAttribute('data-type');
      scheduleSave(); renderAll(); return;
    }
    if (action === 'set-day-type'){
      var dkey = btn.getAttribute('data-key');
      var d = dayOf(dkey);
      d.workoutType = btn.getAttribute('data-type');
      scheduleSave(); renderAll(); return;
    }
    if (action === 'reset-day-type'){
      var dkey2 = btn.getAttribute('data-key');
      dayOf(dkey2).workoutType = null;
      scheduleSave(); renderAll(); return;
    }
    if (action === 'add-nutrition-entry'){
      var nkey = btn.getAttribute('data-key');
      var nameEl = document.getElementById('dd-food-name');
      var name = nameEl.value.trim();
      var cal = num(document.getElementById('dd-food-cal').value, NaN);
      if (!name || !isFinite(cal) || cal <= 0){ nameEl.focus(); return; }
      var p = num(document.getElementById('dd-food-p').value, 0);
      var f = num(document.getElementById('dd-food-f').value, 0);
      var k = num(document.getElementById('dd-food-k').value, 0);
      dayOf(nkey).nutrition.push({ id:newId(), name:name, calories:cal, protein:p, fat:f, carb:k });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'delete-nutrition'){
      var dnkey = btn.getAttribute('data-key'), id = btn.getAttribute('data-id');
      var dd = dayOf(dnkey);
      dd.nutrition = dd.nutrition.filter(function(n){ return n.id !== id; });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'add-exercise'){
      var ekey = btn.getAttribute('data-key');
      var exNameEl = document.getElementById('dd-ex-name');
      var exName = exNameEl.value.trim();
      if (!exName){ exNameEl.focus(); return; }
      var newEx = { id:newId(), name:exName, sets:[] };
      dayOf(ekey).exercises.push(newEx);
      ui.activeExerciseId = newEx.id;
      scheduleSave(); renderAll(); return;
    }
    if (action === 'set-agenda-subtab'){
      ui.agendaSubTab = btn.getAttribute('data-subtab');
      renderAll(); return;
    }
    if (action === 'agenda-day-prev' || action === 'agenda-day-next'){
      var adKey = ui.agendaKey || todayKey();
      var adDate = parseKey(adKey);
      adDate.setDate(adDate.getDate() + (action === 'agenda-day-prev' ? -1 : 1));
      ui.agendaKey = keyForDate(adDate);
      renderAll(); return;
    }
    if (action === 'add-agenda-item'){
      var aaKey = btn.getAttribute('data-key');
      var aaTimeEl = document.getElementById('ag-time'), aaTextEl = document.getElementById('ag-text');
      var aaText = (aaTextEl && aaTextEl.value || '').trim();
      if (!aaText){ if (aaTextEl) aaTextEl.focus(); return; }
      var aaTime = (aaTimeEl && aaTimeEl.value || '').trim() || null;
      dayOf(aaKey).agenda.push({ id:newId(), time:aaTime, text:aaText, done:false });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'toggle-agenda-item'){
      var taKey = btn.getAttribute('data-key'), taId = btn.getAttribute('data-id');
      var taItem = dayOf(taKey).agenda.filter(function(x){ return x.id === taId; })[0];
      if (taItem) taItem.done = !taItem.done;
      scheduleSave(); renderAll(); return;
    }
    if (action === 'delete-agenda-item'){
      var daKey = btn.getAttribute('data-key'), daId = btn.getAttribute('data-id');
      var daDay = dayOf(daKey);
      daDay.agenda = daDay.agenda.filter(function(x){ return x.id !== daId; });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'add-note-item'){
      var anKey = btn.getAttribute('data-key');
      var anEl = document.getElementById('note-text');
      var anText = (anEl && anEl.value || '').trim();
      if (!anText){ if (anEl) anEl.focus(); return; }
      dayOf(anKey).notes.push({ id:newId(), text:anText });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'delete-note-item'){
      var dnKey = btn.getAttribute('data-key'), dnId = btn.getAttribute('data-id');
      var dnDay = dayOf(dnKey);
      dnDay.notes = dnDay.notes.filter(function(x){ return x.id !== dnId; });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'save-steps-home'){
      var hsEl = document.getElementById('home-steps');
      var hsVal = num(hsEl ? hsEl.value : '', NaN);
      dayOf(todayKey()).steps = (isFinite(hsVal) && hsVal > 0) ? Math.round(hsVal) : null;
      scheduleSave(); renderAll(); return;
    }
    if (action === 'set-steps-quick'){
      var sqVal = num(btn.getAttribute('data-steps'), 0);
      dayOf(todayKey()).steps = sqVal > 0 ? sqVal : null;
      scheduleSave(); renderAll(); return;
    }
    if (action === 'add-water'){
      var awMl = num(btn.getAttribute('data-ml'), 0);
      var awDay = dayOf(todayKey());
      awDay.water = Math.max(0, (awDay.water || 0) + awMl);
      scheduleSave(); renderAll(); return;
    }
    if (action === 'reset-water'){
      dayOf(todayKey()).water = 0;
      scheduleSave(); renderAll(); return;
    }
    if (action === 'set-sleep-quick'){
      var slVal = num(btn.getAttribute('data-hours'), 0);
      var slDay = dayOf(todayKey());
      slDay.sleepHours = (slDay.sleepHours === slVal) ? null : (slVal > 0 ? slVal : null);
      scheduleSave(); renderAll(); return;
    }
    if (action === 'activate-exercise'){
      ui.activeExerciseId = btn.getAttribute('data-exid');
      renderAll(); return;
    }
    if (action === 'start-workout-session'){
      workoutSessionStartedAt = Date.now();
      startSessionInterval();
      renderAll(); return;
    }
    if (action === 'end-workout-session'){
      workoutSessionStartedAt = null;
      if (sessionIntervalId){ clearInterval(sessionIntervalId); sessionIntervalId = null; }
      renderAll(); return;
    }
    if (action === 'stop-rest-timer'){
      restTimer = null;
      if (restTimerIntervalId){ clearInterval(restTimerIntervalId); restTimerIntervalId = null; }
      renderAll(); return;
    }
    if (action === 'delete-exercise'){
      var dekey = btn.getAttribute('data-key'), exid = btn.getAttribute('data-exid');
      var ded = dayOf(dekey);
      ded.exercises = ded.exercises.filter(function(ex){ return ex.id !== exid; });
      if (ui.activeExerciseId === exid) ui.activeExerciseId = null;
      scheduleSave(); renderAll(); return;
    }
    if (action === 'add-set'){
      var skey = btn.getAttribute('data-key'), sexid = btn.getAttribute('data-exid');
      var sday = dayOf(skey);
      var ex = sday.exercises.filter(function(x){ return x.id === sexid; })[0];
      if (!ex) return;
      var repsEl = document.getElementById('reps-' + sexid);
      var weightEl = document.getElementById('weight-' + sexid);
      var reps = num(repsEl.value, NaN);
      var weight = num(weightEl.value, 0);
      if (!isFinite(reps) || reps <= 0){ repsEl.focus(); return; }
      ex.sets.push({ reps:reps, weight:weight });
      startRestTimer(ex.name);
      scheduleSave(); renderAll(); return;
    }
    if (action === 'delete-set'){
      var dskey = btn.getAttribute('data-key'), dsexid = btn.getAttribute('data-exid'), setIdx = Number(btn.getAttribute('data-setidx'));
      var dsday = dayOf(dskey);
      var dsex = dsday.exercises.filter(function(x){ return x.id === dsexid; })[0];
      if (dsex) dsex.sets.splice(setIdx, 1);
      scheduleSave(); renderAll(); return;
    }
    if (action === 'step-input'){
      var targetId = btn.getAttribute('data-target');
      var stepVal = num(btn.getAttribute('data-step'), 0);
      var minAttr = btn.getAttribute('data-min');
      var minVal = minAttr !== null ? num(minAttr, 0) : null;
      var inputEl = document.getElementById(targetId);
      if (!inputEl) return;
      var cur = num(inputEl.value, 0);
      var next = Math.round((cur + stepVal) * 100) / 100;
      if (minVal !== null && next < minVal) next = minVal;
      inputEl.value = next;
      return;
    }
    if (action === 'repeat-last-set'){
      var rlKey = btn.getAttribute('data-key'), rlExid = btn.getAttribute('data-exid');
      var rlEx = dayOf(rlKey).exercises.filter(function(x){ return x.id === rlExid; })[0];
      if (!rlEx || !rlEx.sets.length) return;
      var rlLast = rlEx.sets[rlEx.sets.length - 1];
      rlEx.sets.push({ reps: rlLast.reps, weight: rlLast.weight });
      startRestTimer(rlEx.name);
      scheduleSave(); renderAll(); return;
    }
    if (action === 'link-account'){
      var leEl = document.getElementById('acc-link-email'), lpEl = document.getElementById('acc-link-pass');
      var lEmail = (leEl && leEl.value || '').trim(), lPass = lpEl && lpEl.value || '';
      if (!lEmail || !lPass){ accountSyncMsg = { type:'error', text:'E-posta ve şifre gerekli.' }; renderAll(); return; }
      if (lPass.length < 6){ accountSyncMsg = { type:'error', text:'Şifre en az 6 karakter olmalı.' }; renderAll(); return; }
      var lAuthUser = null;
      try { if (typeof firebase !== 'undefined' && firebase.auth) lAuthUser = firebase.auth().currentUser; } catch(eLA){ lAuthUser = null; }
      if (!lAuthUser){
        accountSyncMsg = { type:'error', text:'Önce internete bağlanıp oturumun açılmasını bekle.' }; renderAll(); return;
      }
      accountSyncBusy = true; accountSyncMsg = null; renderAll();
      var lCred = firebase.auth.EmailAuthProvider.credential(lEmail, lPass);
      lAuthUser.linkWithCredential(lCred).then(function(){
        accountSyncBusy = false;
        accountSyncMsg = { type:'success', text:'Hesap bağlandı. Diğer cihazda aynı e-posta/şifre ile "Giriş Yap"ı kullan.' };
        renderAll();
      }).catch(function(errLink){
        accountSyncBusy = false;
        accountSyncMsg = { type:'error', text:authErrorMessage(errLink) };
        renderAll();
      });
      return;
    }
    if (action === 'signin-account'){
      var seEl = document.getElementById('acc-signin-email'), spEl = document.getElementById('acc-signin-pass');
      var sEmail = (seEl && seEl.value || '').trim(), sPass = spEl && spEl.value || '';
      if (!sEmail || !sPass){ accountSyncMsg = { type:'error', text:'E-posta ve şifre gerekli.' }; renderAll(); return; }
      var sAuthOk = false;
      try { sAuthOk = typeof firebase !== 'undefined' && !!firebase.auth && !!window.firebaseConfig; } catch(eSA){ sAuthOk = false; }
      if (!sAuthOk){
        accountSyncMsg = { type:'error', text:'İnternete bağlanman gerekiyor.' }; renderAll(); return;
      }
      accountSyncBusy = true; accountSyncMsg = null; renderAll();
      firebase.auth().signInWithEmailAndPassword(sEmail, sPass).then(function(){
        accountSyncBusy = false;
        accountSyncMsg = { type:'success', text:'Giriş yapıldı, veriler yükleniyor…' };
        firstSnapshotDone = false;
        renderAll();
      }).catch(function(errSignin){
        accountSyncBusy = false;
        accountSyncMsg = { type:'error', text:authErrorMessage(errSignin) };
        renderAll();
      });
      return;
    }
    if (action === 'save-settings'){
      var s = state.settings;
      s.goalCalories = num(document.getElementById('s-cal').value, s.goalCalories);
      s.goalProtein = num(document.getElementById('s-p').value, s.goalProtein);
      s.goalFat = num(document.getElementById('s-f').value, s.goalFat);
      s.goalCarb = num(document.getElementById('s-k').value, s.goalCarb);
      s.workoutGoalPerWeek = num(document.getElementById('s-wg').value, s.workoutGoalPerWeek);
      s.cardioGoalMinPerWeek = num(document.getElementById('s-cg').value, s.cardioGoalMinPerWeek);
      s.stepsGoalPerDay = num(document.getElementById('s-sg').value, s.stepsGoalPerDay);
      s.waterGoalMl = num(document.getElementById('s-wat').value, s.waterGoalMl);
      s.sleepGoalHours = num(document.getElementById('s-sleep').value, s.sleepGoalHours);
      s.weeklyWeightGoalKg = num(document.getElementById('s-wwg').value, s.weeklyWeightGoalKg);
      s.monthlyWeightGoalKg = num(document.getElementById('s-mwg').value, s.monthlyWeightGoalKg);
      ui.settingsOpen = false;
      scheduleSave(); renderAll(); return;
    }

    if (action === 'open-mealplan'){ ui.mealPlanOpen = true; renderAll(); return; }
    if (action === 'close-mealplan'){ ui.mealPlanOpen = false; renderAll(); return; }
    if (action === 'open-weight-modal'){ ui.weightModalOpen = true; renderAll(); return; }
    if (action === 'close-weight-modal'){ ui.weightModalOpen = false; renderAll(); return; }

    if (action === 'toggle-mealplan-check'){
      var mfkey = btn.getAttribute('data-key'), mfid = btn.getAttribute('data-id');
      var mfItem = state.mealPlan.filter(function(x){ return x.id === mfid; })[0];
      if (!mfItem) return;
      var mfDay = dayOf(mfkey);
      var mfExisting = mfDay.nutrition.filter(function(n){ return n.sourcePlanId === mfid || n.name.toLowerCase() === mfItem.label.toLowerCase(); })[0];
      if (mfExisting){
        mfDay.nutrition = mfDay.nutrition.filter(function(n){ return n.id !== mfExisting.id; });
      } else {
        mfDay.nutrition.push({ id:newId(), name:mfItem.label, calories:mfItem.calories, protein:mfItem.protein, fat:mfItem.fat, carb:mfItem.carb, sourcePlanId:mfid });
      }
      scheduleSave(); renderAll(); return;
    }
    if (action === 'add-mealplan-item'){
      var mpLabelEl = document.getElementById('mp-label');
      var mpLabel = mpLabelEl.value.trim();
      var mpCal = num(document.getElementById('mp-cal').value, NaN);
      if (!mpLabel || !isFinite(mpCal) || mpCal <= 0){ mpLabelEl.focus(); return; }
      var mpP = num(document.getElementById('mp-p').value, 0);
      var mpF = num(document.getElementById('mp-f').value, 0);
      var mpK = num(document.getElementById('mp-k').value, 0);
      state.mealPlan.push({ id:newId(), label:mpLabel, calories:mpCal, protein:mpP, fat:mpF, carb:mpK });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'delete-mealplan-item'){
      var dmpid = btn.getAttribute('data-id');
      state.mealPlan = state.mealPlan.filter(function(x){ return x.id !== dmpid; });
      scheduleSave(); renderAll(); return;
    }

    if (action === 'toggle-exercise-plan-check'){
      var tpKey = btn.getAttribute('data-key'), tpPlanId = btn.getAttribute('data-planid'), tpType = btn.getAttribute('data-type');
      var tpPlanItem = (state.exercisePlans[tpType]||[]).filter(function(x){ return x.id === tpPlanId; })[0];
      if (!tpPlanItem) return;
      var tpDay = dayOf(tpKey);
      var tpExisting = tpDay.exercises.filter(function(ex){ return ex.sourcePlanId === tpPlanId || ex.name.toLowerCase() === tpPlanItem.name.toLowerCase(); })[0];
      if (tpExisting){
        tpDay.exercises = tpDay.exercises.filter(function(ex){ return ex.id !== tpExisting.id; });
        if (ui.activeExerciseId === tpExisting.id) ui.activeExerciseId = null;
      } else {
        var newTpEx = { id:newId(), name:tpPlanItem.name, sets:[], sourcePlanId:tpPlanId };
        tpDay.exercises.push(newTpEx);
        ui.activeExerciseId = newTpEx.id;
      }
      scheduleSave(); renderAll(); return;
    }
    if (action === 'add-planned-exercise'){
      // plan modalından yeni hareket hedefi ekleme
      var peType = btn.getAttribute('data-type');
      var peNameEl = document.getElementById('pe-name-' + peType);
      var peName = peNameEl.value.trim();
      if (!peName){ peNameEl.focus(); return; }
      var peWeightVal = document.getElementById('pe-weight-' + peType).value;
      var peWeight = peWeightVal !== '' ? num(peWeightVal, null) : null;
      if (!state.exercisePlans[peType]) state.exercisePlans[peType] = [];
      state.exercisePlans[peType].push({ id:newId(), name:peName, sets:null, repMin:null, repMax:null, targetWeight:peWeight });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'delete-planned-exercise'){
      var dpeType = btn.getAttribute('data-type'), dpeId = btn.getAttribute('data-planid');
      state.exercisePlans[dpeType] = (state.exercisePlans[dpeType]||[]).filter(function(x){ return x.id !== dpeId; });
      scheduleSave(); renderAll(); return;
    }

    if (action === 'save-weight-entry'){
      var wlDateEl = document.getElementById('wl-date');
      var wlDate = wlDateEl.value;
      var wlKg = num(document.getElementById('wl-kg').value, NaN);
      if (!wlDate || !isFinite(wlKg) || wlKg <= 0){ return; }
      var existing = state.weightLog.filter(function(w){ return w.date === wlDate; })[0];
      if (existing) existing.kg = wlKg;
      else state.weightLog.push({ id:newId(), date:wlDate, kg:wlKg });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'delete-weight-entry'){
      var dwid = btn.getAttribute('data-id');
      state.weightLog = state.weightLog.filter(function(w){ return w.id !== dwid; });
      scheduleSave(); renderAll(); return;
    }

    if (action === 'open-measure-modal'){ ui.measureModalOpen = true; renderAll(); return; }
    if (action === 'close-measure-modal'){ ui.measureModalOpen = false; renderAll(); return; }
    if (action === 'pick-measure-site'){
      var msSiteEl = document.getElementById('ms-site');
      if (msSiteEl) msSiteEl.value = btn.getAttribute('data-site');
      return;
    }
    if (action === 'save-measure-entry'){
      var msDateEl = document.getElementById('ms-date');
      var msDate = msDateEl.value;
      var msSite = document.getElementById('ms-site').value.trim();
      var msVal = num(document.getElementById('ms-val').value, NaN);
      if (!msDate || !msSite || !isFinite(msVal) || msVal <= 0){ return; }
      state.measurements.push({ id:newId(), date:msDate, site:msSite, valueCm:msVal });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'delete-measure-entry'){
      var dmid = btn.getAttribute('data-id');
      state.measurements = state.measurements.filter(function(m){ return m.id !== dmid; });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'save-measure-photo'){
      var mfHintEl = document.getElementById('mf-hint');
      var mfFileEl = document.getElementById('mf-file');
      var mfFile = mfFileEl && mfFileEl.files && mfFileEl.files[0];
      if (!mfFile){ if (mfHintEl) mfHintEl.textContent = 'Önce bir fotoğraf seç.'; return; }
      var mfDate = document.getElementById('mf-date').value || todayKey();
      var mfNote = document.getElementById('mf-note').value.trim();
      if (mfHintEl) mfHintEl.textContent = 'İşleniyor...';
      resizeImageFileToDataUrl(mfFile, 800, 0.55).then(function(dataUrl){
        state.photos.push({ id:newId(), date:mfDate, dataUrl:dataUrl, note:mfNote });
        scheduleSave(); renderAll();
      }).catch(function(){
        var el2 = document.getElementById('mf-hint');
        if (el2) el2.textContent = 'Fotoğraf işlenemedi, tekrar dene.';
      });
      return;
    }
    if (action === 'delete-measure-photo'){
      var dpid = btn.getAttribute('data-id');
      state.photos = state.photos.filter(function(p){ return p.id !== dpid; });
      scheduleSave(); renderAll(); return;
    }

    if (action === 'add-cardio-entry'){
      var ckey = btn.getAttribute('data-key');
      var cType = document.getElementById('dd-cardio-type').value;
      var cDurEl = document.getElementById('dd-cardio-duration');
      var cDur = num(cDurEl.value, NaN);
      if (!isFinite(cDur) || cDur <= 0){ cDurEl.focus(); return; }
      var cDistVal = document.getElementById('dd-cardio-distance').value;
      var cDist = cDistVal !== '' ? num(cDistVal, null) : null;
      var cCal = cardioCalories(cType, cDur, cDist);
      dayOf(ckey).cardio.push({ id:newId(), type:cType, durationMin:cDur, distanceKm:cDist, calories:cCal });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'delete-cardio'){
      var dckey = btn.getAttribute('data-key'), dcid = btn.getAttribute('data-id');
      var dcd = dayOf(dckey);
      dcd.cardio = dcd.cardio.filter(function(c){ return c.id !== dcid; });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'save-steps'){
      var stKey = btn.getAttribute('data-key');
      var stVal = num(document.getElementById('dd-steps').value, NaN);
      dayOf(stKey).steps = (isFinite(stVal) && stVal > 0) ? Math.round(stVal) : null;
      scheduleSave(); renderAll(); return;
    }
    if (action === 'open-week-day'){
      var owdKey = btn.getAttribute('data-key');
      ui.homeSelectedDayKey = (ui.homeSelectedDayKey === owdKey) ? null : owdKey;
      renderAll(); return;
    }
    if (action === 'close-home-day'){
      ui.homeSelectedDayKey = null;
      renderAll(); return;
    }
    if (action === 'open-home-day-edit'){
      var ohdKey = btn.getAttribute('data-key');
      ui.tab = 'workout'; ui.period = 'day'; ui.dayDetailKind = 'workout'; ui.dayDetailKey = ohdKey;
      renderAll(); return;
    }
    if (action === 'open-home-day-agenda'){
      var ohaKey = btn.getAttribute('data-key');
      ui.tab = 'agenda'; ui.agendaKey = ohaKey; ui.agendaSubTab = 'plan';
      renderAll(); return;
    }
  }

  /* ---------- başlat ---------- */
  var acctImportParams = detectAccountHealthImportParams();
  if (acctImportParams){
    /* hesap+anahtar parametreleri varsa: normal uygulamayı hiç açmadan, doğrudan hedef hesaba yaz */
    runAccountHealthImport(acctImportParams);
  } else {
    renderAll();
    initFirebase();
    setTimeout(function(){
      if (!healthImportApplied){
        healthImportApplied = true;
        if (applyHealthImportFromUrl()) renderAll();
      }
    }, 2500);
  }
})();
</script>
<script>
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
