<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Spor Defteri</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E8F86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spor Defteri">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style id="app-style">
  :root{
    color-scheme: light;
    --bg:#F0F3F5; --surface:#FFFFFF; --surface-2:#E7ECEF; --surface-3:#F7F9FA;
    --border:#DCE3E7; --text:#101820; --text-dim:#5C6B74; --text-faint:#8B99A1;
    --accent:#1E8F86; --accent-soft:#DCF1EE;
    --cal:#E8703A; --cal-soft:#FBE6DC;
    --protein:#1E9E5C; --protein-soft:#DEF3E7;
    --fat:#C68A1A; --fat-soft:#F6ECD6;
    --carb:#2D72C9; --carb-soft:#DEEAF9;
    --push:#D8503B; --push-soft:#FAE0DA;
    --pull:#1E8F86; --pull-soft:#DCF1EE;
    --legs:#7C5CC9; --legs-soft:#E9E2F8;
    --upper:#C4791E; --upper-soft:#F5E5D2;
    --rest:#8B99A1; --rest-soft:#E7ECEF;
    --good:#1E9E5C; --bad:#D8503B;
    --shadow: 0 1px 2px rgba(16,24,32,.06), 0 8px 20px -12px rgba(16,24,32,.15);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#0B141C; --surface:#131E28; --surface-2:#1C2933; --surface-3:#0F1922;
      --border:#233240; --text:#F2F6F8; --text-dim:#93A5AF; --text-faint:#5E717C;
      --accent:#3BC4B8; --accent-soft:#122E2C;
      --cal:#FF8A5C; --cal-soft:#2E1F16;
      --protein:#4EDB8D; --protein-soft:#132A1E;
      --fat:#F0BE4E; --fat-soft:#2C2413;
      --carb:#5FA8F5; --carb-soft:#132330;
      --push:#FF7A66; --push-soft:#2E1B17;
      --pull:#3BC4B8; --pull-soft:#122E2C;
      --legs:#B79BF0; --legs-soft:#211C33;
      --upper:#F0AE5C; --upper-soft:#2C2213;
      --rest:#5E717C; --rest-soft:#1C2933;
      --good:#4EDB8D; --bad:#FF7A66;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0B141C; --surface:#131E28; --surface-2:#1C2933; --surface-3:#0F1922;
    --border:#233240; --text:#F2F6F8; --text-dim:#93A5AF; --text-faint:#5E717C;
    --accent:#3BC4B8; --accent-soft:#122E2C;
    --cal:#FF8A5C; --cal-soft:#2E1F16;
    --protein:#4EDB8D; --protein-soft:#132A1E;
    --fat:#F0BE4E; --fat-soft:#2C2413;
    --carb:#5FA8F5; --carb-soft:#132330;
    --push:#FF7A66; --push-soft:#2E1B17;
    --pull:#3BC4B8; --pull-soft:#122E2C;
    --legs:#B79BF0; --legs-soft:#211C33;
    --upper:#F0AE5C; --upper-soft:#2C2213;
    --rest:#5E717C; --rest-soft:#1C2933;
    --good:#4EDB8D; --bad:#FF7A66;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .num{ font-family:'JetBrains Mono', monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  input, select{ font-family:inherit; }

  .app-shell{ max-width:520px; margin:0 auto; min-height:100%; padding-bottom:78px; position:relative; }

  /* ---------- header ---------- */
  .app-header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--bg); padding:14px 16px 10px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-bottom:1px solid var(--border);
  }
  .app-title{ font-family:'Sora',sans-serif; font-weight:800; font-size:19px; letter-spacing:-.2px; }
  .app-title small{ display:block; font-family:'IBM Plex Sans',sans-serif; font-weight:500; font-size:11px; color:var(--text-faint); margin-top:1px; }
  .header-actions{ display:flex; gap:8px; }
  .icon-btn{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:center; color:var(--text-dim); cursor:pointer;
  }
  .icon-btn svg{ width:18px; height:18px; }
  .save-status{ font-size:10px; color:var(--text-faint); display:flex; align-items:center; gap:5px; margin-top:2px; }
  .save-dot{ width:6px; height:6px; border-radius:50%; background:var(--good); }
  .save-status.is-saving .save-dot{ background:var(--fat); }
  .save-status.is-local .save-dot{ background:var(--text-faint); }

  /* ---------- month nav + period toggle ---------- */
  .month-nav{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px 4px; }
  .month-nav-btn{ width:32px; height:32px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); display:flex; align-items:center; justify-content:center; }
  .month-nav-label{ font-family:'Sora',sans-serif; font-weight:800; font-size:20px; letter-spacing:-.3px; }
  .period-toggle{ display:flex; background:var(--surface-2); border-radius:11px; padding:3px; margin:10px 16px 4px; }
  .period-btn{ flex:1; text-align:center; padding:8px 0; border-radius:8px; font-size:13px; font-weight:600; color:var(--text-dim); border:none; background:transparent; }
  .period-btn.is-active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow); }

  .tab-sub-row{ display:flex; gap:8px; padding:10px 16px 2px; overflow-x:auto; }
  .tab-sub-btn{ white-space:nowrap; padding:7px 13px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-size:12.5px; font-weight:600; }
  .tab-sub-btn.is-active{ background:var(--text); color:var(--bg); border-color:var(--text); }

  .content{ padding:6px 16px 20px; }
  .section-title{ font-size:12.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; margin:18px 2px 9px; }

  /* ---------- stat cards (ay view) ---------- */
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; box-shadow:var(--shadow); }
  .stat-card-label{ font-size:11.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; }
  .stat-card-val{ font-family:'Sora',sans-serif; font-weight:800; font-size:24px; margin-top:6px; letter-spacing:-.3px; }
  .stat-card-val span{ font-size:13px; font-weight:600; color:var(--text-faint); margin-left:3px; }
  .stat-bar-track{ height:6px; border-radius:99px; background:var(--surface-2); margin-top:11px; overflow:hidden; }
  .stat-bar-fill{ height:100%; border-radius:99px; }
  .stat-bar-foot{ display:flex; justify-content:space-between; margin-top:7px; font-size:11px; color:var(--text-faint); }
  .stat-bar-foot b{ color:var(--text-dim); }

  .hero-card{ background:linear-gradient(135deg, var(--accent), var(--pull) 130%); border-radius:20px; padding:18px; color:#fff; box-shadow:var(--shadow); }
  :root:not([data-theme="light"]) .hero-card{ background:linear-gradient(135deg, #124C48, #0E3A38 140%); }
  :root[data-theme="dark"] .hero-card{ background:linear-gradient(135deg, #124C48, #0E3A38 140%); }
  .hero-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .hero-label{ font-size:12px; font-weight:600; opacity:.85; }
  .hero-big{ font-family:'Sora',sans-serif; font-weight:800; font-size:32px; margin-top:4px; letter-spacing:-.4px; }
  .hero-big span{ font-size:15px; font-weight:600; opacity:.8; margin-left:3px; }
  .hero-pill{ background:rgba(255,255,255,.18); border-radius:999px; padding:5px 11px; font-size:11.5px; font-weight:700; }
  .hero-bar-track{ height:7px; border-radius:99px; background:rgba(255,255,255,.25); margin-top:14px; overflow:hidden; }
  .hero-bar-fill{ height:100%; border-radius:99px; background:#fff; }
  .hero-foot{ display:flex; justify-content:space-between; margin-top:8px; font-size:11.5px; opacity:.85; }
  .hero-tap-hint{ display:flex; align-items:center; gap:3px; margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,.18); font-size:11.5px; font-weight:700; opacity:.9; }
  .hero-tap-hint svg{ width:13px; height:13px; }

  .breakdown-toggle{ display:flex; background:var(--surface-2); border-radius:11px; padding:3px; margin:16px 0 10px; }
  .bd-row{ display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--border); }
  .bd-row:last-child{ border-bottom:none; }
  .bd-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .bd-name{ font-weight:600; font-size:13.5px; }
  .bd-sub{ font-size:11.5px; color:var(--text-faint); margin-top:1px; }
  .bd-right{ margin-left:auto; text-align:right; }
  .bd-pct{ font-weight:700; font-size:13.5px; }

  /* ---------- day list (gün / hafta) ---------- */
  .list{ border:1px solid var(--border); border-radius:16px; overflow:hidden; background:var(--surface); box-shadow:var(--shadow); }
  .day-row{ display:flex; align-items:center; gap:10px; padding:13px 14px; border:none; border-bottom:1px solid var(--border); background:var(--surface); width:100%; text-align:left; }
  .day-row:last-child{ border-bottom:none; }
  .day-row:active{ background:var(--surface-3); }
  .day-date{ width:40px; flex:none; }
  .day-date-num{ font-family:'Sora',sans-serif; font-weight:800; font-size:16px; }
  .day-date-wd{ font-size:10.5px; color:var(--text-faint); font-weight:600; margin-top:1px; }
  .day-mid{ flex:1; min-width:0; }
  .day-type-badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700; }
  .day-type-badge .dot{ width:6px; height:6px; border-radius:50%; }
  .day-mid-sub{ font-size:11.5px; color:var(--text-faint); margin-top:5px; }
  .day-right{ flex:none; text-align:right; }
  .day-right-val{ font-weight:700; font-size:14.5px; }
  .day-right-val.is-empty{ color:var(--text-faint); font-weight:400; }
  .day-right-sub{ font-size:10.5px; color:var(--text-faint); margin-top:2px; }
  .day-chevron{ color:var(--text-faint); flex:none; }

  .week-total-row{ display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--surface-3); border-bottom:1px solid var(--border); }
  .week-total-row:last-child{ border-bottom:none; }
  .week-total-label{ font-size:11px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; }
  .week-total-date{ font-size:12.5px; font-weight:700; }
  .week-total-mid{ flex:1; }
  .week-total-right{ text-align:right; }
  .week-total-val{ font-weight:800; font-size:14.5px; }
  .week-total-sub{ font-size:10.5px; margin-top:2px; font-weight:700; }
  .week-total-sub.is-good{ color:var(--good); }
  .week-total-sub.is-bad{ color:var(--cal); }

  .empty-state{ text-align:center; padding:34px 16px; color:var(--text-faint); font-size:13.5px; }

  /* ---------- overlay / modal ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(4,8,12,.5); z-index:50; display:flex; align-items:flex-end; }
  .modal{
    background:var(--surface); width:100%; max-width:520px; margin:0 auto; border-radius:20px 20px 0 0;
    max-height:88vh; overflow-y:auto; padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-title{ font-family:'Sora',sans-serif; font-weight:800; font-size:18px; }
  .modal-sub{ font-size:12px; color:var(--text-faint); margin-top:2px; }

  .form{ display:flex; flex-direction:column; gap:12px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px; }
  .field input, .field select{
    width:100%; padding:11px 12px; border-radius:11px; border:1px solid var(--border); background:var(--surface-3);
    color:var(--text); font-size:14.5px;
  }
  .field-row{ display:grid; gap:10px; }
  .field-row.cols-2{ grid-template-columns:1fr 1fr; }
  .field-row.cols-4{ grid-template-columns:repeat(4,1fr); }
  .hint{ font-size:11.5px; color:var(--text-faint); }

  .btn{ border:none; border-radius:12px; padding:12px 16px; font-weight:700; font-size:14.5px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn svg{ width:16px; height:16px; flex:none; }
  .btn-primary{ background:var(--text); color:var(--bg); }
  .btn-block{ width:100%; display:flex; align-items:center; justify-content:center; gap:7px; }
  .btn-ghost{ background:var(--surface-2); color:var(--text); }
  .btn-sm{ padding:9px 12px; font-size:13px; }
  .del-btn{ background:none; border:none; color:var(--text-faint); padding:6px; display:flex; }
  .del-btn svg{ width:16px; height:16px; }
  .quick-add-chip svg{ width:14px; height:14px; flex:none; }

  .macro-chip-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .mchip{ display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:999px; font-size:10.5px; font-weight:700; }
  .mchip.p{ background:var(--protein-soft); color:var(--protein); }
  .mchip.f{ background:var(--fat-soft); color:var(--fat); }
  .mchip.k{ background:var(--carb-soft); color:var(--carb); }
  .mchip.cal{ background:var(--cal-soft); color:var(--cal); }

  .entry-row{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .entry-row:last-child{ border-bottom:none; }
  .entry-main{ flex:1; min-width:0; }
  .entry-name{ font-weight:600; font-size:14px; }
  .entry-sub{ font-size:11.5px; color:var(--text-faint); margin-top:3px; }
  .entry-val{ font-weight:700; font-size:14px; flex:none; }

  .plan-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .plan-row:last-child{ border-bottom:none; }
  .plan-day-label{ font-weight:700; font-size:14px; width:78px; flex:none; }
  .type-select-row{ display:flex; gap:6px; flex-wrap:wrap; flex:1; justify-content:flex-end; }
  .type-pill{ padding:6px 10px; border-radius:999px; font-size:11.5px; font-weight:700; border:1.5px solid transparent; opacity:.55; }
  .type-pill.is-active{ opacity:1; border-color:currentColor; }

  .set-row{ display:grid; grid-template-columns:22px 1fr 1fr 30px; gap:8px; align-items:center; margin-bottom:7px; }
  .set-row-label{ font-size:11.5px; color:var(--text-faint); font-weight:700; text-align:center; }
  .set-row input{ padding:9px 10px; border-radius:9px; border:1px solid var(--border); background:var(--surface-3); color:var(--text); font-size:14px; width:100%; }
  .ex-card{ border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:10px; background:var(--surface-3); }
  .ex-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .ex-card-name{ font-weight:700; font-size:14px; }
  .set-head-row{ display:grid; grid-template-columns:22px 1fr 1fr 30px; gap:8px; font-size:10px; color:var(--text-faint); font-weight:700; margin-bottom:6px; }

  .set-add-row{ background:var(--surface-2); border-radius:12px; padding:10px; margin-top:8px; }
  .stepper-row{ display:flex; gap:8px; }
  .stepper-field{ flex:1; min-width:0; }
  .stepper-field-label{ font-size:10px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.03em; margin-bottom:5px; text-align:center; }
  .stepper{ display:flex; align-items:stretch; background:var(--surface-3); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .stepper-btn{ width:36px; flex:none; border:none; background:none; color:var(--text); font-size:19px; font-weight:600; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .stepper-btn:active{ background:var(--surface-2); }
  .stepper input{ flex:1; min-width:0; text-align:center; border:none; background:none; color:var(--text); font-size:15.5px; font-weight:700; padding:8px 0; font-family:'JetBrains Mono',monospace; -moz-appearance:textfield; }
  .stepper input:focus{ outline:none; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .set-add-actions{ display:flex; gap:8px; margin-top:9px; }
  .set-add-actions .btn{ flex:1; }

  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--border);
    padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px)); display:flex; max-width:520px; margin:0 auto;
  }
  .tab-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0; background:none; border:none; color:var(--text-faint); font-size:11px; font-weight:600; }
  .tab-btn.is-active{ color:var(--accent); }
  .tab-btn svg{ width:21px; height:21px; }

  .empty-icon{ width:40px; height:40px; margin:0 auto 10px; color:var(--text-faint); }

  /* ---------- takvim ---------- */
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px; }
  .cal-weekday-row{ margin-bottom:2px; }
  .cal-weekday{ text-align:center; font-size:10.5px; font-weight:700; color:var(--text-faint); padding:2px 0; }
  .cal-cell{
    aspect-ratio:1; border-radius:10px; border:1px solid var(--border); background:var(--surface);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-size:12.5px; font-weight:700; color:var(--text); position:relative;
  }
  .cal-cell-empty{ border:none; background:none; }
  .cal-cell.is-today{ box-shadow:0 0 0 2px var(--accent) inset; }
  .cal-dot{ width:5px; height:5px; border-radius:50%; }

  /* ---------- kayıtlı program / hedef listeleri ---------- */
  .plan-item-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .plan-item-row:last-child{ border-bottom:none; }
  .plan-item-name{ font-weight:600; font-size:13.5px; }
  .plan-item-sub{ font-size:11.5px; color:var(--text-faint); margin-top:2px; }
  .quick-add-row{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 4px; }
  .quick-add-chip{ white-space:nowrap; display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:12px; border:1px solid var(--border); background:var(--surface-3); font-size:12.5px; font-weight:600; color:var(--text); }
  .quick-add-chip.is-active{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
  .region-tag{ display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; color:var(--text-faint); }
  .region-stats-row{ padding:10px 4px 4px; font-size:12.5px; color:var(--text-dim); }
  .region-stats-row b{ color:var(--text); }

  /* ---------- plandan seçim (tikli liste) ---------- */
  .check-list{ border:1px solid var(--border); border-radius:14px; background:var(--surface); overflow:hidden; margin-bottom:4px; }
  .check-row{
    display:flex; align-items:center; gap:12px; padding:12px 13px; border:none; border-bottom:1px solid var(--border);
    background:var(--surface); width:100%; text-align:left; cursor:pointer;
  }
  .check-row:last-child{ border-bottom:none; }
  .check-row:active{ background:var(--surface-3); }
  .check-row.is-checked{ background:var(--accent-soft); }
  .check-circle{
    width:23px; height:23px; border-radius:50%; border:2px solid var(--border); flex:none;
    display:flex; align-items:center; justify-content:center; color:transparent; background:var(--surface);
  }
  .check-circle svg{ width:13px; height:13px; }
  .check-row.is-checked .check-circle{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .check-row-main{ flex:1; min-width:0; }
  .check-row-name{ font-weight:600; font-size:14px; }
  .check-row.is-checked .check-row-name{ color:var(--accent); }
  .check-row-sub{ font-size:11.5px; color:var(--text-faint); margin-top:2px; }

  /* ---------- açılır manuel giriş ---------- */
  details.manual-add{ margin-top:14px; }
  details.manual-add summary{
    list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
    padding:12px; border-radius:12px; background:var(--surface-2); color:var(--text-dim); font-weight:700; font-size:13.5px;
  }
  details.manual-add summary::-webkit-details-marker{ display:none; }
  details.manual-add summary svg{ width:15px; height:15px; }
  details.manual-add[open] summary{ margin-bottom:14px; background:var(--surface-3); color:var(--text); }
  details.manual-add > .form{ margin-top:0; }

  /* ---------- ana sayfa ---------- */
  .home-greet{ padding:8px 2px 2px; }
  .home-greet-label{ font-family:'Sora',sans-serif; font-weight:800; font-size:22px; letter-spacing:-.3px; }
  .home-greet-date{ font-size:12.5px; color:var(--text-faint); margin-top:2px; font-weight:500; }
  .home-tile-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:8px; }
  .home-tile{
    position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:12px 13px 13px;
    box-shadow:var(--shadow); text-align:left; display:flex; flex-direction:column; gap:2px; width:100%;
  }
  .home-tile::before{ content:''; position:absolute; top:-34px; right:-34px; width:96px; height:96px; border-radius:50%; background:var(--tile-soft); opacity:.55; pointer-events:none; }
  .home-tile-top{ display:flex; align-items:center; justify-content:space-between; position:relative; margin-bottom:3px; }
  .home-tile-icon{ width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; position:relative; flex:none; }
  .home-tile-icon svg{ width:16px; height:16px; }
  .home-tile-pct{ position:relative; font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:999px; }
  .home-tile-label{ font-size:10px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; position:relative; }
  .home-tile-val{ font-family:'Sora',sans-serif; font-weight:800; font-size:16.5px; letter-spacing:-.2px; margin-top:2px; position:relative; }
  .home-tile-sub{ font-size:10.5px; color:var(--text-faint); font-weight:600; margin-top:1px; position:relative; }
  .home-tile-bar{ height:5px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-top:8px; position:relative; }
  .home-tile-bar-fill{ height:100%; border-radius:99px; }
  .home-week-row{ display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--border); }
  .home-week-row:last-child{ border-bottom:none; }
  .home-week-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .home-week-mid{ flex:1; min-width:0; }
  .home-week-name{ font-weight:600; font-size:13.5px; }
  .home-week-bar{ height:5px; border-radius:99px; background:var(--surface-2); margin-top:6px; overflow:hidden; }
  .home-week-bar-fill{ height:100%; border-radius:99px; }
  .home-week-val{ font-weight:700; font-size:13px; flex:none; margin-left:auto; }
  .home-week-row-toggle{ width:100%; border:none; background:none; font:inherit; color:inherit; cursor:pointer; text-align:left; }
  .home-week-chevron{ flex:none; display:flex; color:var(--text-faint); transform:rotate(90deg); transition:transform .15s ease; margin-left:2px; }
  .home-week-chevron svg{ width:14px; height:14px; }
  .home-week-chevron.is-open{ transform:rotate(-90deg); }
  .home-macro-breakdown{ padding:2px 4px 8px 19px; }
  .home-macro-mini-row{ display:flex; align-items:center; gap:10px; padding:7px 0; }
  .home-macro-mini-row .home-week-name{ font-size:12px; color:var(--text-dim); font-weight:600; }
  .home-macro-mini-row .home-week-bar{ height:4px; margin-top:4px; }
  .home-macro-mini-row .home-week-val{ font-size:11.5px; color:var(--text-faint); }
  .home-month-row{ display:flex; justify-content:space-between; gap:8px; }
  .home-month-stat{ flex:1; text-align:center; padding:12px 4px; }
  .home-month-stat-val{ font-family:'Sora',sans-serif; font-weight:800; font-size:17px; }
  .home-month-stat-label{ font-size:10px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-top:3px; }

  /* ---------- görsel yenileme: hero watermark, net kalori, hafta şeridi, adım kartı ---------- */
  .hero-card{ position:relative; overflow:hidden; }
  .hero-watermark{ position:absolute; right:-8px; top:-8px; width:88px; height:88px; opacity:.16; color:#fff; pointer-events:none; }
  .hero-watermark svg{ width:100%; height:100%; }

  .net-cal-card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:15px 14px; box-shadow:var(--shadow); margin-top:12px; }
  .net-cal-head{ display:flex; align-items:center; gap:9px; }
  .net-cal-icon{ width:26px; height:26px; border-radius:8px; background:var(--cal-soft); color:var(--cal); display:flex; align-items:center; justify-content:center; flex:none; }
  .net-cal-icon svg{ width:14px; height:14px; }
  .net-cal-label{ font-size:11.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; }
  .net-cal-row{ display:flex; align-items:center; justify-content:space-between; margin-top:13px; gap:2px; }
  .net-cal-item{ flex:1; text-align:center; min-width:0; }
  .net-cal-item-label{ font-size:10px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
  .net-cal-item-val{ font-family:'Sora',sans-serif; font-weight:800; font-size:17px; margin-top:4px; letter-spacing:-.2px; }
  .net-cal-op{ font-size:15px; font-weight:700; color:var(--text-faint); flex:none; padding:0 2px; }
  .net-cal-split{ display:flex; height:7px; border-radius:99px; overflow:hidden; margin-top:14px; background:var(--surface-2); }
  .net-cal-split-in{ background:var(--cal); }
  .net-cal-split-out{ background:var(--good); }

  .week-strip{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:10px; }
  .week-strip-cell{ border:1px solid var(--border); border-radius:14px; padding:9px 1px 8px; display:flex; flex-direction:column; align-items:center; gap:5px; box-shadow:var(--shadow); }
  .week-strip-cell.is-today{ box-shadow:0 0 0 2px var(--accent) inset, var(--shadow); }
  .week-strip-wd{ font-size:9px; font-weight:700; opacity:.75; text-transform:uppercase; letter-spacing:.02em; }
  .week-strip-num{ font-family:'Sora',sans-serif; font-weight:800; font-size:14px; }
  .week-strip-cell.is-today .week-strip-num{ color:var(--accent); }
  .week-strip-dots{ display:flex; gap:2.5px; min-height:5px; align-items:center; }
  .week-strip-dot{ width:5px; height:5px; border-radius:50%; }

  /* ---------- vücut ölçüleri & fotoğraf ---------- */
  .measure-chip-row{ display:flex; gap:8px; overflow-x:auto; margin-top:12px; padding-bottom:2px; }
  .measure-chip{ flex:none; min-width:84px; background:var(--surface-3); border:1px solid var(--border); border-radius:13px; padding:9px 11px; }
  .measure-chip-label{ font-size:10px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.03em; }
  .measure-chip-val{ font-family:'Sora',sans-serif; font-weight:800; font-size:15px; margin-top:4px; }
  .measure-chip-val span{ font-size:10.5px; font-weight:600; color:var(--text-faint); margin-left:2px; }
  .measure-chip-delta{ font-size:10.5px; font-weight:700; color:var(--good); margin-top:3px; }
  .measure-chip-delta.is-muted{ color:var(--text-faint); font-weight:600; }
  .measure-photo-row{ display:flex; gap:8px; margin-top:12px; }
  .measure-photo-thumb{ position:relative; flex:1; border-radius:12px; overflow:hidden; aspect-ratio:3/4; background:var(--surface-2); }
  .measure-photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .measure-photo-tag{ position:absolute; left:0; right:0; bottom:0; padding:5px 8px; font-size:10px; font-weight:700; color:#fff; background:linear-gradient(0deg, rgba(0,0,0,.55), transparent); }
  .measure-site-chip-row{ display:flex; gap:6px; overflow-x:auto; padding:2px 0 4px; }
  .measure-compare-row{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .measure-compare-row:last-child{ border-bottom:none; }
  .measure-compare-label{ font-weight:600; font-size:13.5px; flex:1; min-width:0; }
  .measure-compare-vals{ display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--text-faint); flex:none; }
  .measure-compare-delta{ font-weight:800; font-size:13.5px; flex:none; width:64px; text-align:right; }
  .measure-photo-compare{ display:flex; gap:10px; margin-top:4px; }
  .measure-photo-compare .measure-photo-thumb{ aspect-ratio:3/4; }
  .measure-photo-days{ text-align:center; font-size:11.5px; color:var(--text-faint); margin-top:8px; }
  .measure-photo-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:4px; }
  .measure-photo-grid .measure-photo-thumb{ aspect-ratio:1; }
  .measure-photo-grid .del-btn{ position:absolute; top:2px; right:2px; background:rgba(0,0,0,.45); border-radius:8px; color:#fff; }
  .measure-photo-grid .del-btn svg{ width:14px; height:14px; }

  .steps-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; box-shadow:var(--shadow); margin-bottom:14px; }
  .steps-card-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .steps-input-row{ display:flex; gap:8px; }
  .steps-input-row input{ flex:1; min-width:0; padding:11px 12px; border-radius:11px; border:1px solid var(--border); background:var(--surface-3); color:var(--text); font-size:14.5px; }
  .steps-cal-note{ margin-top:10px; }

  /* ---------- seviye / xp kartı + görev-kartı stili ---------- */
  .streak-badge{ display:inline-flex; align-items:center; gap:4px; background:var(--cal-soft); color:var(--cal); font-size:11px; font-weight:700; padding:4px 9px 4px 7px; border-radius:999px; margin-left:8px; vertical-align:middle; }
  .streak-badge svg{ width:11px; height:11px; }

  .level-card{ position:relative; overflow:hidden; background:linear-gradient(160deg, var(--surface-2), var(--surface) 130%); border:1px solid var(--border); border-radius:20px; padding:17px; box-shadow:var(--shadow); margin-top:12px; }
  .level-card::before{ content:''; position:absolute; top:-46px; right:-46px; width:150px; height:150px; border-radius:50%; background:radial-gradient(circle, var(--cal-soft), transparent 72%); pointer-events:none; }
  .level-card-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; position:relative; }
  .level-badge{ display:flex; flex-direction:column; align-items:center; justify-content:center; width:52px; height:52px; border-radius:14px; background:linear-gradient(160deg, var(--cal), #A8481E 150%); color:#fff; flex:none; box-shadow:0 4px 14px -4px rgba(232,112,58,.55); }

  .level-xp{ text-align:right; }
  .level-xp-val{ font-family:'Sora',sans-serif; font-weight:800; font-size:21px; letter-spacing:-.3px; }

  .level-xp-track{ height:8px; border-radius:99px; background:var(--surface-2); margin-top:14px; overflow:hidden; position:relative; }
  .level-xp-fill{ height:100%; border-radius:99px; background:linear-gradient(90deg, var(--cal), var(--fat)); }
  .level-xp-foot{ display:flex; justify-content:space-between; margin-top:6px; font-size:10.5px; color:var(--text-faint); font-weight:600; }
  .level-stats{ margin-top:16px; display:flex; flex-direction:column; gap:11px; position:relative; }
  .level-stat-row{ display:flex; align-items:center; gap:10px; }
  .level-stat-icon{ width:25px; height:25px; border-radius:8px; background:var(--surface-3); color:var(--text-dim); display:flex; align-items:center; justify-content:center; flex:none; }
  .level-stat-icon svg{ width:13px; height:13px; }
  .level-stat-mid{ flex:1; min-width:0; }
  .level-stat-name{ font-size:10px; font-weight:700; letter-spacing:.05em; color:var(--text-faint); margin-bottom:4px; }
  .level-stat-track{ height:5px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .level-stat-fill{ height:100%; border-radius:99px; background:linear-gradient(90deg, var(--accent), var(--pull)); }
  .level-stat-val{ font-family:'Sora',sans-serif; font-weight:800; font-size:13.5px; width:24px; text-align:right; flex:none; }

  .day-icon{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:none; }

  .day-check.is-done{ border:none; display:flex; align-items:center; justify-content:center; color:#fff; }
  .day-check.is-done svg{ width:13px; height:13px; }

  /* ---------- yapay zeka asistanı ---------- */
  .ai-fab{
    position:fixed; right:16px; bottom:calc(78px + env(safe-area-inset-bottom,0px)); z-index:40;
    width:52px; height:52px; border-radius:50%; background:var(--accent); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,.28); cursor:pointer;
  }
  .ai-fab svg{ width:23px; height:23px; }
  .ai-modal{ display:flex; flex-direction:column; height:82vh; max-height:82vh; padding:0; }
  .ai-modal-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border); flex:none; }
  .ai-modal-title{ font-family:'Sora',sans-serif; font-weight:800; font-size:16px; }
  .ai-thread{ flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .ai-msg{ max-width:84%; padding:10px 13px; border-radius:14px; font-size:14px; line-height:1.42; white-space:pre-wrap; word-break:break-word; }
  .ai-msg.user{ align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .ai-msg.bot{ align-self:flex-start; background:var(--surface-3); color:var(--text); border-bottom-left-radius:4px; }
  .ai-msg.bot.is-error{ color:#D64545; }
  .ai-typing{ align-self:flex-start; background:var(--surface-3); color:var(--text-faint); padding:10px 13px; border-radius:14px; font-size:13px; }
  .ai-empty-hint{ color:var(--text-faint); font-size:13px; text-align:center; padding:22px 12px; line-height:1.5; }
  .ai-inputbar{ display:flex; align-items:flex-end; gap:8px; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--border); flex:none; }
  .ai-inputbar textarea{
    flex:1; resize:none; border-radius:12px; border:1px solid var(--border); background:var(--surface-3); color:var(--text);
    padding:10px 12px; font-size:14px; font-family:inherit; max-height:90px; line-height:1.35;
  }
  .ai-send-btn{ border:none; border-radius:12px; background:var(--accent); color:#fff; width:44px; height:44px; display:flex; align-items:center; justify-content:center; flex:none; cursor:pointer; }
  .ai-send-btn:disabled{ opacity:.5; }
  .ai-send-btn svg{ width:19px; height:19px; }
</style>

  function aiResolveDateKey(d){
    if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
    return keyForDate(new Date());
  }

  function executeAiTool(name, input){
    input = input || {};
    try {
      if (name === 'set_workout_type'){
        var swKey = aiResolveDateKey(input.date);
        dayOf(swKey).workoutType = input.type;
        scheduleSave(); renderAll();
        return { ok:true, message: swKey + ' günü ' + input.type + ' olarak ayarlandı.' };
      }
      if (name === 'add_exercise_set'){
        var aeKey = aiResolveDateKey(input.date);
        var day = dayOf(aeKey);
        var exName = String(input.exerciseName||'').trim();
        var ex = day.exercises.filter(function(e){ return e.name.toLowerCase() === exName.toLowerCase(); })[0];
        if (!ex){ ex = { id:newId(), name:exName, sets:[] }; day.exercises.push(ex); }
        var w = (input.weight===undefined || input.weight===null || input.weight==='') ? null : Number(input.weight);
        ex.sets.push({ reps:Number(input.reps)||0, weight:w });
        scheduleSave(); renderAll();
        return { ok:true, message: aeKey + ' gününe ' + exName + ': ' + (Number(input.reps)||0) + ' tekrar' + (w?(' x ' + w + 'kg'):'') + ' eklendi.' };
      }
      if (name === 'add_nutrition_entry'){
        var anKey = aiResolveDateKey(input.date);
        dayOf(anKey).nutrition.push({ id:newId(), name:input.name, calories:Number(input.calories)||0, protein:Number(input.protein)||0, fat:Number(input.fat)||0, carb:Number(input.carb)||0 });
        scheduleSave(); renderAll();
        return { ok:true, message: anKey + ' gününe "' + input.name + '" eklendi.' };
      }
      if (name === 'add_cardio_entry'){
        var acKey = aiResolveDateKey(input.date);
        var acDist = (input.distanceKm===undefined || input.distanceKm===null || input.distanceKm==='') ? null : Number(input.distanceKm);
        var acCal = (input.calories===undefined || input.calories===null || input.calories==='') ? null : Number(input.calories);
        dayOf(acKey).cardio.push({ id:newId(), type:input.type, durationMin:Number(input.durationMin)||0, distanceKm:acDist, calories:acCal });
        scheduleSave(); renderAll();
        return { ok:true, message: acKey + ' gününe ' + input.type + ' (' + (Number(input.durationMin)||0) + ' dk) eklendi.' };
      }
      if (name === 'log_weight'){
        var lwKey = aiResolveDateKey(input.date);
        state.weightLog.push({ id:newId(), date:lwKey, kg:Number(input.kg) });
        scheduleSave(); renderAll();
        return { ok:true, message: lwKey + ' için ' + input.kg + ' kg kaydedildi.' };
      }
      if (name === 'set_steps'){
        var ssKey = aiResolveDateKey(input.date);
        dayOf(ssKey).steps = (isFinite(Number(input.steps)) && Number(input.steps) > 0) ? Math.round(Number(input.steps)) : null;
        scheduleSave(); renderAll();
        return { ok:true, message: ssKey + ' günü için ' + input.steps + ' adım kaydedildi.' };
      }
      if (name === 'log_measurement'){
        var lmKey = aiResolveDateKey(input.date);
        var lmSite = String(input.site||'').trim();
        var lmVal = Number(input.valueCm);
        if (!lmSite || !isFinite(lmVal) || lmVal <= 0) return { ok:false, message:'Geçersiz bölge veya değer.' };
        state.measurements.push({ id:newId(), date:lmKey, site:lmSite, valueCm:lmVal });
        scheduleSave(); renderAll();
        return { ok:true, message: lmKey + ' için ' + lmSite + ' ölçüsü ' + lmVal + ' cm olarak kaydedildi.' };
      }
      return { ok:false, message:'Bilinmeyen işlem: ' + name };
    } catch(errTool){
      return { ok:false, message:'Hata oluştu: ' + (errTool && errTool.message ? errTool.message : 'bilinmeyen') };
    }
  }

  async function runAiTurn(conversation){
    for (var i = 0; i < 6; i++){
      var res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{
          'content-type':'application/json',
          'x-api-key': window.anthropicApiKey,
          'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true'
        },
        body: JSON.stringify({
          model: AI_MODEL,
          max_tokens: 1024,
          system: buildAiSystemPrompt(),
          tools: AI_TOOLS,
          messages: conversation
        })
      });
      if (!res.ok){
        var status = res.status;
        throw new Error('API hatası (' + status + ')');
      }
      var data = await res.json();
      var content = data.content || [];
      conversation.push({ role:'assistant', content: content });

      var toolUses = content.filter(function(c){ return c.type === 'tool_use'; });
      if (!toolUses.length){
        var textParts = content.filter(function(c){ return c.type === 'text'; }).map(function(c){ return c.text; });
        return textParts.join('\n');
      }
      var toolResults = toolUses.map(function(tu){
        var result = executeAiTool(tu.name, tu.input);
        return { type:'tool_result', tool_use_id: tu.id, content: JSON.stringify(result) };
      });
      conversation.push({ role:'user', content: toolResults });
    }
    return 'İşlemi tamamlayamadım, çok fazla adım gerekti.';
  }

  async function sendAiMessage(userText){
    if (!userText || !userText.trim()) return;

      renderAll();
      return;
    }
    appendAiMessage('user', userText);
    aiBusy = true;
    renderAll();
    try {
      var finalText = await runAiTurn([{ role:'user', content:userText }]);
      appendAiMessage('bot', finalText || '(cevap alınamadı)');
    } catch(errAi){
      appendAiMessage('bot', 'Bir hata oldu: ' + (errAi && errAi.message ? errAi.message : 'bilinmeyen hata'), true);
    }
    aiBusy = false;
    renderAll();
  }

  /* ---------- kilo takibi ---------- */
  function round10(n){ return Math.round(num(n)*10)/10; }
  function sortedWeightLog(){
    return (state.weightLog||[]).slice().sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
  }
  function latestWeight(){ var log = sortedWeightLog(); return log.length ? log[log.length-1] : null; }
  function weightAsOf(dateKey){
    var log = sortedWeightLog();
    if (!log.length) return null;
    var ref = null;
    for (var i=0;i<log.length;i++){ if (log[i].date <= dateKey) ref = log[i]; }
    return ref || log[0];
  }
  function weightNDaysAgo(n){
    var target = new Date(); target.setDate(target.getDate()-n);
    return weightAsOf(keyForDate(target));
  }
  function goalMet(actual, goal){
    if (goal < 0) return actual <= goal;
    if (goal > 0) return actual >= goal;
    return true;
  }

  /* ---------- vücut ölçüleri & fotoğraf takibi ---------- */
  var MEASURE_SITES = ['Biceps','Göğüs','Bel','Kalça','Uyluk','Baldır','Omuz','Boyun','Önkol'];
  function measureSiteLabel(site){ return site || ''; }
  function sortedMeasurements(){
    return (state.measurements||[]).slice().sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
  }
  function measurementSiteKeysInUse(){
    var seen = {}; var order = [];
    sortedMeasurements().forEach(function(m){ if (!seen[m.site]){ seen[m.site]=true; order.push(m.site); } });
    return order;
  }
  function measurementsForSite(site){
    return sortedMeasurements().filter(function(m){ return m.site === site; });
  }
  function measurementComparison(site){
    var list = measurementsForSite(site);
    if (!list.length) return null;
    var first = list[0], latest = list[list.length-1];
    return { site:site, label:measureSiteLabel(site), first:first, latest:latest, delta:round10(latest.valueCm - first.valueCm), count:list.length };
  }
  function allMeasurementComparisons(){
    return measurementSiteKeysInUse().map(measurementComparison).filter(Boolean);
  }
  function sortedPhotos(){

  function resizeImageFileToDataUrl(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var tw = Math.max(1, Math.round(w * scale)), th = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement('canvas');
          canvas.width = tw; canvas.height = th;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, tw, th);
          try { resolve(canvas.toDataURL('image/jpeg', quality)); }
          catch(errCanvas){ reject(errCanvas); }
        };
        img.onerror = function(){ reject(new Error('görsel okunamadı')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('dosya okunamadı')); };
      reader.readAsDataURL(file);
    });
  }

  /* ---------- hafta gruplama ---------- */
  function getMonthWeeks(year, month){
    var first = new Date(year, month, 1);
    var last = new Date(year, month, daysInMonth(year, month));
    var weeks = [];
    var cur = new Date(first);
    while (cur <= last){
      var dow = cur.getDay();
      var mondayOffset = (dow===0) ? 6 : dow-1;
      var weekStart = new Date(cur); weekStart.setDate(cur.getDate()-mondayOffset);
      var weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
      var boundStart = weekStart < first ? first : weekStart;
      var boundEnd = weekEnd > last ? last : weekEnd;
      var days = [];
      var d2 = new Date(boundStart);
      while (d2 <= boundEnd){ days.push(new Date(d2)); d2.setDate(d2.getDate()+1); }
      weeks.push({ weekStart:weekStart, weekEnd:weekEnd, days:days });
      cur = new Date(boundEnd); cur.setDate(cur.getDate()+1);
    }
    return weeks;
  }

  /* ---------- hareket geçmişi ---------- */
  function exerciseHistory(name, excludeKey){
    var nameLc = name.toLowerCase();
    var out = [];
    Object.keys(state.days).forEach(function(key){
      if (key === excludeKey) return;
      var d = state.days[key];
      (d.exercises||[]).forEach(function(ex){
        if (ex.name.toLowerCase() === nameLc && ex.sets && ex.sets.length){
          out.push({ key:key, dateObj:parseKey(key), sets:ex.sets });
        }
      });
    });
    out.sort(function(a,b){ return a.key < b.key ? 1 : (a.key > b.key ? -1 : 0); });
    return out;
  }
  function lastPerformance(name, excludeKey){
    var hist = exerciseHistory(name, excludeKey);
    if (!hist.length) return null;
    var sets = hist[0].sets;
    return sets[sets.length - 1];
  }
  function bestSetOf(sets){
    return (sets||[]).reduce(function(best, s){
      var w = num(s.weight);
      return (!best || w > best.weight) ? { weight:w, reps:s.reps } : best;
    }, null);
  }
  function previousSessionBest(name, excludeKey){
    var hist = exerciseHistory(name, excludeKey);
    if (!hist.length) return null;
    var best = bestSetOf(hist[0].sets);
    if (!best) return null;
    return { weight:best.weight, reps:best.reps, dateObj:hist[0].dateObj };
  }
  function weightDeltaBadge(currentWeight, previousWeight){
    if (previousWeight === null || previousWeight === undefined || !isFinite(previousWeight)) return '';
    var delta = round10(currentWeight - previousWeight);
    var color = delta > 0 ? '--good' : (delta < 0 ? '--bad' : '--text-faint');
    var arrow = delta > 0 ? '▲' : (delta < 0 ? '▼' : '=');
    var txt = delta === 0 ? 'aynı' : (delta > 0 ? '+' : '') + delta + ' kg';
    return '<span style="color:var(' + color + ');font-weight:700;font-size:11px;margin-left:6px">' + arrow + ' ' + txt + '</span>';
  }
  function exerciseNamesForDays(dateArr){
    var seen = {}, out = [];
    dateArr.forEach(function(d){
      var key = keyForDate(d);
      var day = state.days[key];
      if (!day) return;
      (day.exercises||[]).forEach(function(ex){
        if (!ex.sets || !ex.sets.length) return;
        var lc = ex.name.toLowerCase();
        if (seen[lc]) return;
        seen[lc] = true;
        out.push(ex.name);
      });
    });
    return out;
  }
  function renderExerciseHistoryModal(name){

      html += '<div class="list">' + hist.map(function(h, idx){
        var wd = WEEKDAYS_SHORT[h.dateObj.getDay()];

        var older = hist[idx+1];
        var delta = older ? weightDeltaBadge(best, older.sets.reduce(function(mx,s){ return Math.max(mx, num(s.weight)); }, 0)) : '';
        return '<div class="week-total-row">' +

          '<div class="week-total-mid">' + h.sets.map(function(s){ return '<span class="mchip cal" style="margin:0 4px 4px 0">' + s.reps + '×' + s.weight + 'kg</span>'; }).join('') + '</div>' +
          '<div class="week-total-right"><div class="week-total-val">' + best + ' kg' + delta + '</div><div class="week-total-sub is-good">en iyi set</div></div>' +
        '</div>';
      }).join('') + '</div>';
    }
    html += '</div></div>';
    return html;

  function sumStepsForDays(dateArr){

  /* ---------- seviye / xp (gamification) ---------- */
  function isDayActive(key){
    var d = state.days[key];
    if (!d) return false;
    return (d.nutrition && d.nutrition.length > 0) ||
      (d.exercises && d.exercises.some(function(ex){ return (ex.sets||[]).length > 0; })) ||
      (d.cardio && d.cardio.length > 0) ||
      !!d.steps;
  }
  function currentStreak(){
    var cur = new Date();
    if (!isDayActive(keyForDate(cur))) cur.setDate(cur.getDate()-1);
    var streak = 0;
    for (var i=0;i<365;i++){
      if (isDayActive(keyForDate(cur))){ streak++; cur.setDate(cur.getDate()-1); }
      else break;
    }
    return streak;
  }
  function computeGamification(){
    var keys = Object.keys(state.days);
    var workoutDaysAll = 0, nutritionDaysAll = 0, cardioDaysAll = 0, totalSets = 0;
    keys.forEach(function(k){
      var d = state.days[k];
      if (!d) return;
      var hasWorkout = (d.exercises||[]).some(function(ex){ return (ex.sets||[]).length > 0; });
      if (hasWorkout) workoutDaysAll++;
      (d.exercises||[]).forEach(function(ex){ totalSets += (ex.sets||[]).length; });
      if ((d.nutrition||[]).length > 0) nutritionDaysAll++;
      if ((d.cardio||[]).length > 0 || d.steps) cardioDaysAll++;
    });
    var streak = currentStreak();
    var xp = workoutDaysAll*20 + totalSets*2 + nutritionDaysAll*8 + cardioDaysAll*10 + streak*5;
    var xpPerLevel = 300;
    var level = Math.floor(xp/xpPerLevel) + 1;
    var xpInLevel = xp % xpPerLevel;
    var xpPct = Math.round((xpInLevel/xpPerLevel)*100);
    function clampStat(v){ return Math.max(1, Math.min(99, Math.round(v))); }
    var guc = clampStat((totalSets/60)*99);
    var sureklilik = clampStat((streak/14)*99);
    var dayaniklilik = clampStat((cardioDaysAll/20)*99);
    var disiplin = clampStat((nutritionDaysAll/25)*99);
    var odak = clampStat((guc+sureklilik+dayaniklilik+disiplin)/4);
    return {
      xp: xp, level: level, xpInLevel: xpInLevel, xpPerLevel: xpPerLevel, xpPct: xpPct, streak: streak,
      stats: [
        {key:'guc', label:'Güç', val:guc, icon:'dumbbell'},
        {key:'sureklilik', label:'Süreklilik', val:sureklilik, icon:'flame'},
        {key:'dayaniklilik', label:'Dayanıklılık', val:dayaniklilik, icon:'pulse'},
        {key:'disiplin', label:'Disiplin', val:disiplin, icon:'food'},
        {key:'odak', label:'Odak', val:odak, icon:'footprints'}
      ]
    };
  }
  function renderLevelCard(){
    var g = computeGamification();
    return '<div class="level-card">' +
      '<div class="level-card-top">' +
        '<div class="level-badge"><span class="level-badge-num">' + g.level + '</span><span class="level-badge-label">SEVİYE</span></div>' +

    html += '<div class="section-title">' + hpLabel + '</div>';
    if (hp === 'day'){
      var wS = dayWorkoutSummary(today);
      var wTi = typeInfo(wS.type);
      html += '<div class="home-tile-grid">' +
        homeTile('nutrition', 'food', 'Beslenme', scopeNut.cal.toLocaleString('tr-TR') + ' kcal', '%' + round(scopeCalPct) + ' hedef', scopeCalPct, '--cal', '--cal-soft') +
        homeTile('workout', 'dumbbell', 'Antrenman', wTi.label, wS.type==='rest' ? 'Dinlenme' : (wS.done ? 'Tamamlandı ✓' : 'Bekliyor'), wS.type==='rest' ? null : (wS.done?100:0), wTi.colorVar, wTi.softVar) +
        homeTile('cardio', 'pulse', 'Kardiyo', scopeCardio.durationMin + ' dk', scopeCardio.count + ' kayıt', scopeCardioPct, '--accent', '--accent-soft') +
        homeTile('cardio', 'footprints', 'Adım', scopeSteps.steps.toLocaleString('tr-TR'), scopeSteps.steps>0 ? ('≈' + scopeSteps.calories + ' kcal') : 'Gir', scopeStepsPct, '--legs', '--legs-soft') +
      '</div>';
    } else {
      var scopeWorkoutDone = 0; scopeDays.forEach(function(d){ if (dayWorkoutSummary(d).done) scopeWorkoutDone++; });
      var scopeWorkoutGoal = hp==='week' ? (s.workoutGoalPerWeek||1) : Math.round((s.workoutGoalPerWeek||1) * (scopeDays.length/7)) || 1;
      html += '<div class="home-tile-grid">' +
        homeTile('nutrition', 'food', 'Beslenme', scopeNut.cal.toLocaleString('tr-TR') + ' kcal', '%' + round(scopeCalPct) + ' hedef', scopeCalPct, '--cal', '--cal-soft') +
        homeTile('workout', 'dumbbell', 'Antrenman', scopeWorkoutDone + ' gün', scopeWorkoutDone + ' / ' + scopeWorkoutGoal + ' hedef', (scopeWorkoutDone/scopeWorkoutGoal)*100, '--pull', '--pull-soft') +
        homeTile('cardio', 'pulse', 'Kardiyo', scopeCardio.durationMin + ' dk', scopeCardio.count + ' kayıt', scopeCardioPct, '--accent', '--accent-soft') +
        homeTile('cardio', 'footprints', 'Adım', scopeSteps.steps.toLocaleString('tr-TR'), scopeSteps.steps>0 ? ('≈' + scopeSteps.calories + ' kcal') : 'Gir', scopeStepsPct, '--legs', '--legs-soft') +
      '</div>';
    }

    var netCalTotal = scopeNut.cal + scopeBurned;
    var netCalInPct = netCalTotal > 0 ? (scopeNut.cal / netCalTotal) * 100 : 50;
    html += '<div class="net-cal-card">' +
      '<div class="net-cal-head"><span class="net-cal-icon">' + icon('flame') + '</span><div class="net-cal-label">' + hpLabel + ' Net Kalori</div></div>' +
      '<div class="net-cal-row">' +
        '<div class="net-cal-item"><div class="net-cal-item-label">Alınan</div><div class="net-cal-item-val" style="color:var(--cal)">' + round(scopeNut.cal).toLocaleString('tr-TR') + '</div></div>' +
        '<div class="net-cal-op">−</div>' +
        '<div class="net-cal-item"><div class="net-cal-item-label">Yakılan</div><div class="net-cal-item-val" style="color:var(--good)">' + round(scopeBurned).toLocaleString('tr-TR') + '</div></div>' +
        '<div class="net-cal-op">=</div>' +
        '<div class="net-cal-item"><div class="net-cal-item-label">Net</div><div class="net-cal-item-val">' + round(scopeNut.cal - scopeBurned).toLocaleString('tr-TR') + '</div></div>' +
      '</div>' +
      '<div class="net-cal-split"><div class="net-cal-split-in" style="width:' + netCalInPct + '%"></div><div class="net-cal-split-out" style="width:' + (100-netCalInPct) + '%"></div></div>' +
    '</div>';

    html += '<div class="section-title">Bu Hafta Genel Bakış</div>' + homeWeekStrip();

    html += '<div class="section-title">' + hpLabel + ' Detay</div>' + homeDetailSection(hp, scopeDays, scopeNut, scopeCardio, scopeSteps);

    html += renderWeightCard();
    html += renderMeasureCard();

    return html;
  }

  function homeWeekStrip(){
    var week = currentWeekDays();
    var html = '<div class="week-strip">';
    week.forEach(function(d){
      var key = keyForDate(d);
      var isToday = key === todayKey();
      var wS = dayWorkoutSummary(d);
      var ti = typeInfo(wS.type);
      var hasBurned = dayBurnedCalories(key) > 0;
      var hasNutrition = dayNutritionTotals(key).cal > 0;
      html += '<button type="button" class="week-strip-cell' + (isToday?' is-today':'') + '" data-action="open-week-day" data-key="' + key + '" style="background:var(' + ti.softVar + ');color:var(' + ti.colorVar + ')">' +
        '<span class="week-strip-wd">' + WEEKDAYS_SHORT[d.getDay()] + '</span>' +
        '<span class="week-strip-num">' + d.getDate() + '</span>' +
        '<span class="week-strip-dots">' +
          (wS.done ? ('<span class="week-strip-dot" style="background:var(' + ti.colorVar + ')"></span>') : '') +
          (hasNutrition ? '<span class="week-strip-dot" style="background:var(--cal)"></span>' : '') +
          (hasBurned ? '<span class="week-strip-dot" style="background:var(--accent)"></span>' : '') +
        '</span>' +
      '</button>';
    });
    html += '</div>';
    return html;
  }

  function homeDetailSection(hp, scopeDays, scopeNut, scopeCardio, scopeSteps){
    var s = state.settings;
    var n = scopeDays.length || 1;
    var goalCalScope = s.goalCalories * n;
    var calPct = goalCalScope>0 ? (scopeNut.cal/goalCalScope)*100 : 0;
    var goalProteinScope = s.goalProtein * n;
    var goalFatScope = s.goalFat * n;
    var goalCarbScope = s.goalCarb * n;

    var workoutDoneCount = 0;
    scopeDays.forEach(function(d){ if (dayWorkoutSummary(d).done) workoutDoneCount++; });
    var scopeNames = exerciseNamesForDays(scopeDays);
    var workoutExpanded = ui.homeWorkoutExpanded;

    var cardioGoalScope = hp==='day' ? (Math.round(s.cardioGoalMinPerWeek/7) || 1) : hp==='week' ? (s.cardioGoalMinPerWeek||1) : (Math.round(s.cardioGoalMinPerWeek * (n/7)) || 1);
    var cardioPct = (scopeCardio.durationMin/cardioGoalScope)*100;

    var html = '<div class="list" style="padding:2px 14px">' +
      homeCalRow(round(scopeNut.cal).toLocaleString('tr-TR') + ' / ' + round(goalCalScope).toLocaleString('tr-TR') + ' kcal', calPct, scopeNut.p, scopeNut.f, scopeNut.k, goalProteinScope, goalFatScope, goalCarbScope);

    if (hp === 'day'){
      var wS = dayWorkoutSummary(scopeDays[0]);
      var wTi = typeInfo(wS.type);
      html += '<button type="button" class="home-week-row home-week-row-toggle" data-action="toggle-home-workout">' +
        '<span class="home-week-dot" style="background:var(' + wTi.colorVar + ')"></span>' +
        '<div class="home-week-mid"><div class="home-week-name">Antrenman</div>' +
        '<div class="home-week-bar"><div class="home-week-bar-fill" style="width:' + (wS.type==='rest' ? 0 : (wS.done?100:0)) + '%;background:var(' + wTi.colorVar + ')"></div></div></div>' +
        '<div class="home-week-val">' + (wS.type==='rest' ? 'Dinlenme' : (wS.done ? 'Tamamlandı' : 'Bekliyor')) + '</div>' +
        '<span class="home-week-chevron' + (workoutExpanded?' is-open':'') + '">' + icon('chevronR') + '</span>' +
      '</button>' +
      (workoutExpanded ? (scopeNames.length ? exerciseChipsHtml(scopeNames) : '<div class="hint" style="padding:0 4px 10px">Bugün henüz işlenmiş hareket yok.</div>') : '');
    } else {
      var workoutGoalScope = hp==='week' ? (s.workoutGoalPerWeek||1) : (Math.round((s.workoutGoalPerWeek||1) * (n/7)) || 1);
      html += '<button type="button" class="home-week-row home-week-row-toggle" data-action="toggle-home-workout">' +
        '<span class="home-week-dot" style="background:var(--pull)"></span>' +
        '<div class="home-week-mid"><div class="home-week-name">Antrenman</div>' +
        '<div class="home-week-bar"><div class="home-week-bar-fill" style="width:' + Math.max(0,Math.min(100,(workoutDoneCount/workoutGoalScope)*100)) + '%;background:var(--pull)"></div></div></div>' +
        '<div class="home-week-val">' + workoutDoneCount + ' / ' + workoutGoalScope + ' gün</div>' +
        '<span class="home-week-chevron' + (workoutExpanded?' is-open':'') + '">' + icon('chevronR') + '</span>' +
      '</button>' +
      (workoutExpanded ? (scopeNames.length ? exerciseChipsHtml(scopeNames) : '<div class="hint" style="padding:0 4px 10px">Bu dönemde henüz işlenmiş hareket yok.</div>') : '');
    }

    html += homeWeekRow('Kardiyo', scopeCardio.durationMin + ' / ' + cardioGoalScope + ' dk', cardioPct, '--accent');

    if (scopeSteps){
      var stepsGoalScope = (s.stepsGoalPerDay||8000) * n;
      var stepsPct = stepsGoalScope>0 ? (scopeSteps.steps/stepsGoalScope)*100 : 0;
      html += homeWeekRow('Adım', scopeSteps.steps.toLocaleString('tr-TR') + ' / ' + stepsGoalScope.toLocaleString('tr-TR'), stepsPct, '--legs');
    }

    html += '</div>';

    return html;
  }

  /* ---------- Beslenme içeriği ---------- */
  function renderNutritionContent(){
    if (ui.period === 'month') return renderNutritionMonth();
    if (ui.period === 'week') return renderNutritionWeekList();
    return renderNutritionDayList();
  }

  function macroBar(val, goal, colorVar){
    var pct = goal>0 ? Math.max(0, Math.min(100, (val/goal)*100)) : 0;
    return '<div class="stat-bar-track"><div class="stat-bar-fill" style="width:' + pct + '%;background:var(' + colorVar + ')"></div></div>';
  }

  function currentWeekDays(){
    var t = new Date();
    var dow = t.getDay();
    var mondayOffset = (dow===0) ? 6 : dow-1;
    var start = new Date(t); start.setDate(t.getDate()-mondayOffset);
    var out = [];
    for (var i=0;i<7;i++){ var d = new Date(start); d.setDate(start.getDate()+i); out.push(d); }
    return out;
  }

  function renderNutritionSummary(scope){
    var s = state.settings;
    var days, label, dayCount;
    if (scope === 'day'){ days = [new Date()]; label = 'Bugün Alınan Kalori'; dayCount = 1; }
    else if (scope === 'week'){ days = currentWeekDays(); label = 'Bu Hafta Alınan Kalori'; dayCount = 7; }
    else { days = allDaysInMonth(ui.cursor.getFullYear(), ui.cursor.getMonth()); label = 'Bu Ay Alınan Kalori'; dayCount = days.length; }
    var t = sumNutritionForDays(days);
    var goalCal = s.goalCalories * dayCount;
    var goalP = s.goalProtein * dayCount;
    var goalF = s.goalFat * dayCount;
    var goalK = s.goalCarb * dayCount;
    var pctCal = goalCal>0 ? Math.min(100, (t.cal/goalCal)*100) : 0;

    var heroTapAttrs = scope==='day' ? ' data-action="open-today-detail" data-tab="nutrition" style="cursor:pointer"' : '';
    var html = '<div class="hero-card"' + heroTapAttrs + '>' + heroWatermark('food') +
      '<div class="hero-top"><div><div class="hero-label">' + label + '</div>' +
      '<div class="hero-big">' + t.cal.toLocaleString('tr-TR') + '<span>/ ' + goalCal.toLocaleString('tr-TR') + ' kcal</span></div></div>' +
      '<div class="hero-pill">%' + round(pctCal) + '</div></div>' +
      '<div class="hero-bar-track"><div class="hero-bar-fill" style="width:' + pctCal + '%"></div></div>' +
      '<div class="hero-foot"><span>Günlük hedef ' + s.goalCalories.toLocaleString('tr-TR') + ' kcal</span><span>Ort. gün ' + round(t.cal/dayCount) + ' kcal</span></div>' +
      (scope==='day' ? '<div class="hero-tap-hint">Girmek için dokun ' + icon('chevronR') + '</div>' : '') +
    '</div>';

    html += '<div class="stat-grid">' +
      macroStatCard('Protein', t.p, goalP, '--protein', 'g') +
      macroStatCard('Yağ', t.f, goalF, '--fat', 'g') +
      macroStatCard('Karbonhidrat', t.k, goalK, '--carb', 'g') +
      macroStatCard('Ortalama/gün', round(t.cal/dayCount), s.goalCalories, '--accent', 'kcal') +
    '</div>';

    html += renderWeightCard();
    return html;
  }

  function renderNutritionMonth(){
    var y = ui.cursor.getFullYear(), m = ui.cursor.getMonth();
    var days = allDaysInMonth(y, m);
    var html = renderNutritionSummary('month');

    html += '<div class="section-title">Günlere Göre Dağılım</div>';
    var withData = days.filter(function(d){ var x=dayNutritionTotals(keyForDate(d)); return x.cal>0; });
    if (!withData.length){
      html += '<div class="list"><div class="empty-state">Bu ay henüz beslenme kaydı yok. Bir güne dokunup ekleyebilirsin.</div></div>';
    } else {
      html += '<div class="list">' + withData.slice().reverse().slice(0,8).map(function(d){
        var key = keyForDate(d);
        var x = dayNutritionTotals(key);
        return dayRowHtml(d, key, 'nutrition', x);
      }).join('') + '</div>';
    }
    html += renderCalendarGrid('nutrition');
    return html;
  }

  function macroStatCard(label, val, goal, colorVar, unit){
    var pct = goal>0 ? Math.max(0, Math.min(100, (val/goal)*100)) : 0;
    return '<div class="stat-card">' +
      '<div class="stat-card-label">' + label + '</div>' +
      '<div class="stat-card-val" style="color:var(' + colorVar + ')">' + val.toLocaleString('tr-TR') + '<span>' + unit + '</span></div>' +
      macroBar(val, goal, colorVar) +
      '<div class="stat-bar-foot"><b>%' + round(pct) + '</b><span>hedef ' + goal.toLocaleString('tr-TR') + '</span></div>' +
    '</div>';
  }

  /* ---------- kilo hedefi kartı ---------- */
  function renderWeightCard(){
    var s = state.settings;
    var latest = latestWeight();
    if (!latest){
      return '<div class="stat-card" style="margin-top:10px">' +
        '<div class="stat-card-label">Kilo Hedefi</div>' +
        '<div class="hint" style="margin-top:8px">Henüz kilo kaydın yok.</div>' +
        '<button type="button" class="btn btn-ghost btn-sm btn-block" style="margin-top:10px" data-action="open-weight-modal">' + icon('plus') + ' Kilo Gir</button>' +
      '</div>';
    }
    var weekAgo = weightNDaysAgo(7);
    var weekChange = weekAgo ? round10(latest.kg - weekAgo.kg) : 0;
    var monthAgo = weightNDaysAgo(30);
    var monthChange = monthAgo ? round10(latest.kg - monthAgo.kg) : 0;
    var weekGood = goalMet(weekChange, s.weeklyWeightGoalKg);
    var monthGood = goalMet(monthChange, s.monthlyWeightGoalKg);
    return '<div class="stat-card" style="margin-top:10px">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
        '<div><div class="stat-card-label">Güncel Kilo</div><div class="stat-card-val">' + latest.kg + '<span>kg</span></div></div>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-action="open-weight-modal">' + icon('plus') + ' Gir</button>' +
      '</div>' +
      '<div style="display:flex;gap:16px;margin-top:12px">' +
        '<div><div class="stat-card-label">Haftalık</div><div class="num" style="font-weight:700;font-size:14px;color:var(' + (weekGood?'--good':'--bad') + ')">' + (weekChange>0?'+':'') + weekChange + ' kg</div><div class="hint">hedef ' + s.weeklyWeightGoalKg + ' kg</div></div>' +
        '<div><div class="stat-card-label">Aylık</div><div class="num" style="font-weight:700;font-size:14px;color:var(' + (monthGood?'--good':'--bad') + ')">' + (monthChange>0?'+':'') + monthChange + ' kg</div><div class="hint">hedef ' + s.monthlyWeightGoalKg + ' kg</div></div>' +
      '</div>' +
    '</div>';
  }

  /* ---------- vücut ölçüleri kartı (ana sayfa) ---------- */
  function photoThumb(p, tagLabel){
    return '<div class="measure-photo-thumb"><img src="' + p.dataUrl + '" alt=""><span class="measure-photo-tag">' + tagLabel + ' · ' + p.date + '</span></div>';
  }
  function renderMeasureCard(){
    var comparisons = allMeasurementComparisons();
    var photos = sortedPhotos();
    if (!comparisons.length && !photos.length){
      return '<div class="stat-card measure-card" style="margin-top:10px">' +
        '<div class="stat-card-label">Vücut Ölçüleri</div>' +
        '<div class="hint" style="margin-top:8px">Henüz ölçüm veya fotoğraf yok.</div>' +
        '<button type="button" class="btn btn-ghost btn-sm btn-block" style="margin-top:10px" data-action="open-measure-modal">' + icon('plus') + ' Ölçüm / Fotoğraf Ekle</button>' +
      '</div>';
    }
    var html = '<div class="stat-card measure-card" style="margin-top:10px">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
        '<div class="stat-card-label">Vücut Ölçüleri</div>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-action="open-measure-modal">' + icon('plus') + ' Gir</button>' +
      '</div>';
    if (comparisons.length){
      html += '<div class="measure-chip-row">' + comparisons.slice(0,4).map(function(c){
        var arrow = c.delta > 0 ? '↑' : (c.delta < 0 ? '↓' : '');
        return '<div class="measure-chip">' +
          '<div class="measure-chip-label">' + c.label + '</div>' +
          '<div class="measure-chip-val">' + c.latest.valueCm + '<span>cm</span></div>' +
          (c.count > 1 ? ('<div class="measure-chip-delta' + (c.delta!==0?'':' is-muted') + '">' + arrow + ' ' + Math.abs(c.delta) + ' cm</div>') : '<div class="measure-chip-delta is-muted">ilk kayıt</div>') +
        '</div>';
      }).join('') + '</div>';
    }
    if (photos.length){
      var firstPh = photos[0], lastPh = photos[photos.length-1];
      html += '<div class="measure-photo-row">' +
        photoThumb(firstPh, 'İlk') +
        (photos.length > 1 ? photoThumb(lastPh, 'Son') : '') +
      '</div>';
    }
    html += '</div>';
    return html;
  }

  /* ---------- takvim ---------- */
  function calendarCellState(dateObj, kind){
    var key = keyForDate(dateObj);
    if (kind === 'nutrition'){
      var t = dayNutritionTotals(key);
      var hasData = t.cal > 0;
      var goal = state.settings.goalCalories;
      var pct = goal>0 ? (t.cal/goal)*100 : 0;
      return { hasData:hasData, colorVar: hasData ? (pct>=85 && pct<=115 ? '--good' : '--cal') : null, softVar: hasData ? (pct>=85 && pct<=115 ? '--protein-soft' : '--cal-soft') : null };
    }
    if (kind === 'cardio'){
      var ct = dayCardioTotals(key);
      var hasCData = ct.durationMin > 0 || !!(state.days[key] && state.days[key].steps);
      return { hasData:hasCData, colorVar: hasCData ? '--accent' : null, softVar: hasCData ? '--accent-soft' : null };
    }
    var s = dayWorkoutSummary(dateObj);
    var ti = typeInfo(s.type);
    return { hasData:s.done, colorVar: ti.colorVar, softVar: ti.softVar, isRest: s.type==='rest' };
  }

  function renderCalendarGrid(kind){
    var y = ui.cursor.getFullYear(), m = ui.cursor.getMonth();
    var first = new Date(y, m, 1);
    var lead = (first.getDay()===0) ? 6 : first.getDay()-1;
    var n = daysInMonth(y, m);
    var html = '<div class="section-title">Takvim</div><div class="cal-grid cal-weekday-row">' +
      ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(function(w){ return '<div class="cal-weekday">' + w + '</div>'; }).join('') +
    '</div><div class="cal-grid">';
    for (var i=0;i<lead;i++) html += '<div class="cal-cell cal-cell-empty"></div>';
    for (var day=1; day<=n; day++){
      var d = new Date(y, m, day);
      var key = keyForDate(d);
      var isToday = key === todayKey();
      var cs = calendarCellState(d, kind);
      var bg = cs.hasData ? ('background:var(' + cs.softVar + ');color:var(' + cs.colorVar + ')') : (cs.isRest ? 'background:var(--rest-soft);color:var(--text-faint)' : '');
      html += '<button type="button" class="cal-cell' + (isToday?' is-today':'') + '" style="' + bg + '" data-action="open-day" data-key="' + key + '">' +
        '<span>' + day + '</span>' +
        (cs.hasData ? '<span class="cal-dot" style="background:var(' + cs.colorVar + ')"></span>' : '') +
      '</button>';
    }
    html += '</div>';
    return html;
  }

  function dayRowHtml(dateObj, key, kind, nutritionTotals){
    var wd = WEEKDAYS_SHORT[dateObj.getDay()];
    var isToday = key === todayKey();
    var rightHtml, midHtml, iconHtml;
    if (kind === 'nutrition'){
      var goal = state.settings.goalCalories;
      var hasData = nutritionTotals.cal > 0;
      iconHtml = '<div class="day-icon" style="background:var(' + (hasData?'--cal-soft':'--surface-3') + ');color:var(' + (hasData?'--cal':'--text-faint') + ')">' + icon('food') + '</div>';
      rightHtml = hasData
        ? '<div class="day-right-val">' + nutritionTotals.cal.toLocaleString('tr-TR') + '<span style="font-weight:500;color:var(--text-faint);font-size:11px"> kcal</span></div>' +
          '<div class="day-right-sub">P ' + nutritionTotals.p + ' · Y ' + nutritionTotals.f + ' · K ' + nutritionTotals.k + '</div>'
        : '<div class="day-right-val is-empty">—</div>';
      midHtml = hasData
        ? '<div class="day-mid-sub">Hedefin %' + (goal>0?round((nutritionTotals.cal/goal)*100):0) + '’i</div>'
        : '<div class="day-mid-sub">Kayıt yok</div>';
    } else if (kind === 'cardio'){
      var ct = dayCardioTotals(key);
      var daySteps = (state.days[key] && state.days[key].steps) || null;
      var hasCData = ct.durationMin > 0;
      var cIconName = hasCData ? 'pulse' : 'footprints';
      iconHtml = '<div class="day-icon" style="background:var(' + ((hasCData||daySteps)?'--accent-soft':'--surface-3') + ');color:var(' + ((hasCData||daySteps)?'--accent':'--text-faint') + ')">' + icon(cIconName) + '</div>';
      rightHtml = hasCData
        ? '<div class="day-right-val">' + ct.durationMin + '<span style="font-weight:500;color:var(--text-faint);font-size:11px"> dk</span></div><div class="day-right-sub">' + ct.calories.toLocaleString('tr-TR') + ' kcal</div>'
        : (daySteps ? ('<div class="day-right-val">' + daySteps.toLocaleString('tr-TR') + '<span style="font-weight:500;color:var(--text-faint);font-size:11px"> adım</span></div><div class="day-right-sub">≈' + stepsCalories(daySteps) + ' kcal</div>') : '<div class="day-right-val is-empty">—</div>');
      midHtml = (hasCData || daySteps) ? ('<div class="day-mid-sub">' + ct.count + ' kayıt' + (daySteps ? (' · ' + daySteps.toLocaleString('tr-TR') + ' adım') : '') + '</div>') : '<div class="day-mid-sub">Kayıt yok</div>';
    } else {
      var s = dayWorkoutSummary(dateObj);
      var ti = typeInfo(s.type);

      html += '<div class="section-title">Plandan Seç</div><div class="check-list">' +
        planItems.map(function(pe){
          var isChecked = d.exercises.some(function(ex){ return ex.sourcePlanId === pe.id || ex.name.toLowerCase() === pe.name.toLowerCase(); });
          var subParts = [];
          var peRegion = regionForExercise(pe.name);
          if (peRegion) subParts.push(peRegion);
          if (pe.sets && pe.repMin && pe.repMax) subParts.push(pe.sets + '×' + pe.repMin + '-' + pe.repMax);
          if (pe.targetWeight) subParts.push('Hedef ' + pe.targetWeight + 'kg');
          return '<button type="button" class="check-row' + (isChecked?' is-checked':'') + '" data-action="toggle-exercise-plan-check" data-key="' + key + '" data-planid="' + pe.id + '" data-type="' + currentType + '">' +
            '<span class="check-circle">' + icon('check') + '</span>' +
            '<div class="check-row-main"><div class="check-row-name">' + esc(pe.name) + '</div>' +
            (subParts.length ? '<div class="check-row-sub">' + subParts.join(' · ') + '</div>' : '') + '</div>' +
          '</button>';
        }).join('') + '</div>';
    }
    html += '<div class="section-title">Egzersizler</div>';
    if (!d.exercises.length){
      html += '<div class="empty-state">Henüz egzersiz eklenmedi.</div>';
    } else {
      html += d.exercises.map(function(ex){
        var planEntry = (state.exercisePlans[currentType]||[]).filter(function(pe){ return pe.name.toLowerCase()===ex.name.toLowerCase(); })[0];
        var maxToday = ex.sets.reduce(function(mx,s){ return Math.max(mx, num(s.weight)); }, 0);
        var targetNote = planEntry && planEntry.targetWeight ? ('<span style="color:' + (maxToday>=planEntry.targetWeight?'var(--good)':'var(--text-faint)') + '">Hedef ' + planEntry.targetWeight + 'kg' + (maxToday>=planEntry.targetWeight?' ✓':'') + '</span>') : '';
        var lastSet = ex.sets.length ? ex.sets[ex.sets.length-1] : null;
        var histPerf = !lastSet ? lastPerformance(ex.name, key) : null;
        var prefillReps = lastSet ? lastSet.reps : (histPerf ? histPerf.reps : (planEntry && planEntry.repMin ? planEntry.repMin : ''));
        var prefillWeight = lastSet ? lastSet.weight : (histPerf ? histPerf.weight : (planEntry && planEntry.targetWeight ? planEntry.targetWeight : ''));
        var histNote = (!lastSet && histPerf) ? '<div class="hint" style="margin-top:2px">Son sefer: ' + histPerf.reps + '×' + histPerf.weight + 'kg</div>' : '';
        var prevBest = previousSessionBest(ex.name, key);
        var analysisNote = (prevBest && maxToday > 0)
          ? ('<div class="hint" style="margin-top:2px">Önceki en iyi: ' + prevBest.weight + ' kg' + weightDeltaBadge(maxToday, prevBest.weight) + '</div>')
          : '';
        var exRegion = regionForExercise(ex.name);
        var regionNote = exRegion ? '<span class="region-tag">' + esc(exRegion) + '</span>' : '';
        return '<div class="ex-card"><div class="ex-card-head"><div><button type="button" class="ex-card-name" data-action="open-exercise-history" data-name="' + esc(ex.name) + '" style="background:none;border:none;padding:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer;color:inherit;font:inherit">' + esc(ex.name) + '</button> ' + regionNote + (targetNote ? '<div class="hint" style="margin-top:2px">' + targetNote + '</div>' : '') + histNote + analysisNote + '</div>' +
          '<button class="del-btn" data-action="delete-exercise" data-key="' + key + '" data-exid="' + ex.id + '">' + icon('trash') + '</button></div>' +
          (ex.sets.length ? ('<div class="set-head-row"><span></span><span>Tekrar</span><span>Kilo (kg)</span><span></span></div>' +
            ex.sets.map(function(s, i){
              return '<div class="set-row"><span class="set-row-label">' + (i+1) + '</span><div class="num">' + s.reps + '</div><div class="num">' + s.weight + ' kg</div>' +
                '<button class="del-btn" data-action="delete-set" data-key="' + key + '" data-exid="' + ex.id + '" data-setidx="' + i + '">' + icon('trash') + '</button></div>';
            }).join('')) : '<div class="hint" style="margin-bottom:8px">Henüz set yok.</div>') +
          '<div class="set-add-row">' +
            '<div class="stepper-row">' +
              '<div class="stepper-field"><div class="stepper-field-label">Tekrar</div><div class="stepper">' +
                '<button type="button" class="stepper-btn" data-action="step-input" data-target="reps-' + ex.id + '" data-step="-1" data-min="0">−</button>' +
                '<input type="number" inputmode="numeric" id="reps-' + ex.id + '" value="' + prefillReps + '">' +
                '<button type="button" class="stepper-btn" data-action="step-input" data-target="reps-' + ex.id + '" data-step="1" data-min="0">+</button>' +
              '</div></div>' +
              '<div class="stepper-field"><div class="stepper-field-label">Kilo (kg)</div><div class="stepper">' +
                '<button type="button" class="stepper-btn" data-action="step-input" data-target="weight-' + ex.id + '" data-step="-2.5" data-min="0">−</button>' +
                '<input type="number" inputmode="decimal" id="weight-' + ex.id + '" value="' + prefillWeight + '">' +
                '<button type="button" class="stepper-btn" data-action="step-input" data-target="weight-' + ex.id + '" data-step="2.5" data-min="0">+</button>' +
              '</div></div>' +
            '</div>' +
            '<div class="set-add-actions">' +
              (lastSet ? '<button type="button" class="btn btn-ghost btn-sm" data-action="repeat-last-set" data-key="' + key + '" data-exid="' + ex.id + '">' + icon('plus') + ' Son Seti Tekrarla</button>' : '') +
              '<button type="button" class="btn btn-primary btn-sm" data-action="add-set" data-key="' + key + '" data-exid="' + ex.id + '">' + icon('plus') + ' Set Ekle</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }
    html += '<details class="manual-add"' + (ui.manualAddOpen.workout ? ' open' : '') + '><summary data-action="toggle-manual-add" data-section="workout">' + icon('plus') + ' Manuel Egzersiz Ekle</summary>' +
      '<div class="form">' +

        '<button type="button" class="btn btn-primary btn-block" data-action="add-exercise" data-key="' + key + '">' + icon('plus') + ' Egzersiz Ekle</button>' +
      '</div></details>';

        comparisons.map(function(c){
          var arrow = c.delta > 0 ? '↑' : (c.delta < 0 ? '↓' : '—');
