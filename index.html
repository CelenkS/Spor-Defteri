<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Spor Defteri</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6A33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spor Defteri">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style id="app-style">
  :root{
    color-scheme: light;
    --bg:#F3F1EF; --surface:#FFFFFF; --surface-2:#ECE7E3; --surface-3:#F8F6F4;
    --border:#E2DAD3; --text:#1A1310; --text-dim:#6B5F58; --text-faint:#9C8E85;
    --accent:#FF6A33; --accent2:#E8302E; --accent-soft:#FFE7DC;
    --cal:#E8703A; --cal-soft:#FBE6DC;
    --protein:#1E9E5C; --protein-soft:#DEF3E7;
    --fat:#C68A1A; --fat-soft:#F6ECD6;
    --carb:#2D72C9; --carb-soft:#DEEAF9;
    --push:#C9344E; --push-soft:#FAE0E4;
    --pull:#FF6A33; --pull-soft:#FFE7DC;
    --legs:#7C5CC9; --legs-soft:#E9E2F8;
    --upper:#C4791E; --upper-soft:#F5E5D2;
    --rest:#9C8E85; --rest-soft:#ECE7E3;
    --sleep:#3D5A99; --sleep-soft:#E1E6F5;
    --good:#1E9E5C; --bad:#D8503B;
    --shadow: 0 1px 2px rgba(26,19,16,.06), 0 8px 20px -12px rgba(26,19,16,.15);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#120D0C; --surface:#1E1512; --surface-2:#2A1E19; --surface-3:#180F0D;
      --border:#3A2B24; --text:#FBF2EC; --text-dim:#C9B2A6; --text-faint:#8C7468;
      --accent:#FF8255; --accent2:#FF4C3B; --accent-soft:#3A1F14;
      --cal:#FF8A5C; --cal-soft:#2E1F16;
      --protein:#4EDB8D; --protein-soft:#132A1E;
      --fat:#F0BE4E; --fat-soft:#2C2413;
      --carb:#5FA8F5; --carb-soft:#132330;
      --push:#FF6B7A; --push-soft:#331A1D;
      --pull:#FF8255; --pull-soft:#3A1F14;
      --legs:#B79BF0; --legs-soft:#211C33;
      --upper:#F0AE5C; --upper-soft:#2C2213;
      --rest:#8C7468; --rest-soft:#2A1E19;
      --sleep:#7C94DB; --sleep-soft:#1B2338;
      --good:#4EDB8D; --bad:#FF7A66;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#120D0C; --surface:#1E1512; --surface-2:#2A1E19; --surface-3:#180F0D;
    --border:#3A2B24; --text:#FBF2EC; --text-dim:#C9B2A6; --text-faint:#8C7468;
    --accent:#FF8255; --accent2:#FF4C3B; --accent-soft:#3A1F14;
    --cal:#FF8A5C; --cal-soft:#2E1F16;
    --protein:#4EDB8D; --protein-soft:#132A1E;
    --fat:#F0BE4E; --fat-soft:#2C2413;
    --carb:#5FA8F5; --carb-soft:#132330;
    --push:#FF6B7A; --push-soft:#331A1D;
    --pull:#FF8255; --pull-soft:#3A1F14;
    --legs:#B79BF0; --legs-soft:#211C33;
    --upper:#F0AE5C; --upper-soft:#2C2213;
    --rest:#8C7468; --rest-soft:#2A1E19;
    --sleep:#7C94DB; --sleep-soft:#1B2338;
    --good:#4EDB8D; --bad:#FF7A66;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .num{ font-family:'JetBrains Mono', monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  input, select{ font-family:inherit; }

  .app-shell{ max-width:520px; margin:0 auto; min-height:100%; padding-bottom:78px; position:relative; }

  /* ---------- header ---------- */
  .app-header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--bg); padding:14px 16px 10px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-bottom:1px solid var(--border);
  }
  .app-title{ font-family:'Sora',sans-serif; font-weight:800; font-size:19px; letter-spacing:-.2px; }
  .app-title small{ display:block; font-family:'IBM Plex Sans',sans-serif; font-weight:500; font-size:11px; color:var(--text-faint); margin-top:1px; }
  .header-actions{ display:flex; gap:8px; }
  .icon-btn{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:center; color:var(--text-dim); cursor:pointer;
  }
  .icon-btn svg{ width:18px; height:18px; }
  .save-status{ font-size:10px; color:var(--text-faint); display:flex; align-items:center; gap:5px; margin-top:2px; }
  .save-dot{ width:6px; height:6px; border-radius:50%; background:var(--good); }
  .save-status.is-saving .save-dot{ background:var(--fat); }
  .save-status.is-local .save-dot{ background:var(--text-faint); }

  /* ---------- month nav + period toggle ---------- */
  .month-nav{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px 4px; }
  .month-nav-btn{ width:32px; height:32px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); display:flex; align-items:center; justify-content:center; }
  .month-nav-label{ font-family:'Sora',sans-serif; font-weight:800; font-size:20px; letter-spacing:-.3px; }
  .period-toggle{ display:flex; background:var(--surface-2); border-radius:11px; padding:3px; margin:10px 16px 4px; }
  .period-btn{ flex:1; text-align:center; padding:8px 0; border-radius:8px; font-size:13px; font-weight:600; color:var(--text-dim); border:none; background:transparent; }
  .period-btn.is-active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow); }

  .tab-sub-row{ display:flex; gap:8px; padding:10px 16px 2px; overflow-x:auto; }
  .tab-sub-btn{ white-space:nowrap; padding:7px 13px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-size:12.5px; font-weight:600; }
  .tab-sub-btn.is-active{ background:var(--text); color:var(--bg); border-color:var(--text); }

  .content{ padding:6px 16px 20px; }
  .section-title{ font-size:12.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; margin:18px 2px 9px; }

  /* ---------- stat cards (ay view) ---------- */
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; box-shadow:var(--shadow); }
  .stat-card-label{ font-size:11.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; }
  .stat-card-val{ font-family:'Sora',sans-serif; font-weight:800; font-size:24px; margin-top:6px; letter-spacing:-.3px; }
  .stat-card-val span{ font-size:13px; font-weight:600; color:var(--text-faint); margin-left:3px; }
  .stat-bar-track{ height:6px; border-radius:99px; background:var(--surface-2); margin-top:11px; overflow:hidden; }
  .stat-bar-fill{ height:100%; border-radius:99px; }
  .stat-bar-foot{ display:flex; justify-content:space-between; margin-top:7px; font-size:11px; color:var(--text-faint); }
  .stat-bar-foot b{ color:var(--text-dim); }

  .hero-card{ background:linear-gradient(135deg, var(--accent), var(--accent2) 130%); border-radius:20px; padding:18px; color:#fff; box-shadow:var(--shadow); }
  :root:not([data-theme="light"]) .hero-card{ background:linear-gradient(135deg, #B8431F, #7A1612 140%); }
  :root[data-theme="dark"] .hero-card{ background:linear-gradient(135deg, #B8431F, #7A1612 140%); }
  .hero-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .hero-label{ font-size:12px; font-weight:600; opacity:.85; }
  .hero-big{ font-family:'Sora',sans-serif; font-weight:800; font-size:32px; margin-top:4px; letter-spacing:-.4px; }
  .hero-big span{ font-size:15px; font-weight:600; opacity:.8; margin-left:3px; }
  .hero-pill{ background:rgba(255,255,255,.18); border-radius:999px; padding:5px 11px; font-size:11.5px; font-weight:700; }
  .hero-bar-track{ height:7px; border-radius:99px; background:rgba(255,255,255,.25); margin-top:14px; overflow:hidden; }
  .hero-bar-fill{ height:100%; border-radius:99px; background:#fff; }
  .hero-foot{ display:flex; justify-content:space-between; margin-top:8px; font-size:11.5px; opacity:.85; }
  .hero-tap-hint{ display:flex; align-items:center; gap:3px; margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,.18); font-size:11.5px; font-weight:700; opacity:.9; }
  .hero-tap-hint svg{ width:13px; height:13px; }

  .breakdown-toggle{ display:flex; background:var(--surface-2); border-radius:11px; padding:3px; margin:16px 0 10px; }
  .bd-row{ display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--border); }
  .bd-row:last-child{ border-bottom:none; }
  .bd-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .bd-name{ font-weight:600; font-size:13.5px; }
  .bd-sub{ font-size:11.5px; color:var(--text-faint); margin-top:1px; }
  .bd-right{ margin-left:auto; text-align:right; }
  .bd-pct{ font-weight:700; font-size:13.5px; }

  /* ---------- day list (gün / hafta) ---------- */
  .list{ border:1px solid var(--border); border-radius:16px; overflow:hidden; background:var(--surface); box-shadow:var(--shadow); }
  .day-row{ display:flex; align-items:center; gap:10px; padding:13px 14px; border:none; border-bottom:1px solid var(--border); background:var(--surface); width:100%; text-align:left; }
  .day-row:last-child{ border-bottom:none; }
  .day-row:active{ background:var(--surface-3); }
  .day-date{ width:40px; flex:none; }
  .day-date-num{ font-family:'Sora',sans-serif; font-weight:800; font-size:16px; }
  .day-date-wd{ font-size:10.5px; color:var(--text-faint); font-weight:600; margin-top:1px; }
  .day-mid{ flex:1; min-width:0; }
  .day-type-badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700; }
  .day-type-badge .dot{ width:6px; height:6px; border-radius:50%; }
  .day-mid-sub{ font-size:11.5px; color:var(--text-faint); margin-top:5px; }
  .day-right{ flex:none; text-align:right; }
  .day-right-val{ font-weight:700; font-size:14.5px; }
  .day-right-val.is-empty{ color:var(--text-faint); font-weight:400; }
  .day-right-sub{ font-size:10.5px; color:var(--text-faint); margin-top:2px; }
  .day-chevron{ color:var(--text-faint); flex:none; }

  .week-total-row{ display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--surface-3); border-bottom:1px solid var(--border); }
  .week-total-row:last-child{ border-bottom:none; }
  .week-total-label{ font-size:11px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; }
  .week-total-date{ font-size:12.5px; font-weight:700; }
  .week-total-mid{ flex:1; }
  .week-total-right{ text-align:right; }
  .week-total-val{ font-weight:800; font-size:14.5px; }
  .week-total-sub{ font-size:10.5px; margin-top:2px; font-weight:700; }
  .week-total-sub.is-good{ color:var(--good); }
  .week-total-sub.is-bad{ color:var(--cal); }

  .empty-state{ text-align:center; padding:34px 16px; color:var(--text-faint); font-size:13.5px; }

  /* ---------- overlay / modal ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(4,8,12,.5); z-index:50; display:flex; align-items:flex-end; }
  .modal{
    background:var(--surface); width:100%; max-width:520px; margin:0 auto; border-radius:20px 20px 0 0;
    max-height:88vh; overflow-y:auto; padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-title{ font-family:'Sora',sans-serif; font-weight:800; font-size:18px; }
  .modal-sub{ font-size:12px; color:var(--text-faint); margin-top:2px; }

  .form{ display:flex; flex-direction:column; gap:12px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px; }
  .field input, .field select{
    width:100%; padding:11px 12px; border-radius:11px; border:1px solid var(--border); background:var(--surface-3);
    color:var(--text); font-size:14.5px;
  }
  .field-row{ display:grid; gap:10px; }
  .field-row.cols-2{ grid-template-columns:1fr 1fr; }
  .field-row.cols-4{ grid-template-columns:repeat(4,1fr); }
  .hint{ font-size:11.5px; color:var(--text-faint); }

  .btn{ border:none; border-radius:12px; padding:12px 16px; font-weight:700; font-size:14.5px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn svg{ width:16px; height:16px; flex:none; }
  .btn-primary{ background:var(--text); color:var(--bg); }
  .btn-block{ width:100%; display:flex; align-items:center; justify-content:center; gap:7px; }
  .btn-ghost{ background:var(--surface-2); color:var(--text); }
  .btn-sm{ padding:9px 12px; font-size:13px; }
  .del-btn{ background:none; border:none; color:var(--text-faint); padding:6px; display:flex; }
  .del-btn svg{ width:16px; height:16px; }
  .quick-add-chip svg{ width:14px; height:14px; flex:none; }

  .macro-chip-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .mchip{ display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:999px; font-size:10.5px; font-weight:700; }
  .mchip.p{ background:var(--protein-soft); color:var(--protein); }
  .mchip.f{ background:var(--fat-soft); color:var(--fat); }
  .mchip.k{ background:var(--carb-soft); color:var(--carb); }
  .mchip.cal{ background:var(--cal-soft); color:var(--cal); }

  .entry-row{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .entry-row:last-child{ border-bottom:none; }
  .entry-main{ flex:1; min-width:0; }
  .entry-name{ font-weight:600; font-size:14px; }
  .entry-sub{ font-size:11.5px; color:var(--text-faint); margin-top:3px; }
  .entry-val{ font-weight:700; font-size:14px; flex:none; }

  .plan-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .plan-row:last-child{ border-bottom:none; }
  .plan-day-label{ font-weight:700; font-size:14px; width:78px; flex:none; }
  .type-select-row{ display:flex; gap:6px; flex-wrap:wrap; flex:1; justify-content:flex-end; }
  .type-pill{ padding:6px 10px; border-radius:999px; font-size:11.5px; font-weight:700; border:1.5px solid transparent; opacity:.55; }
  .type-pill.is-active{ opacity:1; border-color:currentColor; }

  .set-row{ display:grid; grid-template-columns:22px 1fr 1fr 30px; gap:8px; align-items:center; margin-bottom:7px; }
  .set-row-label{ font-size:11.5px; color:var(--text-faint); font-weight:700; text-align:center; }
  .set-row input{ padding:9px 10px; border-radius:9px; border:1px solid var(--border); background:var(--surface-3); color:var(--text); font-size:14px; width:100%; }
  .ex-card{ border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:10px; background:var(--surface-3); }
  .ex-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .ex-card-name{ font-weight:700; font-size:14px; }
  .set-head-row{ display:grid; grid-template-columns:22px 1fr 1fr 30px; gap:8px; font-size:10px; color:var(--text-faint); font-weight:700; margin-bottom:6px; }

  .set-add-row{ background:var(--surface-2); border-radius:12px; padding:10px; margin-top:8px; }
  .stepper-row{ display:flex; gap:8px; }
  .stepper-field{ flex:1; min-width:0; }
  .stepper-field-label{ font-size:10px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.03em; margin-bottom:5px; text-align:center; }
  .stepper{ display:flex; align-items:stretch; background:var(--surface-3); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .stepper-btn{ width:36px; flex:none; border:none; background:none; color:var(--text); font-size:19px; font-weight:600; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .stepper-btn:active{ background:var(--surface-2); }
  .stepper input{ flex:1; min-width:0; text-align:center; border:none; background:none; color:var(--text); font-size:15.5px; font-weight:700; padding:8px 0; font-family:'JetBrains Mono',monospace; -moz-appearance:textfield; }
  .stepper input:focus{ outline:none; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .set-add-actions{ display:flex; gap:8px; margin-top:9px; }
  .set-add-actions .btn{ flex:1; }

  .ex-card.is-collapsed{ padding:10px 12px; cursor:pointer; }
  .ex-card.is-collapsed .ex-card-head{ margin-bottom:0; }
  .ex-card-summary{ font-size:12px; color:var(--text-faint); margin-top:2px; }
  .ex-card-collapse-hint{ font-size:11px; color:var(--accent); font-weight:700; }

  .session-badge{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--accent-soft); color:var(--accent); border-radius:14px; padding:11px 14px; margin-bottom:14px; font-weight:700; }
  .session-badge-left{ display:flex; align-items:center; gap:8px; font-size:14px; }
  .session-badge-left svg{ width:17px; height:17px; }
  .session-badge button{ border:none; background:var(--surface); color:var(--text-dim); border-radius:9px; padding:6px 11px; font-size:12px; font-weight:700; cursor:pointer; }

  .rest-timer-bar{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 54px); z-index:19; display:flex; align-items:center; justify-content:space-between; gap:10px; background:linear-gradient(135deg, var(--accent), var(--accent2) 130%); color:#fff; border-radius:14px; padding:11px 14px; margin:8px 16px 0; box-shadow:var(--shadow); }
  .rest-timer-left{ display:flex; align-items:center; gap:9px; }
  .rest-timer-left svg{ width:18px; height:18px; }
  .rest-timer-label{ font-size:11px; opacity:.85; font-weight:600; }
  .rest-timer-val{ font-family:'JetBrains Mono',monospace; font-size:19px; font-weight:800; }
  .rest-timer-bar button{ border:none; background:rgba(255,255,255,.22); color:#fff; border-radius:9px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .rest-timer-bar button svg{ width:15px; height:15px; }

  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--border);
    padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px)); display:flex; max-width:520px; margin:0 auto;
  }
  .tab-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0; background:none; border:none; color:var(--text-faint); font-size:11px; font-weight:600; }
  .tab-btn.is-active{ color:var(--accent); }
  .tab-btn svg{ width:21px; height:21px; }

  .empty-icon{ width:40px; height:40px; margin:0 auto 10px; color:var(--text-faint); }

  /* ---------- takvim ---------- */
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px; }
  .cal-weekday-row{ margin-bottom:2px; }
  .cal-weekday{ text-align:center; font-size:10.5px; font-weight:700; color:var(--text-faint); padding:2px 0; }
  .cal-cell{
    aspect-ratio:1; border-radius:10px; border:1px solid var(--border); background:var(--surface);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-size:12.5px; font-weight:700; color:var(--text); position:relative;
  }
  .cal-cell-empty{ border:none; background:none; }
  .cal-cell.is-today{ box-shadow:0 0 0 2px var(--accent) inset; }
  .cal-dot{ width:5px; height:5px; border-radius:50%; }

  /* ---------- kayıtlı program / hedef listeleri ---------- */
  .plan-item-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .plan-item-row:last-child{ border-bottom:none; }

  .note-row{ display:flex; align-items:flex-start; gap:12px; padding:12px 13px; border-bottom:1px solid var(--border); }
  .note-row:last-child{ border-bottom:none; }

  .note-row-text{ flex:1; min-width:0; font-size:14px; line-height:1.45; white-space:pre-wrap; word-break:break-word; padding-top:1px; }

  /* ---------- ana sayfa ---------- */
  .home-greet{ padding:8px 2px 2px; }

  .home-greet-date{ font-size:12.5px; color:var(--text-faint); margin-top:2px; font-weight:500; }

  .home-tile{
    position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:12px 13px 13px;
    box-shadow:var(--shadow); text-align:left; display:flex; flex-direction:column; gap:2px; width:100%;
  }

  .home-tile-val{ font-family:'Sora',sans-serif; font-weight:800; font-size:16.5px; letter-spacing:-.2px; margin-top:2px; position:relative; }
  .home-tile-sub{ font-size:10.5px; color:var(--text-faint); font-weight:600; margin-top:1px; position:relative; }
  .home-tile-bar{ height:5px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-top:8px; position:relative; }
  .home-tile-bar-fill{ height:100%; border-radius:99px; }
  .home-week-row{ display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--border); }
  .home-week-row:last-child{ border-bottom:none; }
  .home-week-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .home-week-mid{ flex:1; min-width:0; }
  .home-week-name{ font-weight:600; font-size:13.5px; }
  .home-week-bar{ height:5px; border-radius:99px; background:var(--surface-2); margin-top:6px; overflow:hidden; }
  .home-week-bar-fill{ height:100%; border-radius:99px; }
  .home-week-val{ font-weight:700; font-size:13px; flex:none; margin-left:auto; }
  .home-week-row-toggle{ width:100%; border:none; background:none; font:inherit; color:inherit; cursor:pointer; text-align:left; }
  .home-week-chevron{ flex:none; display:flex; color:var(--text-faint); transform:rotate(90deg); transition:transform .15s ease; margin-left:2px; }
  .home-week-chevron svg{ width:14px; height:14px; }
  .home-week-chevron.is-open{ transform:rotate(-90deg); }
  .home-macro-breakdown{ padding:2px 4px 8px 19px; }
  .home-macro-mini-row{ display:flex; align-items:center; gap:10px; padding:7px 0; }
  .home-macro-mini-row .home-week-name{ font-size:12px; color:var(--text-dim); font-weight:600; }
  .home-macro-mini-row .home-week-bar{ height:4px; margin-top:4px; }
  .home-macro-mini-row .home-week-val{ font-size:11.5px; color:var(--text-faint); }
  .home-month-row{ display:flex; justify-content:space-between; gap:8px; }
  .home-month-stat{ flex:1; text-align:center; padding:12px 4px; }
  .home-month-stat-val{ font-family:'Sora',sans-serif; font-weight:800; font-size:17px; }
  .home-month-stat-label{ font-size:10px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-top:3px; }

  /* ---------- görsel yenileme: hero watermark, net kalori, hafta şeridi, adım kartı ---------- */
  .hero-card{ position:relative; overflow:hidden; }
  .hero-watermark{ position:absolute; right:-8px; top:-8px; width:88px; height:88px; opacity:.16; color:#fff; pointer-events:none; }
  .hero-watermark svg{ width:100%; height:100%; }

  .week-summary-card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:14px; box-shadow:var(--shadow); }
  .week-summary-row{ display:flex; align-items:stretch; }

  .week-summary-stat-icon svg{ width:17px; height:17px; }
  .week-summary-stat-val{ font-family:'Sora',sans-serif; font-weight:800; font-size:15.5px; letter-spacing:-.2px; margin-top:2px; }
  .week-summary-stat-label{ font-size:10px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
  .net-cal-card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:15px 14px; box-shadow:var(--shadow); margin-top:12px; }
  .net-cal-head{ display:flex; align-items:center; gap:9px; }
  .net-cal-icon{ width:26px; height:26px; border-radius:8px; background:var(--cal-soft); color:var(--cal); display:flex; align-items:center; justify-content:center; flex:none; }
  .net-cal-icon svg{ width:14px; height:14px; }

  .net-cal-split-in{ background:var(--cal); }
  .net-cal-split-out{ background:var(--good); }

  .week-strip{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:10px; }
  .week-strip-cell{ border:1px solid var(--border); border-radius:14px; padding:9px 1px 8px; display:flex; flex-direction:column; align-items:center; gap:5px; box-shadow:var(--shadow); }
  .week-strip-cell.is-today{ box-shadow:0 0 0 2px var(--accent) inset, var(--shadow); }
  .week-strip-wd{ font-size:9px; font-weight:700; opacity:.75; text-transform:uppercase; letter-spacing:.02em; }

  .week-strip-dots{ display:flex; gap:2.5px; min-height:5px; align-items:center; }
  .week-strip-dot{ width:5px; height:5px; border-radius:50%; }
  .week-strip-cell.is-selected{ box-shadow:0 0 0 2px var(--text) inset, var(--shadow); }
  .week-strip-cell.is-today{ background:linear-gradient(135deg, var(--accent), var(--accent2) 130%) !important; color:#fff !important; box-shadow:var(--shadow); border-color:transparent; }
  .week-strip-cell.is-today .week-strip-wd{ opacity:.85; }
  .week-strip-cell.is-today .week-strip-num{ color:#fff; }
  .week-strip-cell.is-today.is-selected{ box-shadow:0 0 0 2px var(--text) inset, var(--shadow); }

  /* ---------- ana sayfa hero (karşılama + genel ilerleme halkası) ---------- */
  .home-hero{ margin:10px 0 4px; animation:home-hero-in .45s cubic-bezier(.2,.7,.3,1) both; }
  @media (prefers-reduced-motion: reduce){ .home-hero{ animation:none; } }
  @keyframes home-hero-in{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  .home-hero-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; position:relative; }
  .home-hero-greet{ font-family:'Sora',sans-serif; font-weight:800; font-size:21px; letter-spacing:-.3px; display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  .home-hero-date{ font-size:12px; opacity:.88; margin-top:3px; font-weight:500; }
  .streak-badge.on-hero{ background:rgba(255,255,255,.24); color:#fff; }
  .home-ring{ position:relative; width:58px; height:58px; flex:none; }
  .home-ring svg{ width:58px; height:58px; transform:rotate(-90deg); display:block; }
  .home-ring circle{ fill:none; stroke-width:5.5; }
  .home-ring .ring-track{ stroke:rgba(255,255,255,.25); }
  .home-ring .ring-fill{ stroke:#fff; stroke-linecap:round; transition:stroke-dashoffset .5s ease; }
  .home-ring-val{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Sora',sans-serif; font-weight:800; font-size:13.5px; }
  .home-hero-msg{ font-size:12.5px; font-weight:600; opacity:.95; margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,.18); display:flex; align-items:center; gap:6px; position:relative; }
  .home-hero-msg svg{ width:14px; height:14px; flex:none; }

  .home-tile{ transition:transform .12s ease; }
  .home-tile:active{ transform:scale(.96); }
  .stat-card{ transition:transform .12s ease; }

  .day-sum-card{ margin-top:10px; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:15px; box-shadow:var(--shadow); }
  .day-sum-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .day-sum-title{ font-family:'Sora',sans-serif; font-weight:800; font-size:15px; }
  .day-sum-close{ background:var(--surface-2); border:none; border-radius:9px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); cursor:pointer; }
  .day-sum-close svg{ width:14px; height:14px; }
  .day-sum-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .day-sum-item{ background:var(--surface-3); border-radius:13px; padding:10px 11px; display:flex; align-items:center; gap:9px; }
  .day-sum-item-icon{ width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; }
  .day-sum-item-icon svg{ width:16px; height:16px; }
  .day-sum-item-label{ font-size:10.5px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
  .day-sum-item-val{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13.5px; margin-top:1px; }
  .day-sum-foot{ display:flex; gap:8px; margin-top:12px; }
  .day-sum-foot .btn{ flex:1; }

  /* ---------- vücut ölçüleri & fotoğraf ---------- */
  .measure-chip-row{ display:flex; gap:8px; overflow-x:auto; margin-top:12px; padding-bottom:2px; }
  .measure-chip{ flex:none; min-width:84px; background:var(--surface-3); border:1px solid var(--border); border-radius:13px; padding:9px 11px; }

  .measure-photo-grid .del-btn svg{ width:14px; height:14px; }

  .steps-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; box-shadow:var(--shadow); margin-bottom:14px; }

  .streak-badge svg{ width:11px; height:11px; }

  .level-card{ position:relative; overflow:hidden; background:linear-gradient(160deg, var(--surface-2), var(--surface) 130%); border:1px solid var(--border); border-radius:20px; padding:17px; box-shadow:var(--shadow); margin-top:12px; }
  .level-card::before{ content:''; position:absolute; top:-46px; right:-46px; width:150px; height:150px; border-radius:50%; background:radial-gradient(circle, var(--cal-soft), transparent 72%); pointer-events:none; }

  .level-xp-track{ height:8px; border-radius:99px; background:var(--surface-2); margin-top:14px; overflow:hidden; position:relative; }
  .level-xp-fill{ height:100%; border-radius:99px; background:linear-gradient(90deg, var(--cal), var(--fat)); }

  .level-stat-mid{ flex:1; min-width:0; }
  .level-stat-name{ font-size:10px; font-weight:700; letter-spacing:.05em; color:var(--text-faint); margin-bottom:4px; }

  .level-stat-fill{ height:100%; border-radius:99px; background:linear-gradient(90deg, var(--accent), var(--accent2)); }

<script id="app-logic">
(function(){
  'use strict';

  var LOCAL_KEY = 'spor-defteri-state-v1';
  var THEME_KEY = 'spor-defteri-theme-v1';
  function loadTheme(){
    try {
      var t = localStorage.getItem(THEME_KEY);
      if (t === 'light' || t === 'dark' || t === 'system') return t;
    } catch(e){}
    return 'system';
  }
  function applyTheme(t){
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }
  var currentTheme = loadTheme();
  applyTheme(currentTheme);
  var WEEKDAYS_SHORT = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
  var WEEKDAYS_FULL = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
  var MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

  var WORKOUT_TYPES = [
    {key:'push', label:'Push', short:'Push', colorVar:'--push', softVar:'--push-soft'},
    {key:'pull', label:'Pull', short:'Pull', colorVar:'--pull', softVar:'--pull-soft'},
    {key:'legs', label:'Bacak', short:'Bacak', colorVar:'--legs', softVar:'--legs-soft'},
    {key:'upper', label:'Üst Vücut', short:'Üst V.', colorVar:'--upper', softVar:'--upper-soft'},
    {key:'rest', label:'Dinlenme', short:'Dinlenme', colorVar:'--rest', softVar:'--rest-soft'}
  ];
  function typeInfo(key){ return WORKOUT_TYPES.filter(function(t){return t.key===key;})[0] || WORKOUT_TYPES[4]; }
  var PLAN_TYPES = ['push','pull','legs','upper'];

  var CARDIO_TYPES = [
    {key:'yurus', label:'Yürüyüş', met:3.5},
    {key:'kosu', label:'Koşu', met:8},
    {key:'bisiklet', label:'Bisiklet', met:6},
    {key:'yuzme', label:'Yüzme', met:7},
    {key:'ip', label:'İp Atlama', met:10},
    {key:'diger', label:'Diğer', met:5}
  ];
  function cardioTypeInfo(key){ return CARDIO_TYPES.filter(function(t){return t.key===key;})[0] || CARDIO_TYPES[0]; }
  function cardioCalories(type, durationMin, distanceKm){
    var w = (latestWeight() && latestWeight().kg) || 75;
    var met = cardioTypeInfo(type).met;
    var base = met * w * (num(durationMin)/60) * 0.0175;
    return Math.round(base);
  }
  function stepsCalories(steps){
    var w = (latestWeight() && latestWeight().kg) || 75;
    return Math.round(num(steps) * w * 0.0005);
  }

  /* ---------- Sağlık uygulaması içe aktarma (iOS Kısayollar / Android otomasyon linki) ----------
     Örnek: index.html?adim=8412&kardiyoTip=kosu&kardiyoDk=32&kardiyoKm=5.1&kardiyoKcal=310&kardiyoId=2026-09-27T07:15
     "adim" ve "kardiyoTip+kardiyoDk" birbirinden bağımsız, ikisi de opsiyonel. */
  var healthImportApplied = false;
  var HEALTH_CARDIO_TYPE_MAP = { yurus:'yurus', walking:'yurus', kosu:'kosu', running:'kosu', bisiklet:'bisiklet', cycling:'bisiklet', yuzme:'yuzme', swimming:'yuzme', ip:'ip', jumprope:'ip', diger:'diger', other:'diger' };
  function mapHealthCardioType(raw){
    var k = (raw||'').toLowerCase();
    return HEALTH_CARDIO_TYPE_MAP[k] || 'diger';
  }
  function applyHealthImportFromUrl(){
    var params;
    try { params = new URLSearchParams(location.search); } catch(e){ return; }
    var stepsParam = params.get('adim');
    var cTip = params.get('kardiyoTip'), cDk = params.get('kardiyoDk'), cKm = params.get('kardiyoKm'), cKcal = params.get('kardiyoKcal'), cId = params.get('kardiyoId');
    if (!stepsParam && !(cTip && cDk)) return false;
    var key = todayKey();
    var d = dayOf(key);
    var changed = false;
    if (stepsParam !== null && stepsParam !== ''){
      var stepsNum = num(stepsParam, null);
      if (stepsNum !== null && isFinite(stepsNum) && stepsNum >= 0){ d.steps = Math.round(stepsNum); changed = true; }
    }
    if (cTip && cDk){
      var durationMin = num(cDk, 0);
      var alreadyImported = cId && d.cardio.some(function(c){ return c.importId === cId; });
      if (durationMin > 0 && !alreadyImported){
        var typeKey = mapHealthCardioType(cTip);
        var distanceKm = (cKm !== null && cKm !== '') ? num(cKm, null) : null;
        var calories = (cKcal !== null && cKcal !== '' && num(cKcal,0) > 0) ? Math.round(num(cKcal)) : cardioCalories(typeKey, durationMin, distanceKm);
        d.cardio.push({ id:newId(), type:typeKey, durationMin:durationMin, distanceKm:distanceKm, calories:calories, importId: cId || null });
        changed = true;
      }
    }
    if (changed){
      scheduleSave();
      ui.tab = 'cardio'; ui.period = 'day'; ui.dayDetailKind = 'cardio'; ui.dayDetailKey = key;
      saveUiState();
    }
    try { history.replaceState(null, '', location.pathname + location.hash); } catch(e2){}
    return changed;
  }

  /* ---------- Sağlık içe aktarmayı doğrudan hedef hesaba yazma ----------
     iOS, ana ekrana eklenen bir PWA ile normal Safari sekmesi için bazen AYRI bir depolama/anonim
     oturum kullanır — bu yüzden yukarıdaki applyHealthImportFromUrl() (hangi tarayıcı oturumu
     açıksa onu kullanır) Kısayol Safari'de açıldığında ama uygulama ana ekrandan kullanıldığında
     veriyi YANLIŞ (boş) bir hesaba yazabilir. Bunu kesin çözmek için: URL'e adım/kardiyo
     parametrelerinin yanında hesap (uid) ve anahtar (refresh token) eklenirse (Ayarlar > Kısayol
     (Otomasyon) Bağlantısı'ndan kopyalanır), bu değerler mevcut tarayıcı oturumundan TAMAMEN
     bağımsız olarak, Firestore REST API üzerinden doğrudan doğru hesaba yazılır. */
  function fsEncodeVal(v){
    if (v === null || v === undefined) return { nullValue: null };
    if (typeof v === 'number') return (isFinite(v) && Math.floor(v) === v) ? { integerValue: String(v) } : { doubleValue: v };
    if (typeof v === 'boolean') return { booleanValue: v };
    if (typeof v === 'string') return { stringValue: v };
    if (Array.isArray(v)) return { arrayValue: { values: v.map(fsEncodeVal) } };
    var fields = {};
    Object.keys(v).forEach(function(k){ fields[k] = fsEncodeVal(v[k]); });
    return { mapValue: { fields: fields } };
  }
  function fsDecodeVal(v){
    if (!v) return null;
    if ('integerValue' in v) return Number(v.integerValue);
    if ('doubleValue' in v) return v.doubleValue;
    if ('stringValue' in v) return v.stringValue;
    if ('booleanValue' in v) return v.booleanValue;
    if ('nullValue' in v) return null;
    if (v.arrayValue) return (v.arrayValue.values || []).map(fsDecodeVal);
    if (v.mapValue){
      var out = {};
      var f = v.mapValue.fields || {};
      Object.keys(f).forEach(function(k){ out[k] = fsDecodeVal(f[k]); });
      return out;
    }
    return null;
  }
  function fsPathSeg(seg){
    return /^[A-Za-z_][A-Za-z0-9_]*$/.test(seg) ? seg : ('`' + String(seg).replace(/`/g,'\\`') + '`');
  }

  function detectAccountHealthImportParams(){
    var params;
    try { params = new URLSearchParams(location.search); } catch(e){ return null; }
    var acctUid = params.get('hesap'), acctToken = params.get('anahtar');
    if (!acctUid || !acctToken) return null;
    var stepsParam = params.get('adim');
    var cTip = params.get('kardiyoTip'), cDk = params.get('kardiyoDk');
    if (!stepsParam && !(cTip && cDk)) return null;
    return {
      uid: acctUid, token: acctToken, adim: stepsParam,
      kardiyoTip: cTip, kardiyoDk: cDk,
      kardiyoKm: params.get('kardiyoKm'), kardiyoKcal: params.get('kardiyoKcal'), kardiyoId: params.get('kardiyoId')
    };
  }

  function renderAccountImportStatus(st, detail){
    var root = document.getElementById('root');
    if (!root) return;
    var iconName = st==='ok' ? 'check' : st==='err' ? 'close' : 'timer';
    var title = st==='ok' ? 'Kaydedildi' : st==='err' ? 'Kaydedilemedi' : 'Kaydediliyor…';
    var bg = st==='ok' ? 'var(--protein-soft)' : st==='err' ? 'var(--push-soft)' : 'var(--accent-soft)';
    var fg = st==='ok' ? 'var(--protein)' : st==='err' ? 'var(--push)' : 'var(--accent)';
    root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:var(--bg);color:var(--text)">' +
      '<div style="width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:' + bg + ';color:' + fg + '">' + icon(iconName) + '</div>' +
      '<div style="font-family:\'Sora\',sans-serif;font-weight:800;font-size:18px">' + esc(title) + '</div>' +
      (detail ? '<div style="font-size:13px;color:var(--text-faint);max-width:280px">' + esc(detail) + '</div>' : '') +
      '<div style="font-size:11px;color:var(--text-faint);margin-top:6px">Spor Defteri</div>' +
    '</div>';
  }

  async function runAccountHealthImport(p){
    renderAccountImportStatus('busy', '');
    try {
      var apiKey = (window.firebaseConfig && window.firebaseConfig.apiKey) || '';
      var projectId = (window.firebaseConfig && window.firebaseConfig.projectId) || '';
      if (!apiKey || !projectId) throw new Error('Firebase yapılandırması eksik.');

      var tokRes = await fetch('https://securetoken.googleapis.com/v1/token?key=' + encodeURIComponent(apiKey), {
        method:'POST',
        headers:{ 'content-type':'application/x-www-form-urlencoded' },
        body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(p.token)
      });
      if (!tokRes.ok) throw new Error('Oturum anahtarı geçersiz veya süresi dolmuş.');
      var tokData = await tokRes.json();
      var idToken = tokData.id_token, realUid = tokData.user_id;
      if (!idToken || !realUid || realUid !== p.uid) throw new Error('Hesap doğrulanamadı.');

      var key = todayKey();
      var seg = fsPathSeg(key);
      var docUrl = 'https://firestore.googleapis.com/v1/projects/' + encodeURIComponent(projectId) + '/databases/(default)/documents/sporDefteri/' + encodeURIComponent(realUid);

      var fieldPaths = [];
      var dayFields = {};
      var summaryParts = [];

      if (p.adim !== null && p.adim !== ''){
        var stepsNum = num(p.adim, null);
        if (stepsNum !== null && isFinite(stepsNum) && stepsNum >= 0){
          dayFields.steps = Math.round(stepsNum);
          fieldPaths.push('days.' + seg + '.steps');
          summaryParts.push(dayFields.steps.toLocaleString('tr-TR') + ' adım');
        }
      }

      if (p.kardiyoTip && p.kardiyoDk){
        var durationMin = num(p.kardiyoDk, 0);
        if (durationMin > 0){
          var getRes = await fetch(docUrl + '?mask.fieldPaths=' + encodeURIComponent('days.' + seg + '.cardio'), {
            headers:{ 'Authorization':'Bearer ' + idToken }
          });
          var existingCardio = [];
          if (getRes.ok){
            var getData = await getRes.json();
            var daysVal = getData.fields && getData.fields.days;
            var dayVal = daysVal && daysVal.mapValue && daysVal.mapValue.fields && daysVal.mapValue.fields[key];
            var cardioVal = dayVal && dayVal.mapValue && dayVal.mapValue.fields && dayVal.mapValue.fields.cardio;
            existingCardio = cardioVal ? (fsDecodeVal(cardioVal) || []) : [];
          } else if (getRes.status !== 404){
            throw new Error('Mevcut kardiyo verisi okunamadı.');
          }
          var alreadyImported = p.kardiyoId && existingCardio.some(function(c){ return c.importId === p.kardiyoId; });
          if (!alreadyImported){
            var typeKey = mapHealthCardioType(p.kardiyoTip);
            var distanceKm = (p.kardiyoKm !== null && p.kardiyoKm !== '') ? num(p.kardiyoKm, null) : null;
            var calories = (p.kardiyoKcal !== null && p.kardiyoKcal !== '' && num(p.kardiyoKcal,0) > 0) ? Math.round(num(p.kardiyoKcal)) : cardioCalories(typeKey, durationMin, distanceKm);
            existingCardio.push({ id:newId(), type:typeKey, durationMin:durationMin, distanceKm:distanceKm, calories:calories, importId: p.kardiyoId || null });
            dayFields.cardio = existingCardio;
            fieldPaths.push('days.' + seg + '.cardio');
            summaryParts.push(durationMin + ' dk kardiyo');
          }
        }
      }

      if (!fieldPaths.length){
        renderAccountImportStatus('ok', 'Zaten güncel, eklenecek yeni bir şey yok.');
      } else {
        var body = { fields: { days: { mapValue: { fields: {} } } } };
        body.fields.days.mapValue.fields[key] = { mapValue: { fields: {} } };
        Object.keys(dayFields).forEach(function(k){
          body.fields.days.mapValue.fields[key].mapValue.fields[k] = fsEncodeVal(dayFields[k]);
        });
        var maskQuery = fieldPaths.map(function(fp){ return 'updateMask.fieldPaths=' + encodeURIComponent(fp); }).join('&');
        var patchRes = await fetch(docUrl + '?' + maskQuery, {

    PLAN_TYPES.forEach(function(t){ if (!Array.isArray(out.exercisePlans[t])) out.exercisePlans[t] = []; });
    var days = s.days || {};
    Object.keys(days).forEach(function(k){
      var day = days[k] || {};

        workoutType: (typeof day.workoutType === 'string') ? day.workoutType : null,

        durationMin: day.durationMin || null,

        water: (typeof day.water === 'number' && day.water > 0) ? day.water : 0,

           alanıydı (day.note) — notes dizisi yoksa o eski metni tek maddelik bir listeye taşıyoruz,
           böylece önceden girilmiş notlar kaybolmuyor. */
        notes: Array.isArray(day.notes) ? day.notes.map(function(it){

        }).filter(function(it){ return it.text; }) : (

  function aiResolveDateKey(d){
    if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
    return keyForDate(new Date());
  }

  function executeAiTool(name, input){
    input = input || {};
    try {
      if (name === 'set_workout_type'){
        var swKey = aiResolveDateKey(input.date);
        dayOf(swKey).workoutType = input.type;
        scheduleSave(); renderAll();
        return { ok:true, message: swKey + ' günü ' + input.type + ' olarak ayarlandı.' };
      }
      if (name === 'add_exercise_set'){
        var aeKey = aiResolveDateKey(input.date);
        var day = dayOf(aeKey);
        var exName = String(input.exerciseName||'').trim();
        var ex = day.exercises.filter(function(e){ return e.name.toLowerCase() === exName.toLowerCase(); })[0];
        if (!ex){ ex = { id:newId(), name:exName, sets:[] }; day.exercises.push(ex); }
        var w = (input.weight===undefined || input.weight===null || input.weight==='') ? null : Number(input.weight);
        ex.sets.push({ reps:Number(input.reps)||0, weight:w });
        scheduleSave(); renderAll();
        return { ok:true, message: aeKey + ' gününe ' + exName + ': ' + (Number(input.reps)||0) + ' tekrar' + (w?(' x ' + w + 'kg'):'') + ' eklendi.' };
      }
      if (name === 'add_nutrition_entry'){
        var anKey = aiResolveDateKey(input.date);
        dayOf(anKey).nutrition.push({ id:newId(), name:input.name, calories:Number(input.calories)||0, protein:Number(input.protein)||0, fat:Number(input.fat)||0, carb:Number(input.carb)||0 });
        scheduleSave(); renderAll();
        return { ok:true, message: anKey + ' gününe "' + input.name + '" eklendi.' };
      }
      if (name === 'add_cardio_entry'){
        var acKey = aiResolveDateKey(input.date);
        var acDist = (input.distanceKm===undefined || input.distanceKm===null || input.distanceKm==='') ? null : Number(input.distanceKm);
        var acCal = (input.calories===undefined || input.calories===null || input.calories==='') ? null : Number(input.calories);
        dayOf(acKey).cardio.push({ id:newId(), type:input.type, durationMin:Number(input.durationMin)||0, distanceKm:acDist, calories:acCal });
        scheduleSave(); renderAll();
        return { ok:true, message: acKey + ' gününe ' + input.type + ' (' + (Number(input.durationMin)||0) + ' dk) eklendi.' };
      }
      if (name === 'log_weight'){
        var lwKey = aiResolveDateKey(input.date);
        state.weightLog.push({ id:newId(), date:lwKey, kg:Number(input.kg) });
        scheduleSave(); renderAll();
        return { ok:true, message: lwKey + ' için ' + input.kg + ' kg kaydedildi.' };
      }
      if (name === 'set_steps'){
        var ssKey = aiResolveDateKey(input.date);
        dayOf(ssKey).steps = (isFinite(Number(input.steps)) && Number(input.steps) > 0) ? Math.round(Number(input.steps)) : null;
        scheduleSave(); renderAll();
        return { ok:true, message: ssKey + ' günü için ' + input.steps + ' adım kaydedildi.' };
      }
      if (name === 'log_measurement'){
        var lmKey = aiResolveDateKey(input.date);
        var lmSite = String(input.site||'').trim();
        var lmVal = Number(input.valueCm);
        if (!lmSite || !isFinite(lmVal) || lmVal <= 0) return { ok:false, message:'Geçersiz bölge veya değer.' };
        state.measurements.push({ id:newId(), date:lmKey, site:lmSite, valueCm:lmVal });
        scheduleSave(); renderAll();
        return { ok:true, message: lmKey + ' için ' + lmSite + ' ölçüsü ' + lmVal + ' cm olarak kaydedildi.' };
      }
      if (name === 'add_agenda_item'){
        var aaKey = aiResolveDateKey(input.date);
        var aaText = String(input.text||'').trim();
        if (!aaText) return { ok:false, message:'Madde metni gerekli.' };
        dayOf(aaKey).agenda.push({ id:newId(), time: input.time || null, text: aaText, done:false });
        scheduleSave(); renderAll();
        return { ok:true, message: aaKey + ' ajandasına "' + aaText + '" eklendi.' };
      }
      if (name === 'add_note_item'){
        var snKey = aiResolveDateKey(input.date);
        var snText = String(input.text||'').trim();
        if (!snText) return { ok:false, message:'Not metni gerekli.' };
        dayOf(snKey).notes.push({ id:newId(), text:snText });
        scheduleSave(); renderAll();
        return { ok:true, message: snKey + ' gününe not eklendi: "' + snText + '"' };
      }
      return { ok:false, message:'Bilinmeyen işlem: ' + name };
    } catch(errTool){
      return { ok:false, message:'Hata oluştu: ' + (errTool && errTool.message ? errTool.message : 'bilinmeyen') };
    }
  }

  async function runAiTurn(conversation){
    for (var i = 0; i < 6; i++){
      var res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{
          'content-type':'application/json',
          'x-api-key': window.anthropicApiKey,
          'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true'
        },
        body: JSON.stringify({
          model: AI_MODEL,
          max_tokens: 1024,
          system: buildAiSystemPrompt(),
          tools: AI_TOOLS,
          messages: conversation
        })
      });
      if (!res.ok){
        var status = res.status;
        throw new Error('API hatası (' + status + ')');
      }
      var data = await res.json();
      var content = data.content || [];
      conversation.push({ role:'assistant', content: content });

      var toolUses = content.filter(function(c){ return c.type === 'tool_use'; });
      if (!toolUses.length){
        var textParts = content.filter(function(c){ return c.type === 'text'; }).map(function(c){ return c.text; });
        return textParts.join('\n');
      }
      var toolResults = toolUses.map(function(tu){
        var result = executeAiTool(tu.name, tu.input);
        return { type:'tool_result', tool_use_id: tu.id, content: JSON.stringify(result) };
      });
      conversation.push({ role:'user', content: toolResults });
    }
    return 'İşlemi tamamlayamadım, çok fazla adım gerekti.';
  }

  async function sendAiMessage(userText){
    if (!userText || !userText.trim()) return;
    if (!window.anthropicApiKey){
      appendAiMessage('user', userText);
      appendAiMessage('bot', 'Yapay zeka henüz kurulmamış — ai-config.js dosyasına bir Anthropic API anahtarı eklenmesi gerekiyor.', true);
      renderAll();
      return;
    }
    appendAiMessage('user', userText);
    aiBusy = true;
    renderAll();
    try {
      var finalText = await runAiTurn([{ role:'user', content:userText }]);
      appendAiMessage('bot', finalText || '(cevap alınamadı)');
    } catch(errAi){
      appendAiMessage('bot', 'Bir hata oldu: ' + (errAi && errAi.message ? errAi.message : 'bilinmeyen hata'), true);
    }
    aiBusy = false;
    renderAll();
  }

  function resizeImageFileToDataUrl(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var tw = Math.max(1, Math.round(w * scale)), th = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement('canvas');
          canvas.width = tw; canvas.height = th;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, tw, th);
          try { resolve(canvas.toDataURL('image/jpeg', quality)); }
          catch(errCanvas){ reject(errCanvas); }
        };
        img.onerror = function(){ reject(new Error('görsel okunamadı')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('dosya okunamadı')); };
      reader.readAsDataURL(file);
    });
  }

  /* ---------- hafta gruplama ---------- */
  function getMonthWeeks(year, month){
    var first = new Date(year, month, 1);
    var last = new Date(year, month, daysInMonth(year, month));
    var weeks = [];
    var cur = new Date(first);
    while (cur <= last){
      var dow = cur.getDay();
      var mondayOffset = (dow===0) ? 6 : dow-1;
      var weekStart = new Date(cur); weekStart.setDate(cur.getDate()-mondayOffset);
      var weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
      var boundStart = weekStart < first ? first : weekStart;
      var boundEnd = weekEnd > last ? last : weekEnd;
      var days = [];
      var d2 = new Date(boundStart);
      while (d2 <= boundEnd){ days.push(new Date(d2)); d2.setDate(d2.getDate()+1); }
      weeks.push({ weekStart:weekStart, weekEnd:weekEnd, days:days });
      cur = new Date(boundEnd); cur.setDate(cur.getDate()+1);
    }
    return weeks;
  }

  function dayWorkoutSummary(dateObj){

    var setCount = 0, volume = 0, exCount = 0;

    }

  }
  function monthWorkoutBreakdown(year, month){
    var days = allDaysInMonth(year, month);
    var byType = {};
    WORKOUT_TYPES.forEach(function(t){ byType[t.key] = { planned:0, done:0, volume:0 }; });
    days.forEach(function(d){
      var s = dayWorkoutSummary(d);
      byType[s.type].planned++;
      if (s.done){ byType[s.type].done++; byType[s.type].volume += s.volume; }
    });
    return byType;
  }

  /* ---------- hareket geçmişi ---------- */
  function exerciseHistory(name, excludeKey){
    var nameLc = name.toLowerCase();
    var out = [];
    Object.keys(state.days).forEach(function(key){
      if (key === excludeKey) return;
      var d = state.days[key];
      (d.exercises||[]).forEach(function(ex){
        if (ex.name.toLowerCase() === nameLc && ex.sets && ex.sets.length){
          out.push({ key:key, dateObj:parseKey(key), sets:ex.sets });
        }
      });
    });
    out.sort(function(a,b){ return a.key < b.key ? 1 : (a.key > b.key ? -1 : 0); });
    return out;
  }
  function lastPerformance(name, excludeKey){
    var hist = exerciseHistory(name, excludeKey);
    if (!hist.length) return null;
    var sets = hist[0].sets;
    return sets[sets.length - 1];
  }
  function bestSetOf(sets){
    return (sets||[]).reduce(function(best, s){
      var w = num(s.weight);
      return (!best || w > best.weight) ? { weight:w, reps:s.reps } : best;
    }, null);
  }
  function previousSessionBest(name, excludeKey){
    var hist = exerciseHistory(name, excludeKey);
    if (!hist.length) return null;
    var best = bestSetOf(hist[0].sets);
    if (!best) return null;
    return { weight:best.weight, reps:best.reps, dateObj:hist[0].dateObj };
  }
  function sessionVolume(sets){
    return (sets||[]).reduce(function(v,s){ return v + num(s.reps)*num(s.weight); }, 0);
  }
  function previousSessionVolume(name, excludeKey){
    var hist = exerciseHistory(name, excludeKey);
    if (!hist.length) return null;
    return sessionVolume(hist[0].sets);
  }
  function suggestedTarget(name, excludeKey){
    var hist = exerciseHistory(name, excludeKey);
    if (!hist.length) return null;
    var best = bestSetOf(hist[0].sets);
    if (!best) return null;
    return { weight: best.weight, reps: num(best.reps) + 1 };
  }
  function volumeDeltaBadge(currentVol, previousVol){
    if (previousVol === null || previousVol === undefined || !isFinite(previousVol) || previousVol <= 0) return '';
    var delta = round(currentVol - previousVol);
    var color = delta > 0 ? '--good' : (delta < 0 ? '--bad' : '--text-faint');
    var arrow = delta > 0 ? '▲' : (delta < 0 ? '▼' : '=');
    var txt = delta === 0 ? 'aynı' : (delta > 0 ? '+' : '') + delta + ' kg';
    return '<span style="color:var(' + color + ');font-weight:700;font-size:11px;margin-left:6px">' + arrow + ' ' + txt + '</span>';
  }
  function weeklyPrCount(days){
    var count = 0;
    days.forEach(function(d){
      var key = keyForDate(d);
      var day = state.days[key];
      if (!day) return;
      (day.exercises||[]).forEach(function(ex){
        if (!ex.sets || !ex.sets.length) return;
        var maxW = ex.sets.reduce(function(mx,s){ return Math.max(mx, num(s.weight)); }, 0);
        var prev = previousSessionBest(ex.name, key);
        if (prev && maxW > prev.weight) count++;
      });
    });
    return count;
  }
  function weightDeltaBadge(currentWeight, previousWeight){
    if (previousWeight === null || previousWeight === undefined || !isFinite(previousWeight)) return '';
    var delta = round10(currentWeight - previousWeight);
    var color = delta > 0 ? '--good' : (delta < 0 ? '--bad' : '--text-faint');
    var arrow = delta > 0 ? '▲' : (delta < 0 ? '▼' : '=');
    var txt = delta === 0 ? 'aynı' : (delta > 0 ? '+' : '') + delta + ' kg';
    return '<span style="color:var(' + color + ');font-weight:700;font-size:11px;margin-left:6px">' + arrow + ' ' + txt + '</span>';
  }
  function exerciseNamesForDays(dateArr){

  /* ---------- seviye / xp (gamification) ---------- */
  function isDayActive(key){
    var d = state.days[key];
    if (!d) return false;
    return (d.nutrition && d.nutrition.length > 0) ||
      (d.exercises && d.exercises.some(function(ex){ return (ex.sets||[]).length > 0; })) ||
      (d.cardio && d.cardio.length > 0) ||
      !!d.steps;
  }
  function currentStreak(){
    var cur = new Date();
    if (!isDayActive(keyForDate(cur))) cur.setDate(cur.getDate()-1);
    var streak = 0;
    for (var i=0;i<365;i++){
      if (isDayActive(keyForDate(cur))){ streak++; cur.setDate(cur.getDate()-1); }
      else break;
    }
    return streak;
  }
  function computeGamification(){
    var keys = Object.keys(state.days);
    var workoutDaysAll = 0, nutritionDaysAll = 0, cardioDaysAll = 0, totalSets = 0;
    keys.forEach(function(k){
      var d = state.days[k];
      if (!d) return;
      var hasWorkout = (d.exercises||[]).some(function(ex){ return (ex.sets||[]).length > 0; });
      if (hasWorkout) workoutDaysAll++;
      (d.exercises||[]).forEach(function(ex){ totalSets += (ex.sets||[]).length; });
      if ((d.nutrition||[]).length > 0) nutritionDaysAll++;
      if ((d.cardio||[]).length > 0 || d.steps) cardioDaysAll++;
    });
    var streak = currentStreak();
    var xp = workoutDaysAll*20 + totalSets*2 + nutritionDaysAll*8 + cardioDaysAll*10 + streak*5;
    var xpPerLevel = 300;
    var level = Math.floor(xp/xpPerLevel) + 1;
    var xpInLevel = xp % xpPerLevel;
    var xpPct = Math.round((xpInLevel/xpPerLevel)*100);
    function clampStat(v){ return Math.max(1, Math.min(99, Math.round(v))); }
    var guc = clampStat((totalSets/60)*99);
    var sureklilik = clampStat((streak/14)*99);
    var dayaniklilik = clampStat((cardioDaysAll/20)*99);
    var disiplin = clampStat((nutritionDaysAll/25)*99);
    var odak = clampStat((guc+sureklilik+dayaniklilik+disiplin)/4);
    return {
      xp: xp, level: level, xpInLevel: xpInLevel, xpPerLevel: xpPerLevel, xpPct: xpPct, streak: streak,
      stats: [
        {key:'guc', label:'Güç', val:guc, icon:'dumbbell'},
        {key:'sureklilik', label:'Süreklilik', val:sureklilik, icon:'flame'},
        {key:'dayaniklilik', label:'Dayanıklılık', val:dayaniklilik, icon:'pulse'},
        {key:'disiplin', label:'Disiplin', val:disiplin, icon:'food'},
        {key:'odak', label:'Odak', val:odak, icon:'footprints'}
      ]
    };
  }
  function renderLevelCard(){
    var g = computeGamification();
    return '<div class="level-card">' +

  function renderHomeContent(){
    var today = new Date();
    var hour = today.getHours();
    var greeting = hour < 6 ? 'İyi geceler' : hour < 12 ? 'Günaydın' : hour < 18 ? 'İyi günler' : 'İyi akşamlar';
    var dateLabel = WEEKDAYS_FULL[today.getDay()] + ', ' + today.getDate() + ' ' + MONTHS[today.getMonth()];
    var s = state.settings;
    var tKey = todayKey();

    var gami = computeGamification();
    var streakBadge = gami.streak > 0 ? ('<span class="streak-badge on-hero">' + icon('flame') + gami.streak + ' gün seri</span>') : '';

    var hp = ui.homePeriod;
    var hpLabel = hp==='day' ? 'Bugün' : hp==='week' ? 'Bu Hafta' : 'Bu Ay';
    var scopeDays = hp==='day' ? [today] : hp==='week' ? currentWeekDays() : allDaysInMonth(today.getFullYear(), today.getMonth());
    var scopeNut = sumNutritionForDays(scopeDays);
    var scopeGoalCal = s.goalCalories * scopeDays.length;
    var scopeCalPct = scopeGoalCal>0 ? (scopeNut.cal/scopeGoalCal)*100 : 0;
    var scopeCardio = sumCardioForDays(scopeDays);
    var scopeCardioGoal = hp==='day' ? (Math.round(s.cardioGoalMinPerWeek/7) || 1) : hp==='week' ? (s.cardioGoalMinPerWeek||1) : Math.round(s.cardioGoalMinPerWeek * (scopeDays.length/7)) || 1;
    var scopeCardioPct = (scopeCardio.durationMin/scopeCardioGoal)*100;
    var scopeSteps = sumStepsForDays(scopeDays);
    var scopeStepsGoal = (s.stepsGoalPerDay||8000) * scopeDays.length;
    var scopeStepsPct = scopeStepsGoal>0 ? (scopeSteps.steps/scopeStepsGoal)*100 : 0;
    var scopeBurned = scopeCardio.calories + scopeSteps.calories;

    var wS = dayWorkoutSummary(today);
    var wTi = typeInfo(wS.type);
    var workoutPct, scopeWorkoutDone, scopeWorkoutGoal;
    if (hp === 'day'){
      workoutPct = wS.type==='rest' ? null : (wS.done?100:0);
    } else {
      scopeWorkoutDone = 0; scopeDays.forEach(function(d){ if (dayWorkoutSummary(d).done) scopeWorkoutDone++; });
      scopeWorkoutGoal = hp==='week' ? (s.workoutGoalPerWeek||1) : Math.round((s.workoutGoalPerWeek||1) * (scopeDays.length/7)) || 1;
      workoutPct = (scopeWorkoutDone/scopeWorkoutGoal)*100;
    }

    /* genel ilerleme halkası: beslenme/antrenman/kardiyo/adım yüzdelerinin ortalaması */
    var ringParts = [scopeCalPct, workoutPct, scopeCardioPct, scopeStepsPct].filter(function(v){ return v!==null && v!==undefined && isFinite(v); });
    var ringPct = ringParts.length ? Math.max(0, Math.min(100, ringParts.reduce(function(a,b){ return a + Math.max(0,Math.min(100,b)); }, 0) / ringParts.length)) : 0;
    var ringR = 26, ringC = 2*Math.PI*ringR;
    var heroMsg;
    if (ringPct <= 0) heroMsg = hp==='day' ? 'Güne başlamaya hazır mısın?' : hpLabel + ' için henüz kayıt yok, hadi başlayalım';
    else if (ringPct < 25) heroMsg = 'İyi başlangıç, devamını getir';
    else if (ringPct < 60) heroMsg = 'Gidişat iyi, böyle devam';
    else if (ringPct < 90) heroMsg = 'Harika gidiyorsun, hedefe yakınsın';
    else heroMsg = (hp==='day' ? 'Bugün harikasın! 🔥' : 'Bu ' + (hp==='week'?'hafta':'ay') + ' harikasın! 🔥');

    var html = '<div class="hero-card home-hero">' + heroWatermark('flame') +
      '<div class="home-hero-top">' +
        '<div><div class="home-hero-greet">' + greeting + streakBadge + '</div><div class="home-hero-date">' + dateLabel + '</div></div>' +
        '<div class="home-ring"><svg viewBox="0 0 58 58">' +
          '<circle class="ring-track" cx="29" cy="29" r="' + ringR + '"></circle>' +
          '<circle class="ring-fill" cx="29" cy="29" r="' + ringR + '" stroke-dasharray="' + ringC.toFixed(1) + '" stroke-dashoffset="' + (ringC * (1 - ringPct/100)).toFixed(1) + '"></circle>' +
        '</svg><div class="home-ring-val">%' + round(ringPct) + '</div></div>' +
      '</div>' +
      '<div class="home-hero-msg">' + icon('flame') + esc(heroMsg) + '</div>' +
    '</div>';

    html += renderDailyTasksCard();

    html += '<div class="section-title">Bu Hafta Özet</div>' + renderWeeklySummaryCard();

    html += '<div class="period-toggle" style="margin:10px 0 4px">' + [{key:'day',label:'Gün'},{key:'week',label:'Hafta'},{key:'month',label:'Ay'}].map(function(p){
      return '<button class="period-btn' + (hp===p.key?' is-active':'') + '" data-action="set-home-period" data-period="' + p.key + '">' + p.label + '</button>';
    }).join('') + '</div>';

    html += '<div class="section-title">' + hpLabel + '</div>';
    if (hp === 'day'){
      html += '<div class="home-tile-grid">' +
        homeTile('nutrition', 'food', 'Beslenme', scopeNut.cal.toLocaleString('tr-TR') + ' kcal', '%' + round(scopeCalPct) + ' hedef', scopeCalPct, '--cal', '--cal-soft') +
        homeTile('workout', 'dumbbell', 'Antrenman', wTi.label, wS.type==='rest' ? 'Dinlenme' : (wS.done ? 'Tamamlandı ✓' : 'Bekliyor'), workoutPct, wTi.colorVar, wTi.softVar) +
        homeTile('cardio', 'pulse', 'Kardiyo', scopeCardio.durationMin + ' dk', scopeCardio.count + ' kayıt', scopeCardioPct, '--accent', '--accent-soft') +
        homeTile('cardio', 'footprints', 'Adım', scopeSteps.steps.toLocaleString('tr-TR'), scopeSteps.steps>0 ? ('≈' + scopeSteps.calories + ' kcal') : 'Gir', scopeStepsPct, '--legs', '--legs-soft') +
      '</div>';
    } else {
      html += '<div class="home-tile-grid">' +
        homeTile('nutrition', 'food', 'Beslenme', scopeNut.cal.toLocaleString('tr-TR') + ' kcal', '%' + round(scopeCalPct) + ' hedef', scopeCalPct, '--cal', '--cal-soft') +
        homeTile('workout', 'dumbbell', 'Antrenman', scopeWorkoutDone + ' gün', scopeWorkoutDone + ' / ' + scopeWorkoutGoal + ' hedef', workoutPct, '--pull', '--pull-soft') +
        homeTile('cardio', 'pulse', 'Kardiyo', scopeCardio.durationMin + ' dk', scopeCardio.count + ' kayıt', scopeCardioPct, '--accent', '--accent-soft') +
        homeTile('cardio', 'footprints', 'Adım', scopeSteps.steps.toLocaleString('tr-TR'), scopeSteps.steps>0 ? ('≈' + scopeSteps.calories + ' kcal') : 'Gir', scopeStepsPct, '--legs', '--legs-soft') +
      '</div>';
    }

    var netCalTotal = scopeNut.cal + scopeBurned;
    var netCalInPct = netCalTotal > 0 ? (scopeNut.cal / netCalTotal) * 100 : 50;
    html += '<div class="net-cal-card">' +
      '<div class="net-cal-head"><span class="net-cal-icon">' + icon('flame') + '</span><div class="net-cal-label">' + hpLabel + ' Net Kalori</div></div>' +
      '<div class="net-cal-row">' +
        '<div class="net-cal-item"><div class="net-cal-item-label">Alınan</div><div class="net-cal-item-val" style="color:var(--cal)">' + round(scopeNut.cal).toLocaleString('tr-TR') + '</div></div>' +
        '<div class="net-cal-op">−</div>' +
        '<div class="net-cal-item"><div class="net-cal-item-label">Yakılan</div><div class="net-cal-item-val" style="color:var(--good)">' + round(scopeBurned).toLocaleString('tr-TR') + '</div></div>' +
        '<div class="net-cal-op">=</div>' +
        '<div class="net-cal-item"><div class="net-cal-item-label">Net</div><div class="net-cal-item-val">' + round(scopeNut.cal - scopeBurned).toLocaleString('tr-TR') + '</div></div>' +
      '</div>' +
      '<div class="net-cal-split"><div class="net-cal-split-in" style="width:' + netCalInPct + '%"></div><div class="net-cal-split-out" style="width:' + (100-netCalInPct) + '%"></div></div>' +
    '</div>';

    html += renderStepsCard();
    html += renderWaterCard();
    html += renderSleepCard();

    html += '<div class="section-title">Bu Hafta Genel Bakış</div>' + homeWeekStrip();

    html += '<div class="section-title">' + hpLabel + ' Detay</div>' + homeDetailSection(hp, scopeDays, scopeNut, scopeCardio, scopeSteps);

    html += renderWeightCard();
    html += renderMeasureCard();

    return html;
  }

  function dailyTaskRow(done, label, sub, action, extraAttrs){
    return '<div class="check-row' + (done?' is-checked':'') + '" data-action="' + action + '"' + (extraAttrs||'') + '>' +
      '<span class="check-circle">' + icon('check') + '</span>' +
      '<div class="check-row-main"><div class="check-row-name' + (done?' is-done-text':'') + '">' + esc(label) + '</div>' +
      (sub ? '<div class="check-row-sub">' + esc(sub) + '</div>' : '') + '</div>' +
    '</div>';
  }
  function renderDailyTasksCard(){
    var key = todayKey();
    var d = dayOf(key);
    var s = state.settings;
    var today = new Date();
    var wS = dayWorkoutSummary(today);
    var cardio = dayCardioTotals(key);
    var rows = '';
    var doneCount = 0, totalCount = 0;
    if (wS.type !== 'rest'){
      totalCount++; if (wS.done) doneCount++;
      rows += dailyTaskRow(wS.done, 'Antrenman: ' + typeInfo(wS.type).label, wS.done ? (wS.setCount + ' set tamamlandı') : 'Henüz başlanmadı', 'open-today-task', ' data-tab="workout"');
    }
    totalCount++; if (cardio.count > 0) doneCount++;
    rows += dailyTaskRow(cardio.count>0, 'Kardiyo', cardio.count>0 ? (cardio.durationMin + ' dk kaydedildi') : 'Henüz kayıt yok', 'open-today-task', ' data-tab="cardio"');
    totalCount++; if (d.steps) doneCount++;
    rows += dailyTaskRow(!!d.steps, 'Adım gir', d.steps ? (d.steps.toLocaleString('tr-TR') + ' adım') : 'Henüz girilmedi', 'scroll-to-section', ' data-target="home-steps-anchor"');
    var waterGoal = s.waterGoalMl||2500;
    var waterDone = (d.water||0) >= waterGoal;
    totalCount++; if (waterDone) doneCount++;
    rows += dailyTaskRow(waterDone, 'Su hedefi', (d.water||0) ? ((d.water||0).toLocaleString('tr-TR') + ' / ' + waterGoal.toLocaleString('tr-TR') + ' ml') : 'Henüz girilmedi', 'scroll-to-section', ' data-target="home-water-anchor"');
    totalCount++; if (d.sleepHours) doneCount++;
    rows += dailyTaskRow(!!d.sleepHours, 'Uyku gir', d.sleepHours ? (d.sleepHours + ' saat') : 'Dün gece kaç saat uyudun?', 'scroll-to-section', ' data-target="home-sleep-anchor"');
    (d.agenda||[]).forEach(function(it){
      totalCount++; if (it.done) doneCount++;
      rows += '<div class="check-row' + (it.done?' is-checked':'') + '" data-action="toggle-agenda-item" data-key="' + key + '" data-id="' + it.id + '">' +
        '<span class="check-circle">' + icon('check') + '</span>' +
        '<div class="check-row-main"><div class="check-row-name' + (it.done?' is-done-text':'') + '">' +
        (it.time ? '<span class="num" style="color:var(--text-faint);margin-right:7px">' + esc(it.time) + '</span>' : '') +
        esc(it.text) + '</div></div>' +
      '</div>';
    });
    var pct = totalCount ? Math.round((doneCount/totalCount)*100) : 0;
    return '<div class="section-title">Bugünün Görevleri</div>' +
      '<div class="daily-tasks-card">' +
        '<div class="daily-tasks-progress"><span class="daily-tasks-progress-label">' + doneCount + '/' + totalCount + '</span>' +
          '<div class="daily-tasks-progress-track"><div class="daily-tasks-progress-fill" style="width:' + pct + '%"></div></div>' +
          '<span class="daily-tasks-progress-label">%' + pct + '</span></div>' +
        '<div class="check-list">' + rows + '</div>' +
      '</div>';
  }
  function weekSummaryStat(iconName, val, label, colorVar){
    return '<div class="week-summary-stat"><div class="week-summary-stat-icon" style="color:var(' + colorVar + ')">' + icon(iconName) + '</div>' +
      '<div class="week-summary-stat-val">' + val + '</div><div class="week-summary-stat-label">' + label + '</div></div>';
  }
  function renderWeeklySummaryCard(){
    var s = state.settings;
    var week = currentWeekDays();
    var doneCount = 0;
    week.forEach(function(d){ if (dayWorkoutSummary(d).done) doneCount++; });
    var goal = s.workoutGoalPerWeek || 1;
    var routinePct = goal>0 ? Math.min(100, Math.round((doneCount/goal)*100)) : 0;
    var waterDays = 0, waterSum = 0, sleepDays = 0, sleepSum = 0;
    week.forEach(function(d){
      var day = state.days[keyForDate(d)];
      if (day && day.water){ waterSum += day.water; waterDays++; }
      if (day && day.sleepHours){ sleepSum += day.sleepHours; sleepDays++; }
    });
    var waterAvg = waterDays ? Math.round(waterSum/waterDays) : 0;
    var sleepAvg = sleepDays ? Math.round((sleepSum/sleepDays)*10)/10 : 0;
    var prCount = weeklyPrCount(week);
    return '<div class="week-summary-card">' +
        '<div class="week-summary-row">' +
          weekSummaryStat('dumbbell', doneCount + '/' + goal, 'Antrenman', '--pull') +
          weekSummaryStat('target', '%' + routinePct, 'Rutin Uyum', routinePct>=100?'--good':'--accent') +
          weekSummaryStat('trophy', String(prCount), 'Yeni Rekor', prCount>0?'--good':'--text-faint') +
        '</div>' +
        '<div class="week-summary-row">' +
          weekSummaryStat('droplet', waterDays ? (waterAvg.toLocaleString('tr-TR')+' ml') : '—', 'Ort. Su', '--carb') +
          weekSummaryStat('moon', sleepDays ? (sleepAvg+' sa') : '—', 'Ort. Uyku', '--sleep') +
        '</div>' +
      '</div>';
  }

          }).join('') +

      '</div>';

  function homeWeekStrip(){
    var week = currentWeekDays();
    var html = '<div class="week-strip">';
    week.forEach(function(d){
      var key = keyForDate(d);
      var isToday = key === todayKey();
      var isSelected = ui.homeSelectedDayKey === key;
      var wS = dayWorkoutSummary(d);
      var ti = typeInfo(wS.type);
      var dd = dayOf(key);
      var hasBurned = dayBurnedCalories(key) > 0;
      var hasNutrition = dayNutritionTotals(key).cal > 0;
      var hasSteps = !!dd.steps;
      var hasWater = (dd.water||0) > 0;
      html += '<button type="button" class="week-strip-cell' + (isToday?' is-today':'') + (isSelected?' is-selected':'') + '" data-action="open-week-day" data-key="' + key + '" style="background:var(' + ti.softVar + ');color:var(' + ti.colorVar + ')">' +
        '<span class="week-strip-wd">' + WEEKDAYS_SHORT[d.getDay()] + '</span>' +
        '<span class="week-strip-num">' + d.getDate() + '</span>' +
        '<span class="week-strip-dots">' +
          (wS.done ? ('<span class="week-strip-dot" style="background:var(' + ti.colorVar + ')"></span>') : '') +
          (hasNutrition ? '<span class="week-strip-dot" style="background:var(--cal)"></span>' : '') +
          (hasBurned ? '<span class="week-strip-dot" style="background:var(--accent)"></span>' : '') +
          (hasSteps ? '<span class="week-strip-dot" style="background:var(--legs)"></span>' : '') +
          (hasWater ? '<span class="week-strip-dot" style="background:var(--carb)"></span>' : '') +
        '</span>' +
      '</button>';
    });
    html += '</div>';
    if (ui.homeSelectedDayKey) html += renderHomeDaySummaryCard(ui.homeSelectedDayKey);
    return html;
  }

  function renderHomeDaySummaryCard(key){
    var dateObj = parseKey(key);
    var d = dayOf(key);
    var s = state.settings;
    var wS = dayWorkoutSummary(dateObj);
    var ti = typeInfo(wS.type);
    var nut = dayNutritionTotals(key);
    var cardio = dayCardioTotals(key);
    var isToday = key === todayKey();
