      var fp = photos[0], lp = photos[photos.length-1];
      var days = Math.round((parseKey(lp.date).getTime() - parseKey(fp.date).getTime()) / 86400000);
      html += '<div class="section-title">Fotoğraf Karşılaştırma</div>' +
        '<div class="measure-photo-compare">' + photoThumb(fp, 'İlk') + photoThumb(lp, 'Son') + '</div>' +
        '<div class="measure-photo-days">' + (days>0 ? (days + ' gün aradan sonra') : 'aynı gün') + '</div>';
    }

    html += '<div class="section-title">Ölçüm Geçmişi</div>';
    if (!measureHistory.length){
      html += '<div class="empty-state">Henüz ölçüm kaydı yok.</div>';
    } else {
      html += '<div class="list" style="padding:2px 14px">' + measureHistory.map(function(m){
        return '<div class="entry-row"><div class="entry-main"><div class="entry-name">' + measureSiteLabel(m.site) + ' — ' + m.valueCm + ' cm</div><div class="entry-sub">' + m.date + '</div></div>' +
          '<button class="del-btn" data-action="delete-measure-entry" data-id="' + m.id + '">' + icon('trash') + '</button></div>';
      }).join('') + '</div>';
    }

    html += '<div class="section-title">Fotoğraf Geçmişi</div>';
    if (!photosDesc.length){
      html += '<div class="empty-state">Henüz fotoğraf yok.</div>';
    } else {
      html += '<div class="measure-photo-grid">' + photosDesc.map(function(p){
        return '<div class="measure-photo-thumb"><img src="' + p.dataUrl + '" alt="">' +
          '<span class="measure-photo-tag">' + p.date + (p.note ? (' · ' + esc(p.note)) : '') + '</span>' +
          '<button class="del-btn" data-action="delete-measure-photo" data-id="' + p.id + '">' + icon('trash') + '</button>' +
        '</div>';
      }).join('') + '</div>';
    }

    html += '</div></div>';
    return html;
  }

  function renderTabbar(){
    return '<div class="tabbar">' +
      '<button class="tab-btn' + (ui.tab==='home'?' is-active':'') + '" data-action="set-tab" data-tab="home">' + icon('home') + '<span>Ana Sayfa</span></button>' +
      '<button class="tab-btn' + (ui.tab==='nutrition'?' is-active':'') + '" data-action="set-tab" data-tab="nutrition">' + icon('food') + '<span>Beslenme</span></button>' +
      '<button class="tab-btn' + (ui.tab==='workout'?' is-active':'') + '" data-action="set-tab" data-tab="workout">' + icon('dumbbell') + '<span>Antrenman</span></button>' +
      '<button class="tab-btn' + (ui.tab==='cardio'?' is-active':'') + '" data-action="set-tab" data-tab="cardio">' + icon('pulse') + '<span>Kardiyo</span></button>' +
    '</div>';
  }

  /* ---------- kaydetme (Firebase Firestore) ---------- */
  function initFirebase(){
    if (typeof firebase === 'undefined' || !window.firebaseConfig){
      saveMode = 'local'; renderHeaderStatus();
      return;
    }
    try {
      firebase.initializeApp(window.firebaseConfig);
      db = firebase.firestore();
      try { db.enablePersistence({ synchronizeTabs:true }).catch(function(){}); } catch(e0){}
    } catch(eInit){ saveMode = 'local'; renderHeaderStatus(); return; }

    firebase.auth().onAuthStateChanged(function(user){
      if (user){
        uid = user.uid;
        docRef = db.collection('sporDefteri').doc(uid);
        attachSnapshot();
      }
    });
    firebase.auth().signInAnonymously().catch(function(errAuth){
      saveMode = 'local'; renderHeaderStatus();
    });
  }
  function attachSnapshot(){
    docRef.onSnapshot(function(snap){
      if (!snap.exists){
        if (!firstSnapshotDone){
          firstSnapshotDone = true;
          if (!healthImportApplied){ healthImportApplied = true; applyHealthImportFromUrl(); }
          writeStateToFirestore(state);
        }
        return;
      }
      firstSnapshotDone = true;
      if (snap.metadata.hasPendingWrites) return;
      state = normalizeState(snap.data());
      if (!healthImportApplied){ healthImportApplied = true; applyHealthImportFromUrl(); }
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch(e){}
      saveMode = 'saved';
      renderAll();
    }, function(errSnap){
      saveMode = 'local'; renderHeaderStatus();
    });
  }
  function writeStateToFirestore(s){
    if (!docRef){ saveMode = 'local'; renderHeaderStatus(); return; }
    docRef.set(s).then(function(){
      saveMode = 'saved'; renderHeaderStatus();
    }).catch(function(errWrite){
      saveMode = 'local'; renderHeaderStatus();
    });
  }
  function scheduleSave(){
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch(e){}
    if (saveTimer) clearTimeout(saveTimer);
    saveMode = 'saving';
    renderHeaderStatus();
    saveTimer = setTimeout(doSave, 650);
  }
  function doSave(){
    writeStateToFirestore(state);
  }

  /* ---------- olaylar ---------- */
  document.getElementById('root').addEventListener('click', onRootClick);
  document.getElementById('root').addEventListener('keydown', function(e){
    if (e.target && e.target.id === 'ai-input' && e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      if (!aiBusy) sendAiMessage(e.target.value);
    }
  });

  function onRootClick(e){
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');

    if (action === 'set-tab'){ ui.tab = btn.getAttribute('data-tab'); ui.period = 'day'; renderAll(); return; }
    if (action === 'set-period'){ ui.period = btn.getAttribute('data-period'); renderAll(); return; }
    if (action === 'month-prev'){ ui.cursor = new Date(ui.cursor.getFullYear(), ui.cursor.getMonth()-1, 1); renderAll(); return; }
    if (action === 'month-next'){ ui.cursor = new Date(ui.cursor.getFullYear(), ui.cursor.getMonth()+1, 1); renderAll(); return; }
    if (action === 'open-day'){ ui.dayDetailKind = ui.tab; ui.dayDetailKey = btn.getAttribute('data-key'); renderAll(); return; }
    if (action === 'close-day'){ ui.dayDetailKey = null; ui.dayDetailKind = null; ui.manualAddOpen = { nutrition:false, workout:false }; renderAll(); return; }
    if (action === 'toggle-manual-add'){
      var maSection = btn.getAttribute('data-section');
      ui.manualAddOpen[maSection] = !ui.manualAddOpen[maSection];
      renderAll(); return;
    }
    if (action === 'select-week-region'){
      var wrRegion = btn.getAttribute('data-region');
      ui.selectedRegion = (ui.selectedRegion === wrRegion) ? null : wrRegion;
      renderAll(); return;
    }
    if (action === 'open-today-detail'){
      var odTab = btn.getAttribute('data-tab');
      ui.tab = odTab; ui.period = 'day'; ui.dayDetailKind = odTab; ui.dayDetailKey = todayKey();
      renderAll(); return;
    }
    if (action === 'open-home-tile'){
      var htTab = btn.getAttribute('data-tab');
      if (ui.homePeriod === 'day'){
        ui.tab = htTab; ui.period = 'day'; ui.dayDetailKind = htTab; ui.dayDetailKey = todayKey();
      } else {
        ui.tab = htTab; ui.period = ui.homePeriod;
      }
      renderAll(); return;
    }
    if (action === 'set-home-period'){ ui.homePeriod = btn.getAttribute('data-period'); renderAll(); return; }
    if (action === 'toggle-home-macro'){ ui.homeMacroExpanded = !ui.homeMacroExpanded; renderAll(); return; }
    if (action === 'toggle-home-workout'){ ui.homeWorkoutExpanded = !ui.homeWorkoutExpanded; renderAll(); return; }
    if (action === 'open-exercise-history'){ ui.exerciseHistoryName = btn.getAttribute('data-name'); renderAll(); return; }
    if (action === 'close-exercise-history'){ ui.exerciseHistoryName = null; renderAll(); return; }
    if (action === 'modal-noop'){ return; }
    if (action === 'ai-open'){ aiOpen = true; renderAll(); return; }
    if (action === 'ai-close'){ aiOpen = false; renderAll(); return; }
    if (action === 'ai-send'){
      if (aiBusy) return;
      var aiInputEl = document.getElementById('ai-input');
      var aiTextVal = aiInputEl ? aiInputEl.value : '';
      sendAiMessage(aiTextVal);
      return;
    }
    if (action === 'set-theme'){
      currentTheme = btn.getAttribute('data-theme');
      applyTheme(currentTheme);
      try { localStorage.setItem(THEME_KEY, currentTheme); } catch(e){}
      renderAll(); return;
    }
    if (action === 'copy-field'){
      var cfTgt = btn.getAttribute('data-target');
      var cfEl = document.getElementById(cfTgt);
      if (cfEl){
        var cfVal = cfEl.value;
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(cfVal).catch(function(){});
        } else {
          try { cfEl.select(); document.execCommand('copy'); } catch(eCopy){}
        }
        var cfOrig = btn.textContent;
        btn.textContent = 'Kopyalandı ✓';
        setTimeout(function(){ btn.textContent = cfOrig; }, 1200);
      }
      return;
    }
    if (action === 'open-settings'){ ui.settingsOpen = true; renderAll(); return; }
    if (action === 'close-settings'){ ui.settingsOpen = false; renderAll(); return; }
    if (action === 'open-plan'){ ui.planOpen = true; renderAll(); return; }
    if (action === 'close-plan'){ ui.planOpen = false; renderAll(); return; }

    if (action === 'set-plan-day'){
      var dow = Number(btn.getAttribute('data-dow'));
      state.plan[dow] = btn.getAttribute('data-type');
      scheduleSave(); renderAll(); return;
    }
    if (action === 'set-day-type'){
      var dkey = btn.getAttribute('data-key');
      var d = dayOf(dkey);
      d.workoutType = btn.getAttribute('data-type');
      scheduleSave(); renderAll(); return;
    }
    if (action === 'reset-day-type'){
      var dkey2 = btn.getAttribute('data-key');
      dayOf(dkey2).workoutType = null;
      scheduleSave(); renderAll(); return;
    }
    if (action === 'add-nutrition-entry'){
      var nkey = btn.getAttribute('data-key');
      var nameEl = document.getElementById('dd-food-name');
      var name = nameEl.value.trim();
      var cal = num(document.getElementById('dd-food-cal').value, NaN);
      if (!name || !isFinite(cal) || cal <= 0){ nameEl.focus(); return; }
      var p = num(document.getElementById('dd-food-p').value, 0);
      var f = num(document.getElementById('dd-food-f').value, 0);
      var k = num(document.getElementById('dd-food-k').value, 0);
      dayOf(nkey).nutrition.push({ id:newId(), name:name, calories:cal, protein:p, fat:f, carb:k });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'delete-nutrition'){
      var dnkey = btn.getAttribute('data-key'), id = btn.getAttribute('data-id');
      var dd = dayOf(dnkey);
      dd.nutrition = dd.nutrition.filter(function(n){ return n.id !== id; });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'add-exercise'){
      var ekey = btn.getAttribute('data-key');
      var exNameEl = document.getElementById('dd-ex-name');
      var exName = exNameEl.value.trim();
      if (!exName){ exNameEl.focus(); return; }
      dayOf(ekey).exercises.push({ id:newId(), name:exName, sets:[] });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'delete-exercise'){
      var dekey = btn.getAttribute('data-key'), exid = btn.getAttribute('data-exid');
      var ded = dayOf(dekey);
      ded.exercises = ded.exercises.filter(function(ex){ return ex.id !== exid; });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'add-set'){
      var skey = btn.getAttribute('data-key'), sexid = btn.getAttribute('data-exid');
      var sday = dayOf(skey);
      var ex = sday.exercises.filter(function(x){ return x.id === sexid; })[0];
      if (!ex) return;
      var repsEl = document.getElementById('reps-' + sexid);
      var weightEl = document.getElementById('weight-' + sexid);
      var reps = num(repsEl.value, NaN);
      var weight = num(weightEl.value, 0);
      if (!isFinite(reps) || reps <= 0){ repsEl.focus(); return; }
      ex.sets.push({ reps:reps, weight:weight });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'delete-set'){
      var dskey = btn.getAttribute('data-key'), dsexid = btn.getAttribute('data-exid'), setIdx = Number(btn.getAttribute('data-setidx'));
      var dsday = dayOf(dskey);
      var dsex = dsday.exercises.filter(function(x){ return x.id === dsexid; })[0];
      if (dsex) dsex.sets.splice(setIdx, 1);
      scheduleSave(); renderAll(); return;
    }
    if (action === 'step-input'){
      var targetId = btn.getAttribute('data-target');
      var stepVal = num(btn.getAttribute('data-step'), 0);
      var minAttr = btn.getAttribute('data-min');
      var minVal = minAttr !== null ? num(minAttr, 0) : null;
      var inputEl = document.getElementById(targetId);
      if (!inputEl) return;
      var cur = num(inputEl.value, 0);
      var next = Math.round((cur + stepVal) * 100) / 100;
      if (minVal !== null && next < minVal) next = minVal;
      inputEl.value = next;
      return;
    }
    if (action === 'repeat-last-set'){
      var rlKey = btn.getAttribute('data-key'), rlExid = btn.getAttribute('data-exid');
      var rlEx = dayOf(rlKey).exercises.filter(function(x){ return x.id === rlExid; })[0];
      if (!rlEx || !rlEx.sets.length) return;
      var rlLast = rlEx.sets[rlEx.sets.length - 1];
      rlEx.sets.push({ reps: rlLast.reps, weight: rlLast.weight });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'save-settings'){
      var s = state.settings;
      s.goalCalories = num(document.getElementById('s-cal').value, s.goalCalories);
      s.goalProtein = num(document.getElementById('s-p').value, s.goalProtein);
      s.goalFat = num(document.getElementById('s-f').value, s.goalFat);
      s.goalCarb = num(document.getElementById('s-k').value, s.goalCarb);
      s.workoutGoalPerWeek = num(document.getElementById('s-wg').value, s.workoutGoalPerWeek);
      s.cardioGoalMinPerWeek = num(document.getElementById('s-cg').value, s.cardioGoalMinPerWeek);
      s.stepsGoalPerDay = num(document.getElementById('s-sg').value, s.stepsGoalPerDay);
      s.weeklyWeightGoalKg = num(document.getElementById('s-wwg').value, s.weeklyWeightGoalKg);
      s.monthlyWeightGoalKg = num(document.getElementById('s-mwg').value, s.monthlyWeightGoalKg);
      ui.settingsOpen = false;
      scheduleSave(); renderAll(); return;
    }

    if (action === 'open-mealplan'){ ui.mealPlanOpen = true; renderAll(); return; }
    if (action === 'close-mealplan'){ ui.mealPlanOpen = false; renderAll(); return; }
    if (action === 'open-weight-modal'){ ui.weightModalOpen = true; renderAll(); return; }
    if (action === 'close-weight-modal'){ ui.weightModalOpen = false; renderAll(); return; }

    if (action === 'toggle-mealplan-check'){
      var mfkey = btn.getAttribute('data-key'), mfid = btn.getAttribute('data-id');
      var mfItem = state.mealPlan.filter(function(x){ return x.id === mfid; })[0];
      if (!mfItem) return;
      var mfDay = dayOf(mfkey);
      var mfExisting = mfDay.nutrition.filter(function(n){ return n.sourcePlanId === mfid || n.name.toLowerCase() === mfItem.label.toLowerCase(); })[0];
      if (mfExisting){
        mfDay.nutrition = mfDay.nutrition.filter(function(n){ return n.id !== mfExisting.id; });
      } else {
        mfDay.nutrition.push({ id:newId(), name:mfItem.label, calories:mfItem.calories, protein:mfItem.protein, fat:mfItem.fat, carb:mfItem.carb, sourcePlanId:mfid });
      }
      scheduleSave(); renderAll(); return;
    }
    if (action === 'add-mealplan-item'){
      var mpLabelEl = document.getElementById('mp-label');
      var mpLabel = mpLabelEl.value.trim();
      var mpCal = num(document.getElementById('mp-cal').value, NaN);
      if (!mpLabel || !isFinite(mpCal) || mpCal <= 0){ mpLabelEl.focus(); return; }
      var mpP = num(document.getElementById('mp-p').value, 0);
      var mpF = num(document.getElementById('mp-f').value, 0);
      var mpK = num(document.getElementById('mp-k').value, 0);
      state.mealPlan.push({ id:newId(), label:mpLabel, calories:mpCal, protein:mpP, fat:mpF, carb:mpK });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'delete-mealplan-item'){
      var dmpid = btn.getAttribute('data-id');
      state.mealPlan = state.mealPlan.filter(function(x){ return x.id !== dmpid; });
      scheduleSave(); renderAll(); return;
    }

    if (action === 'toggle-exercise-plan-check'){
      var tpKey = btn.getAttribute('data-key'), tpPlanId = btn.getAttribute('data-planid'), tpType = btn.getAttribute('data-type');
      var tpPlanItem = (state.exercisePlans[tpType]||[]).filter(function(x){ return x.id === tpPlanId; })[0];
      if (!tpPlanItem) return;
      var tpDay = dayOf(tpKey);
      var tpExisting = tpDay.exercises.filter(function(ex){ return ex.sourcePlanId === tpPlanId || ex.name.toLowerCase() === tpPlanItem.name.toLowerCase(); })[0];
      if (tpExisting){
        tpDay.exercises = tpDay.exercises.filter(function(ex){ return ex.id !== tpExisting.id; });
      } else {
        tpDay.exercises.push({ id:newId(), name:tpPlanItem.name, sets:[], sourcePlanId:tpPlanId });
      }
      scheduleSave(); renderAll(); return;
    }
    if (action === 'add-planned-exercise'){
      // plan modalından yeni hareket hedefi ekleme
      var peType = btn.getAttribute('data-type');
      var peNameEl = document.getElementById('pe-name-' + peType);
      var peName = peNameEl.value.trim();
      if (!peName){ peNameEl.focus(); return; }
      var peWeightVal = document.getElementById('pe-weight-' + peType).value;
      var peWeight = peWeightVal !== '' ? num(peWeightVal, null) : null;
      if (!state.exercisePlans[peType]) state.exercisePlans[peType] = [];
      state.exercisePlans[peType].push({ id:newId(), name:peName, sets:null, repMin:null, repMax:null, targetWeight:peWeight });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'delete-planned-exercise'){
      var dpeType = btn.getAttribute('data-type'), dpeId = btn.getAttribute('data-planid');
      state.exercisePlans[dpeType] = (state.exercisePlans[dpeType]||[]).filter(function(x){ return x.id !== dpeId; });
      scheduleSave(); renderAll(); return;
    }

    if (action === 'save-weight-entry'){
      var wlDateEl = document.getElementById('wl-date');
      var wlDate = wlDateEl.value;
      var wlKg = num(document.getElementById('wl-kg').value, NaN);
      if (!wlDate || !isFinite(wlKg) || wlKg <= 0){ return; }
      var existing = state.weightLog.filter(function(w){ return w.date === wlDate; })[0];
      if (existing) existing.kg = wlKg;
      else state.weightLog.push({ id:newId(), date:wlDate, kg:wlKg });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'delete-weight-entry'){
      var dwid = btn.getAttribute('data-id');
      state.weightLog = state.weightLog.filter(function(w){ return w.id !== dwid; });
      scheduleSave(); renderAll(); return;
    }

    if (action === 'open-measure-modal'){ ui.measureModalOpen = true; renderAll(); return; }
    if (action === 'close-measure-modal'){ ui.measureModalOpen = false; renderAll(); return; }
    if (action === 'pick-measure-site'){
      var msSiteEl = document.getElementById('ms-site');
      if (msSiteEl) msSiteEl.value = btn.getAttribute('data-site');
      return;
    }
    if (action === 'save-measure-entry'){
      var msDateEl = document.getElementById('ms-date');
      var msDate = msDateEl.value;
      var msSite = document.getElementById('ms-site').value.trim();
      var msVal = num(document.getElementById('ms-val').value, NaN);
      if (!msDate || !msSite || !isFinite(msVal) || msVal <= 0){ return; }
      state.measurements.push({ id:newId(), date:msDate, site:msSite, valueCm:msVal });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'delete-measure-entry'){
      var dmid = btn.getAttribute('data-id');
      state.measurements = state.measurements.filter(function(m){ return m.id !== dmid; });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'save-measure-photo'){
      var mfHintEl = document.getElementById('mf-hint');
      var mfFileEl = document.getElementById('mf-file');
      var mfFile = mfFileEl && mfFileEl.files && mfFileEl.files[0];
      if (!mfFile){ if (mfHintEl) mfHintEl.textContent = 'Önce bir fotoğraf seç.'; return; }
      var mfDate = document.getElementById('mf-date').value || todayKey();
      var mfNote = document.getElementById('mf-note').value.trim();
      if (mfHintEl) mfHintEl.textContent = 'İşleniyor...';
      resizeImageFileToDataUrl(mfFile, 800, 0.55).then(function(dataUrl){
        state.photos.push({ id:newId(), date:mfDate, dataUrl:dataUrl, note:mfNote });
        scheduleSave(); renderAll();
      }).catch(function(){
        var el2 = document.getElementById('mf-hint');
        if (el2) el2.textContent = 'Fotoğraf işlenemedi, tekrar dene.';
      });
      return;
    }
    if (action === 'delete-measure-photo'){
      var dpid = btn.getAttribute('data-id');
      state.photos = state.photos.filter(function(p){ return p.id !== dpid; });
      scheduleSave(); renderAll(); return;
    }

    if (action === 'add-cardio-entry'){
      var ckey = btn.getAttribute('data-key');
      var cType = document.getElementById('dd-cardio-type').value;
      var cDurEl = document.getElementById('dd-cardio-duration');
      var cDur = num(cDurEl.value, NaN);
      if (!isFinite(cDur) || cDur <= 0){ cDurEl.focus(); return; }
      var cDistVal = document.getElementById('dd-cardio-distance').value;
      var cDist = cDistVal !== '' ? num(cDistVal, null) : null;
      var cCal = cardioCalories(cType, cDur, cDist);
      dayOf(ckey).cardio.push({ id:newId(), type:cType, durationMin:cDur, distanceKm:cDist, calories:cCal });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'delete-cardio'){
      var dckey = btn.getAttribute('data-key'), dcid = btn.getAttribute('data-id');
      var dcd = dayOf(dckey);
      dcd.cardio = dcd.cardio.filter(function(c){ return c.id !== dcid; });
      scheduleSave(); renderAll(); return;
    }
    if (action === 'save-steps'){
      var stKey = btn.getAttribute('data-key');
      var stVal = num(document.getElementById('dd-steps').value, NaN);
      dayOf(stKey).steps = (isFinite(stVal) && stVal > 0) ? Math.round(stVal) : null;
      scheduleSave(); renderAll(); return;
    }
    if (action === 'open-week-day'){
      var owdKey = btn.getAttribute('data-key');
      ui.tab = 'workout'; ui.period = 'day'; ui.dayDetailKind = 'workout'; ui.dayDetailKey = owdKey;
      renderAll(); return;
    }
  }

  /* ---------- başlat ---------- */
  renderAll();
  initFirebase();
  setTimeout(function(){
    if (!healthImportApplied){
      healthImportApplied = true;
      if (applyHealthImportFromUrl()) renderAll();
    }
  }, 2500);
})();
</script>
<script>
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
</body>
